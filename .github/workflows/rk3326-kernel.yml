# Build the R36T Max board device tree and kernel on GitHub's hardware.
#
# A hedge, not a release path. Building this on our own aarch64 builder takes
# hours and competes with everything else that machine is doing, so this runs
# the same derivations on a runner instead.
#
# Never triggered from main. nix-cache.yml runs on every push to main and
# holds a signing key, so a trigger there would make a routine kernel build
# kick off a cache publish as a side effect.
#
# That rules out dispatching this the obvious way: GitHub only offers
# workflow_dispatch for workflows already on the default branch, so reaching
# the dispatch button would mean putting the file on main first. A push
# trigger scoped to this spike branch has no such restriction and keeps the
# whole thing off main.
#
# The workflow_dispatch trigger is kept for the day this does live on main.
#
# Nothing here publishes. The unit of publication is a device's system closure
# and this board is not a device yet, so there is nothing for the publisher to
# name and no secret is used.
#
# The kernel is cross-built from x86_64, which is how the repo already builds
# odin2portal-kernel and rgds-kernel. GitHub offers no aarch64 runner here and
# cross is faster than emulation.
name: rk3326-kernel

on:
  push:
    branches: [spike/rk3326-kernel]
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        options:
          - boardKernelTrimmedCross
          - boardDtbCross
          - boardKernelCross
          - sdImage
        required: true
        default: sdImage

permissions:
  contents: read

concurrency:
  group: rk3326-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ inputs.target || 'sdImage' }}
    # The SD image is a whole NixOS closure and is built natively on aarch64,
    # the way device-images.yml already builds this repo's device images, so
    # it needs an arm runner. The cross targets do not, and run faster on the
    # x86 one. A push supplies no input, so the default has to appear on both
    # sides of this expression.
    runs-on: ${{ (inputs.target || 'sdImage') == 'sdImage' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before Nix is installed: this reformats the runner's spare disk into
      # /nix. A GitHub runner otherwise offers about 20 GB, and a kernel build
      # needs more than that.
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          hatchet-protocol: cleave

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build
        env:
          # No aarch64 builder exists here, and the cross attributes do not
          # need one.
          KORRI_AARCH64_BUILDER: none
        id: build
        run: |
          out="$(./nix/spikes/rk3326-stock-shell/build "${{ inputs.target || 'sdImage' }}")"
          echo "out=$out" >> "$GITHUB_OUTPUT"

      # Without this the image exists only in the runner's store, which is
      # discarded when the job ends. A green build that leaves nothing behind
      # cannot be written to a card.
      - name: Stage the image
        if: ${{ (inputs.target || 'sdImage') == 'sdImage' }}
        run: |
          mkdir -p "$RUNNER_TEMP/image"
          cp -L "${{ steps.build.outputs.out }}"/sd-image/*.img.zst "$RUNNER_TEMP/image/"
          ls -la "$RUNNER_TEMP/image"
          sha256sum "$RUNNER_TEMP/image"/*.img.zst | tee "$RUNNER_TEMP/image/SHA256SUMS"

      - name: Upload the image
        if: ${{ (inputs.target || 'sdImage') == 'sdImage' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nixos-r36t-max-sd-image
          path: ${{ runner.temp }}/image
          retention-days: 7
          compression-level: 0
