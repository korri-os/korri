name: Device images

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish an unverified RG353M prerelease (select an existing tag, not a branch)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: device-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: RG353M SD image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Require a tag for prerelease publication
        env:
          PUBLISH: ${{ inputs.publish }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$PUBLISH" = true ] && [ "$REF_TYPE" != tag ]; then
            echo 'Select an existing tag to publish; branch builds produce Actions artifacts only.' >&2
            exit 1
          fi

      - name: Check out the selected commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            max-jobs = 2
            cores = 2

      - name: Report available disk space
        run: df -h / /nix

      - name: Check shared device policy and distribution tooling
        run: |
          nix run .#nixos-layout-check
          nix run .#device-image-dist-check

      - name: Build and stage the RG353M image
        run: nix run .#device-image-dist -- packages.aarch64-linux.rg353m-sd-image "$RUNNER_TEMP/rg353m-dist"

      - name: Upload build candidate
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rg353m-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rg353m-dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish unverified RG353M prerelease
    if: ${{ inputs.publish && github.ref_type == 'tag' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out the exact build revision and tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download this build's artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/rg353m-dist
          merge-multiple: true

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check artifact integrity and tag identity
        id: verify
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          if [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo 'The release tag no longer names the commit that was built.' >&2
            exit 1
          fi
          image="$(nix run .#device-image-verify -- "$RUNNER_TEMP/rg353m-dist" "$GITHUB_SHA" --release)"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"

      - name: Publish prerelease without replacing existing releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.verify.outputs.image }}
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/rg353m-dist"
          notes="RG353M build candidate. This artifact has not been boot-verified on hardware.

          Source commit: $GITHUB_SHA

          SSH is disabled and no personal SSH key or WiFi credentials are included.
          Physical recovery consoles, including USB serial, remain enabled and grant root access.
          First-boot setup and plugin support are TBD. Hardware verification follows separately."
          # Upload into a draft first: an upload failure must not expose a partial release.
          # An existing tag's release is never overwritten, including failed drafts.
          gh release create --verify-tag --draft --prerelease --latest=false \
            --title "RG353M image $RELEASE_TAG (unverified)" --notes "$notes" \
            -- "$RELEASE_TAG" "$dist/$IMAGE" "$dist/$IMAGE.sha256" "$dist/korri-revision.txt"
          gh release edit --draft=false --prerelease --latest=false -- "$RELEASE_TAG"
