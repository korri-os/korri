name: Korri checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: korri-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Host, portal, and surface
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A cold korrid build is most of this job. Line tables keep file and line
    # numbers in panics and backtraces but drop the rest of the debug info:
    # measured locally, the target directory falls from 21 GB to 7.8 GB and
    # the test build is about 13% faster. Incremental artifacts only help a
    # repeat build of the same tree, which a fresh runner never does.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Check out Korri
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run host, portal, and surface checks
        run: nix run .#korrid-check
