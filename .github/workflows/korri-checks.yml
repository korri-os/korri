name: Korri checks

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: korri-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Host, portal, surface, and Android JVM
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out Korri
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run host, portal, surface, and Android JVM checks
        run: nix run .#korrid-check
