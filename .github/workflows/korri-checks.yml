name: Korri checks

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Full regression, affected diff, or an affected-path timing probe (never publishes)
        type: choice
        options: [full, affected, probe]
        default: full
      source_sha:
        description: Optional full tested commit SHA; empty uses the dispatched commit
        type: string
        default: ""
      probe_paths:
        description: JSON array of repository paths, required in probe mode
        type: string
        default: "[]"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: korri-checks-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
  cancel-in-progress: true

jobs:
  select:
    name: Select affected checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      policy: ${{ steps.plan.outputs.policy }}
      cache: ${{ steps.plan.outputs.cache }}
      fmt: ${{ steps.plan.outputs.fmt }}
      treaty: ${{ steps.plan.outputs.treaty }}
      portal: ${{ steps.plan.outputs.portal }}
      parity: ${{ steps.plan.outputs.parity }}
      cli: ${{ steps.plan.outputs.cli }}
      korrid: ${{ steps.plan.outputs.korrid }}
      inputd: ${{ steps.plan.outputs.inputd }}
      limitsd: ${{ steps.plan.outputs.limitsd }}
      pico: ${{ steps.plan.outputs.pico }}
      zone: ${{ steps.plan.outputs.zone }}
      boxbuster: ${{ steps.plan.outputs.boxbuster }}
      acceptance: ${{ steps.plan.outputs.acceptance }}
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Test selection and failure propagation before choosing omissions
        run: python3 .github/ci/check-plan.test.py
      - name: Select checks (unknown inputs broaden to full)
        id: plan
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || ((github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'ci-full')) && 'full' || 'affected') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PROBE_PATHS: ${{ inputs.probe_paths || '[]' }}
        run: python3 .github/ci/check-plan.py select --mode "$MODE" --base "$BASE_SHA" --head HEAD --fetch-base --paths "$PROBE_PATHS"
  policy:
    name: CI policy and orchestration
    needs: select
    if: needs.select.outputs.policy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run ci-plan-check
        run: nix run .#ci-plan-check
  cache:
    name: Cache and delivery policy
    needs: select
    if: needs.select.outputs.cache == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test cache reads and publication protocol without publishing
        run: nix run .#korri-nix-cache-check
      - name: Check existing delivery workflow safety and failure propagation
        run: nix run .#rpminiv2-delivery-check
  fmt:
    name: Rust formatting
    needs: select
    if: needs.select.outputs.fmt == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run korrid-fmt-check
        run: nix run .#korrid-fmt-check
  treaty:
    name: Generated treaty and plugin declarations
    needs: select
    if: needs.select.outputs.treaty == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run korrid-treaty-check
        run: nix run .#korrid-treaty-check
  portal:
    name: Portal types, tests, and bundle
    needs: select
    if: needs.select.outputs.portal == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run portal-check
        run: nix run .#portal-check
      - name: Run portal-bundle
        run: nix run .#portal-bundle
  parity:
    name: Portal and CLI producer parity
    needs: select
    if: needs.select.outputs.parity == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Check producer parity without Rust compilation
        run: python3 clients/cli/tests/parity.py
  cli:
    name: Person CLI
    needs: select
    if: needs.select.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Preserve baseline compiler policy; do not create redundant cargo check/test builds.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run cli-check
        run: nix run .#cli-check
      - name: Check CLI dependency and final derivation identities without duplicate builds
        run: nix run .#cli-build-identity-eval-check
  korrid:
    name: Korrid tests, config, and real RPC smoke
    needs: select
    if: needs.select.outputs.korrid == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Preserve baseline compiler policy; do not create redundant cargo check/test builds.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run korrid-host-check
        run: nix run .#korrid-host-check
  inputd:
    name: Input service (module/VM checks only in full mode)
    needs: select
    if: needs.select.outputs.inputd == 'true'
    runs-on: ubuntu-24.04
    # Affected coverage is Rust/wasm/shell only. Full mode additionally runs
    # all module/package/VM checks, which DO depend on korridPackage.
    timeout-minutes: 45
    # Preserve baseline compiler policy; do not create redundant cargo check/test builds.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Enable the disposable Inputd module VMs
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          # Wait for udev to apply permissions before checking runner access.
          sudo udevadm trigger --settle --name-match=kvm
          test -r /dev/kvm -a -w /dev/kvm
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run inputd-check --fast
        if: fromJSON(needs.select.outputs.plan).mode != 'full'
        run: nix run .#inputd-check -- --fast
      - name: Run inputd-check
        if: fromJSON(needs.select.outputs.plan).mode == 'full'
        run: nix run .#inputd-check
  limitsd:
    name: Launch limits service
    needs: select
    if: needs.select.outputs.limitsd == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Preserve baseline compiler policy; do not create redundant cargo check/test builds.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run limitsd-check
        run: nix run .#limitsd-check
  pico:
    name: Pico surface
    needs: select
    if: needs.select.outputs.pico == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run pico-check
        run: nix run .#pico-check
  zone:
    name: Zone surface
    needs: select
    if: needs.select.outputs.zone == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run zone-check
        run: nix run .#zone-check
  boxbuster:
    name: Boxbuster surface
    needs: select
    if: needs.select.outputs.boxbuster == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run boxbuster-check
        run: nix run .#boxbuster-check
  check:
    name: Host, portal, and surface
    if: always()
    needs: [select, policy, cache, fmt, treaty, portal, parity, cli, korrid, inputd, limitsd, pico, zone, boxbuster]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Require selected successes and validate every deliberate skip
        env:
          PLAN: ${{ needs.select.outputs.plan }}
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/ci/check-plan.py aggregate --scope checks
