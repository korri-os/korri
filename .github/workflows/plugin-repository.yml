name: Prepare plugin repository release

on:
  workflow_dispatch:
    inputs:
      destination:
        description: "Explicit GitHub OWNER/REPOSITORY for archive URLs (draft writes only to this repository)"
        required: true
        type: string
      tag:
        description: "New release tag; must already point at this main commit before draft creation"
        required: true
        type: string
      release_label:
        description: "New plugin release label, independent of upstream Tailscale version"
        required: true
        type: string
      create_draft:
        description: "Approve creating a draft and uploading verified archives (never publishes)"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: plugin-repository-${{ inputs.destination }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  PLUGIN_DESTINATION: ${{ inputs.destination }}
  PLUGIN_TAG: ${{ inputs.tag }}
  PLUGIN_RELEASE: ${{ inputs.release_label }}

jobs:
  guard:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 services/korrid/plugin-host/publication.py guard

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check only plugin, host, and download policy outputs
        env:
          SYSTEM: ${{ matrix.system }}
        run: >-
          nix build --no-link
          ".#checks.$SYSTEM.korri-plugin-host"
          ".#checks.$SYSTEM.korri-tailscale-package"
          ".#checks.$SYSTEM.korri-device-cache"
          ".#checks.$SYSTEM.korri-input-module"
          ".#checks.$SYSTEM.korri-bundle-module"
          ".#checks.$SYSTEM.korri-publication-workflow"
      - name: Rust formatting
        run: nix develop .#plugin-host --command cargo fmt --manifest-path services/korrid/plugin-host/Cargo.toml -- --check
      - name: Rust lint
        run: nix develop .#plugin-host --command cargo clippy --manifest-path services/korrid/plugin-host/Cargo.toml --all-targets -- -D warnings
      - name: Actual publisher tests in the writable build-machine store
        run: nix run .#korri-publisher-check
      - name: Prepare complete Tailscale archive and its Rust catalog record
        env:
          SYSTEM: ${{ matrix.system }}
        run: python3 services/korrid/plugin-host/publication.py build "$SYSTEM" "$RUNNER_TEMP/plugin"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-${{ matrix.system }}
          path: ${{ runner.temp }}/plugin/
          if-no-files-found: error
          retention-days: 7

  lifecycle:
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cold-host HTTPS and lifecycle acceptance
        run: nix build --no-link .#checks.x86_64-linux.korri-runtime-plugin-host

  assemble:
    needs: [build, lifecycle]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: plugin-*
          path: artifacts
      - name: Merge with the Rust reader contract and verify both assets
        run: python3 services/korrid/plugin-host/publication.py assemble artifacts prepared
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-release-assets
          path: prepared/assets/
          if-no-files-found: error
          retention-days: 7
      - name: Small catalog is separate; not deployed by this workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-catalog
          path: prepared/catalog.json
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: assemble
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && inputs.create_draft
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: plugin-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-release-assets
          path: prepared/assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plugin-catalog
          path: prepared
      - name: Build the trusted validator before exposing a write token
        run: nix build --out-link publisher .#korri-plugin-host
      - name: Create draft, upload all assets without overwrite, and verify downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KORRI_PUBLICATION_PUBLISHER: ./publisher/bin/korri-publish
          PLUGIN_CREATE_DRAFT: ${{ inputs.create_draft }}
        run: python3 services/korrid/plugin-host/publication.py draft prepared
