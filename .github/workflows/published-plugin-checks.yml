name: Published plugin acceptance

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: published-plugin-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out current Core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Enable the disposable lifecycle VM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm -a -w /dev/kvm
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test Nix cache preparation
        run: python3 .github/workflows/test_prepare_nix_cache.py
      # PRs can restore main's store. Each run saves a new snapshot so a
      # failed cold run does not freeze an incomplete cache under a shared key.
      - name: Restore the Nix store
        id: nix-store
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: published-plugins-${{ runner.os }}-${{ hashFiles('flake.lock', 'nix/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-prefixes-first-match: |
            published-plugins-${{ runner.os }}-${{ hashFiles('flake.lock', 'nix/**') }}-
            published-plugins-${{ runner.os }}-
      - name: Read existing signed Core outputs
        run: .github/workflows/trust-korri-cache.sh
      # Leave time to save partial downloads before the job's 60-minute limit.
      - name: Test Core without rebuilding or publishing plugins
        timeout-minutes: 40
        run: nix run .#korri-published-plugins-check
      - name: Prepare the Nix store for caching
        id: prepare-nix-store
        if: always() && steps.nix-store.outcome == 'success'
        timeout-minutes: 3
        run: python3 .github/workflows/prepare-nix-cache.py
      # Preserve downloaded paths even after a failed check. Do not run GC:
      # --no-link checks leave useful outputs unrooted after they finish.
      - name: Save the Nix store
        if: always() && steps.prepare-nix-store.outcome == 'success'
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: ${{ steps.nix-store.outputs.primary-key }}
