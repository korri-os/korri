name: Published plugin acceptance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Full regression, affected diff, or an affected-path timing probe (never publishes)
        type: choice
        options: [full, affected, probe]
        default: full
      source_sha:
        description: Optional full tested commit SHA; empty uses the dispatched commit
        type: string
        default: ""
      probe_paths:
        description: JSON array of repository paths, required in probe mode
        type: string
        default: "[]"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: '43 3 * * 1'

permissions:
  contents: read

concurrency:
  group: published-plugin-acceptance-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'automatic' }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Published plugin acceptance result
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the exact tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Test selection and failure propagation before choosing omissions
        run: python3 .github/ci/check-plan.test.py
      - name: Select checks (unknown inputs broaden to full)
        id: plan
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || ((github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'ci-full')) && 'full' || 'affected') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PROBE_PATHS: ${{ inputs.probe_paths || '[]' }}
        run: python3 .github/ci/check-plan.py select --mode "$MODE" --base "$BASE_SHA" --head HEAD --fetch-base --paths "$PROBE_PATHS"
      - name: Enable the disposable lifecycle VM
        if: steps.plan.outputs.acceptance == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          # Wait for udev to apply permissions before checking runner access.
          sudo udevadm trigger --settle --name-match=kvm
          test -r /dev/kvm -a -w /dev/kvm
      - name: Install Nix
        if: steps.plan.outputs.acceptance == 'true'
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test Nix cache preparation
        if: steps.plan.outputs.acceptance == 'true'
        run: python3 .github/workflows/test_prepare_nix_cache.py
      # The snapshot is about 9 GB and takes about 7 minutes to save, so save
      # it only when the inputs that fill it change: the Nix and Cargo locks,
      # the published plugin pins, or the ISO week. The week bounds how far the
      # store drifts from Core's own derivations between lock changes.
      - name: Name the Nix store snapshot
        if: steps.plan.outputs.acceptance == 'true'
        id: nix-store-key
        env:
          INPUTS: ${{ hashFiles('flake.lock', 'services/korrid/Cargo.lock', 'services/korrid/plugin-host/Cargo.lock', 'nix/product/published-plugins.nix') }}
        run: printf 'prefix=published-plugins-%s-%s-\nkey=published-plugins-%s-%s-%s\n' "$RUNNER_OS" "$INPUTS" "$RUNNER_OS" "$INPUTS" "$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # PRs can restore main's store. A successful check saves a complete
      # snapshot per key. Failed runs use separate keys so a partial store
      # cannot freeze the key's complete cache.
      - name: Restore the Nix store
        if: steps.plan.outputs.acceptance == 'true'
        id: nix-store
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: ${{ steps.nix-store-key.outputs.key }}
          restore-prefixes-first-match: |
            ${{ steps.nix-store-key.outputs.key }}-
            ${{ steps.nix-store-key.outputs.prefix }}
            published-plugins-${{ runner.os }}-
      - name: Read existing signed Core outputs
        if: steps.plan.outputs.acceptance == 'true'
        run: .github/workflows/trust-korri-cache.sh
      # Leave time to save partial downloads before the job's 60-minute limit.
      - name: Test Core without rebuilding or publishing plugins
        if: steps.plan.outputs.acceptance == 'true'
        id: published-plugins-check
        timeout-minutes: 40
        run: nix run .#korri-published-plugins-check
      - name: Prepare the Nix store for caching
        id: prepare-nix-store
        if: always() && steps.plan.outputs.acceptance == 'true' && steps.nix-store.outcome == 'success' && steps.nix-store.outputs.hit-primary-key != 'true'
        timeout-minutes: 3
        run: python3 .github/workflows/prepare-nix-cache.py
      # Preserve downloaded paths even after a failed check. Do not run GC:
      # --no-link checks leave useful outputs unrooted after they finish.
      - name: Save the Nix store
        if: always() && steps.plan.outputs.acceptance == 'true' && steps.prepare-nix-store.outcome == 'success'
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: ${{ steps.published-plugins-check.outcome == 'success' && steps.nix-store.outputs.primary-key || format('{0}-{1}-{2}', steps.nix-store.outputs.primary-key, github.run_id, github.run_attempt) }}
      # Adapt actual step outcomes, never conclusions or a synthetic success.
      # A selected missing/skipped/cancelled check still fails closed.
      - name: Require selected success and validate a deliberate skip
        if: always()
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
          NEEDS: >-
            {"select":{"result":"${{ steps.plan.outcome }}"},
             "acceptance":{"result":"${{ steps.published-plugins-check.outcome }}"}}
        run: python3 .github/ci/check-plan.py aggregate --scope published
