# Publish what devices install to Korri's signed Nix cache.
#
# A device may not build: nix/device-cache/nixos-module.nix forces max-jobs = 0
# and fallback = false. Anything a generation needs and no public cache serves
# has to be in Korri's cache before the device can install it, so this runs on
# every push to main rather than on demand.
#
# Two jobs because a device closure is not one architecture. Odin 2 Portal and
# RP Mini V2 cross-build their kernels and firmware on x86_64. The x86_64 job
# publishes those outputs first, so the aarch64 jobs substitute them instead of
# failing on work they cannot do.
#
# Both runners are GitHub-hosted and native, so no build depends on a machine of
# ours being awake. There is no pull_request trigger: this workflow holds a
# signing key, and a fork must never reach it.
name: nix-cache

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nix-cache
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cross:
    name: cross-built outputs (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Before Nix is installed: this reformats the runner's spare disk into
      # /nix. A GitHub runner otherwise offers about 20 GB, and a kernel build
      # needs more than that.
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          hatchet-protocol: cleave

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Trust Korri's cache
        run: .github/workflows/trust-korri-cache.sh

      - name: Stage the signing key
        env:
          SIGNING_KEY: ${{ secrets.KORRI_CACHE_SECRET_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/cache-key.secret"
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/cache-key.secret"

      # /nix has the room and root owns /nix/var, so the directory has to be
      # handed over before an unprivileged publish can write a signed cache.
      - name: Make room for the signed cache
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /nix/var/korri-nix-cache

      # The one list here that is not derived, so check it rather than trust it.
      # An attribute belongs here only if its derivation appears in a device's
      # build closure; today Odin 2 Portal and RP Mini V2 cross-build inputs,
      # while the other exported device kernels are native aarch64:
      #
      #   nix derivation show -r .#nixosConfigurations.<device>.config.system.build.toplevel \
      #     | jq -r '.derivations | has("<drv name>")'
      #
      # korri-chromium-aarch64 is deliberately absent. It is a cross-build no
      # device uses — every device closure carries an aarch64 chromium — and
      # building it here cost two runs of over an hour each before it was caught.
      - name: Publish cross-built outputs
        env:
          KORRI_CACHE_SECRET_KEY: ${{ runner.temp }}/cache-key.secret
          # Sign into the filesystem that has room. nothing-but-nix carves its
          # volume out of /mnt, so /nix holds ~107 GB while /mnt keeps almost
          # nothing, and a default temporary directory lands on /mnt.
          KORRI_CACHE_STORE: /nix/var/korri-nix-cache
          GH_TOKEN: ${{ secrets.KORRI_CACHE_GITHUB_TOKEN }}
        run: |
          nix run .#korri-nix-cache-publish -- \
            --package packages.x86_64-linux.odin2portal-kernel \
            --package packages.x86_64-linux.odin2portal-rescue-kernel \
            --package packages.x86_64-linux.odin2portal-firmware \
            --package packages.x86_64-linux.rpminiv2-kernel \
            --package packages.x86_64-linux.rpminiv2-firmware \
            --package packages.x86_64-linux.korri-portal

  # One device per runner. Signing a closure means writing a second, compressed
  # copy of it next to the closure itself, so three devices on one runner needs
  # three of each: the first attempt built all three, then ran out of disk while
  # signing, four hours in. A matrix also lets the three run at once and keeps one
  # device's failure from hiding another's result.
  devices:
    name: ${{ matrix.device }} closure (aarch64)
    needs: cross
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        device: [odin2portal, rg353m, rgds, rpminiv2, r36tmax]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          hatchet-protocol: cleave

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Without this the job cannot fetch what the job before it just published,
      # and an aarch64 runner then tries to build the cross-compiled firmware
      # itself, which fails on a platform mismatch rather than on anything real.
      - name: Trust Korri's cache
        run: .github/workflows/trust-korri-cache.sh

      - name: Stage the signing key
        env:
          SIGNING_KEY: ${{ secrets.KORRI_CACHE_SECRET_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/cache-key.secret"
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/cache-key.secret"

      - name: Make room for the signed cache
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /nix/var/korri-nix-cache

      - name: Check RP Mini V2 device contracts
        if: ${{ matrix.device == 'rpminiv2' }}
        run: nix run .#rpminiv2-check

      - name: Check R36T Max device contracts
        if: ${{ matrix.device == 'r36tmax' }}
        run: nix run .#r36tmax-check

      # The kernel is named as well as the closure, because a closure only holds
      # what a device installs. Building the out-of-tree display driver needs the
      # kernel's dev output, which no device installs and no closure therefore
      # carries, so a cold runner rebuilt the whole kernel to obtain it: 1 h 50 m
      # for one output it could not download.
      - name: Publish the device closure
        env:
          KORRI_CACHE_SECRET_KEY: ${{ runner.temp }}/cache-key.secret
          # See the cross job: /mnt is nearly full once the Nix volume is carved
          # from it, and signing a closure writes a second copy of it.
          KORRI_CACHE_STORE: /nix/var/korri-nix-cache
          GH_TOKEN: ${{ secrets.KORRI_CACHE_GITHUB_TOKEN }}
        run: |
          nix run .#korri-nix-cache-publish -- "${{ matrix.device }}" \
            --package "nixosConfigurations.${{ matrix.device }}.config.boot.kernelPackages.kernel"
