# Publish what devices install to Korri's signed Nix cache.
#
# A device may not build: nix/device-cache/nixos-module.nix forces max-jobs = 0
# and fallback = false. Anything a generation needs and no public cache serves
# has to be in Korri's cache before the device can install it, so this runs on
# every push to main rather than on demand.
#
# Two jobs because a device closure is not one architecture. Odin 2 Portal and
# RP Mini V2 cross-build their kernels and firmware on x86_64. The x86_64 job
# publishes those outputs first and waits for Pages metadata visibility, so the
# aarch64 jobs substitute them instead of
# failing on work they cannot do.
#
# Both runners are GitHub-hosted and native, so no build depends on a machine of
# ours being awake. There is no pull_request trigger: this workflow holds a
# signing key, and a fork must never reach it.
name: nix-cache

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nix-cache
  cancel-in-progress: false

permissions:
  contents: read

# Each publisher puts its NARs in its own release: batch-<date>-<run><slot>,
# slot 0 for the cross job and 1-7 for the device jobs. GitHub caps a release
# at 1,000 assets. One shared daily release filled up on 2026-10-22 (852 assets
# before the save sync closures; r36tmax then failed in run 39761993867), and
# seven jobs uploading at once cannot share a capacity check safely. The tag
# stays inside publish.sh's batch-YYYY-MM-DD-N pattern.

jobs:
  cross:
    name: cross-built outputs (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Before Nix is installed: this reformats the runner's spare disk into
      # /nix. A GitHub runner otherwise offers about 20 GB, and a kernel build
      # needs more than that.
      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          hatchet-protocol: cleave

      # Nix detects KVM during installation. Settle real device permissions
      # first, as in published-plugin-checks.yml; do not advertise a missing KVM.
      - name: Enable the RP Mini V2 volume VM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --settle --name-match=kvm
          test -r /dev/kvm -a -w /dev/kvm

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Trust Korri's cache
        run: .github/workflows/trust-korri-cache.sh

      - name: Check the signed cache publisher
        run: nix run .#korri-nix-cache-check

      # The volume boundary uses native PipeWire and wpctl, not board hardware.
      # Run its real KVM test here: the hosted ARM runners do not provide KVM.
      - name: Check the RP Mini V2 volume sandbox
        run: nix build --no-link .#checks.x86_64-linux.rpminiv2-volume

      - name: Stage the signing key
        env:
          SIGNING_KEY: ${{ secrets.KORRI_CACHE_SECRET_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/cache-key.secret"
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/cache-key.secret"

      # /nix has the room and root owns /nix/var, so the directory has to be
      # handed over before an unprivileged publish can write a signed cache.
      - name: Make room for the signed cache
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /nix/var/korri-nix-cache

      # The one list here that is not derived, so check it rather than trust it.
      # An attribute belongs here only if its derivation appears in a device's
      # build or check closure; today Odin 2 Portal, RP Mini V2 and the H700 devices
      # cross-build inputs, while the other exported device kernels are native
      # aarch64. h700-uboot is in the H700 image derivation, not the toplevel:
      #
      #   nix derivation show -r .#nixosConfigurations.<device>.config.system.build.toplevel \
      #     | jq -r '.derivations | has("<drv name>")'
      #
      # RP Mini V2's module check also reads the recovery kernel's DTB. Its
      # derivation differs from the product kernel, so publish both packages.
      # The module and image checks also consume an x86 DT-driver audit report;
      # the kernel's runtime closure does not include that build-time gate.
      #
      # korri-chromium-aarch64 is deliberately absent. It is a cross-build no
      # device uses — every device closure carries an aarch64 chromium — and
      # building it here cost two runs of over an hour each before it was caught.
      - name: Publish cross-built outputs
        env:
          KORRI_CACHE_SECRET_KEY: ${{ runner.temp }}/cache-key.secret
          # Sign into the filesystem that has room. nothing-but-nix carves its
          # volume out of /mnt, so /nix holds ~107 GB while /mnt keeps almost
          # nothing, and a default temporary directory lands on /mnt.
          KORRI_CACHE_STORE: /nix/var/korri-nix-cache
          GH_TOKEN: ${{ secrets.KORRI_CACHE_GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          KORRI_CACHE_BATCH_TAG="batch-$(date -u +%Y-%m-%d)-${RUN_NUMBER}0"
          export KORRI_CACHE_BATCH_TAG
          nix run .#korri-nix-cache-publish -- \
            --package packages.x86_64-linux.odin2portal-kernel \
            --package packages.x86_64-linux.odin2portal-rescue-kernel \
            --package packages.x86_64-linux.odin2portal-firmware \
            --package packages.x86_64-linux.rpminiv2-kernel \
            --package packages.x86_64-linux.rpminiv2-recovery-kernel \
            --package packages.x86_64-linux.rpminiv2-dt-driver-check \
            --package packages.x86_64-linux.rpminiv2-firmware \
            --package packages.x86_64-linux.rpminiv2-rocknix-baseline \
            --package packages.x86_64-linux.h700-kernel \
            --package packages.x86_64-linux.h700-uboot \
            --package packages.x86_64-linux.korri-portal

  # One device per runner. Signing a closure means writing a second, compressed
  # copy of it next to the closure itself, so three devices on one runner needs
  # three of each: the first attempt built all three, then ran out of disk while
  # signing, four hours in. A matrix also lets the three run at once and keeps one
  # device's failure from hiding another's result.
  devices:
    name: ${{ matrix.device }} closure (aarch64)
    needs: cross
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        device: [odin2portal, rg353m, rgds, rpminiv2, r36tmax, rg35xxsp, rg35xxpro]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: wimpysworld/nothing-but-nix@687c797a730352432950c707ab493fcc951818d7 # v10
        with:
          hatchet-protocol: cleave

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Without this the job cannot fetch what the job before it just published,
      # and an aarch64 runner then tries to build the cross-compiled firmware
      # itself, which fails on a platform mismatch rather than on anything real.
      - name: Trust Korri's cache
        run: .github/workflows/trust-korri-cache.sh

      # Device evaluation needs the pinned publisher outputs even before a
      # build starts. Keep both caches in NIX_CONFIG for checks and publishing.
      - name: Fetch only signed default plugin packages
        run: bash .github/workflows/fetch-image-plugins.sh "${{ matrix.device }}"

      - name: Stage the signing key
        env:
          SIGNING_KEY: ${{ secrets.KORRI_CACHE_SECRET_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/cache-key.secret"
          printf '%s' "$SIGNING_KEY" > "$RUNNER_TEMP/cache-key.secret"

      - name: Make room for the signed cache
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /nix/var/korri-nix-cache

      - name: Check RP Mini V2 device contracts
        if: ${{ matrix.device == 'rpminiv2' }}
        run: |
          nix build --no-link \
            .#checks.aarch64-linux.rpminiv2 \
            .#checks.aarch64-linux.rpminiv2-inputd-action

      - name: Check R36T Max device contracts
        if: ${{ matrix.device == 'r36tmax' }}
        run: nix run .#r36tmax-check

      # The kernel is named as well as the closure, because a closure only holds
      # what a device installs. Building the out-of-tree display driver needs the
      # kernel's dev output, which no device installs and no closure therefore
      # carries, so a cold runner rebuilt the whole kernel to obtain it: 1 h 50 m
      # for one output it could not download.
      # No device installs korrid's Rust dependency artifacts either. Publish
      # them so builders can substitute them again after garbage collection.
      # Only one job publishes them. The dependency build is not bit for bit
      # reproducible, and every device job builds it at the same time when
      # Cargo.lock changes; run 39721502192 failed on the second copy.
      #
      # Build everything first, and retry the build. GitHub release downloads
      # sometimes answer 404 for a NAR that exists. Nix does not retry a 404:
      # it builds the path instead, and a cross-built kernel cannot be built
      # here. Run 39761993867 failed that way on odin2portal. A retry
      # downloads the NAR again; the publish step below then has nothing
      # left to build.
      - name: Publish the device closure
        env:
          KORRI_CACHE_SECRET_KEY: ${{ runner.temp }}/cache-key.secret
          # See the cross job: /mnt is nearly full once the Nix volume is carved
          # from it, and signing a closure writes a second copy of it.
          KORRI_CACHE_STORE: /nix/var/korri-nix-cache
          GH_TOKEN: ${{ secrets.KORRI_CACHE_GITHUB_TOKEN }}
          DEVICE: ${{ matrix.device }}
          RUN_NUMBER: ${{ github.run_number }}
          JOB_INDEX: ${{ strategy.job-index }}
        run: |
          KORRI_CACHE_BATCH_TAG="batch-$(date -u +%Y-%m-%d)-${RUN_NUMBER}$((JOB_INDEX + 1))"
          export KORRI_CACHE_BATCH_TAG
          attributes=("nixosConfigurations.$DEVICE.config.boot.kernelPackages.kernel")
          if [ "$DEVICE" = odin2portal ]; then
            attributes+=(packages.aarch64-linux.korrid.cargoArtifacts)
          fi
          targets=(".#nixosConfigurations.$DEVICE.config.system.build.toplevel")
          packages=()
          for attribute in "${attributes[@]}"; do
            targets+=(".#$attribute^*")
            packages+=(--package "$attribute")
          done
          for attempt in 1 2 3; do
            if nix build --no-link "${targets[@]}"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "device closure build failed; retry $((attempt + 1))/3 in $((attempt * 60))s" >&2
            sleep "$((attempt * 60))"
          done
          nix run .#korri-nix-cache-publish -- "$DEVICE" "${packages[@]}"
