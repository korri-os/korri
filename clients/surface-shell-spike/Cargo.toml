# THROWAWAY SPIKE: runtime Slint packages, not a product shell.
[package]
name = "surface-shell-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "backend-winit-wayland", "backend-winit-x11", "unstable-winit-030"] }
slint-interpreter = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "backend-winit-wayland", "backend-winit-x11", "internal"] }
# Public ValueType unifies int/float. Detailed compiler metadata preserves their distinction.
i-slint-compiler = "=1.18.1"
fontique = { version = "=0.11.1", features = ["fontconfig-dlopen"] }
rquickjs = "=0.14.0"
serde_json = "1"
anyhow = "1"
base64 = "0.22"
evdev = "0.13"
pollster = "0.4"

[profile.release]
opt-level = 3
codegen-units = 4
