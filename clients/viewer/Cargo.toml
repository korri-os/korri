[package]
name = "korri-viewer"
version = "0.1.0"
edition = "2024"
# Zlib: the controller lists of Valve and SDL (src/android/controller_list.rs).
license = "GPL-3.0-or-later AND GPL-3.0-only AND Zlib"

[features]
# nightjar-core (vendor/nightjar, GPL-3.0-only) as a second network core,
# chosen with `-networkcore nightjar` (#391 step E). Linux only for now. Off
# by default: the C core streams.
nightjar = ["dep:nightjar-core", "dep:rubylight-protocol"]

[dependencies]
korri-viewer-treaty = { path = "../../contracts/viewer" }
nightjar-core = { path = "vendor/nightjar/protocol/client", optional = true }
# nightjar-core's wire constants (its audio codec bits).
rubylight-protocol = { path = "vendor/nightjar/protocol/core", optional = true }
anyhow = "1"
curl = "0.4"
openssl = "0.10"
roxmltree = "0.21"
libc = "0.2"
url = "2.5"
uuid = { version = "1", features = ["v4"] }

# Android has no libcurl. Build the crate's own copy of curl, the release that
# nixpkgs gives Linux, against the OpenSSL that android.nix supplies.
[target.'cfg(target_os = "android")'.dependencies]
curl = { version = "0.4", features = ["static-curl"] }
# The one option that the curl crate cannot reset: CURLOPT_CAPATH to NULL.
curl-sys = "0.4"
# The picture (src/android/picture.rs): AMediaCodec and the app's Surface, and
# Android's decoder list through JNI. The releases that the app's
# android-activity uses.
jni = "0.21"
ndk = { version = "0.9", default-features = false, features = ["media", "nativewindow"] }
# AMediaCodec's buffer calls without the ndk crate's panic on a NULL buffer,
# and AAudio with Korri's own callbacks (src/android/sound.rs).
ndk-sys = { version = "0.6", features = ["media", "audio"] }
ndk-context = "0.1"
# An app's events, layers and main thread (src/android/events.rs, layer.rs,
# play.rs): the release that both apps and the shell's Slint backend use.
android-activity = { version = "=0.6.1", features = ["native-activity"] }

[build-dependencies]
bindgen = "0.72"
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"
