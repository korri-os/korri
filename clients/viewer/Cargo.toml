[package]
name = "korri-viewer"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
korri-viewer-treaty = { path = "../../contracts/viewer" }
anyhow = "1"
curl = "0.4"
openssl = "0.10"
roxmltree = "0.21"
libc = "0.2"
url = "2.5"
uuid = { version = "1", features = ["v4"] }

# Android has no libcurl. Build the crate's own copy of curl, the release that
# nixpkgs gives Linux, against the OpenSSL that android.nix supplies.
[target.'cfg(target_os = "android")'.dependencies]
curl = { version = "0.4", features = ["static-curl"] }
# The one option that the curl crate cannot reset: CURLOPT_CAPATH to NULL.
curl-sys = "0.4"
# The picture (src/android/picture.rs): AMediaCodec and the app's Surface, and
# Android's decoder list through JNI. The releases that the app's
# android-activity uses.
jni = "0.21"
ndk = { version = "0.9", default-features = false, features = ["media", "nativewindow"] }
ndk-context = "0.1"

[build-dependencies]
bindgen = "0.72"
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"
