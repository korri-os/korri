[package]
name = "korri-viewer"
version = "0.1.0"
edition = "2024"
# Zlib: the controller lists of Valve and SDL (src/android/controller_list.rs).
license = "GPL-3.0-or-later AND GPL-3.0-only AND Zlib"

[features]
# nightjar-core (vendor/nightjar, GPL-3.0-only) as a second network core,
# chosen with `-networkcore nightjar` (#391 step E), on Linux and Android.
# Off by default: the C core streams.
nightjar = ["dep:nightjar-core", "dep:rubylight-protocol"]
# The Rust port of the carried C audio renderers (src/audio_output/),
# chosen with `-audiooutput rust` (#391 step F, slice F1). Linux only. Off by
# default: the carried C plays the sound.
rust-audio-output = ["dep:alsa", "dep:libpulse-binding", "dep:libpulse-simple-binding"]
# The Rust port of the carried C VA-API EGL presenter (src/egl_presenter/),
# chosen with `-eglpresenter rust` (#391 step F, slice F3). Linux only. Off
# by default: the carried C presents.
rust-egl-presenter = ["dep:khronos-egl", "dep:glow"]

[dependencies]
korri-viewer-treaty = { path = "../../contracts/viewer" }
nightjar-core = { path = "vendor/nightjar/protocol/client", optional = true }
# nightjar-core's wire constants (its audio codec bits).
rubylight-protocol = { path = "vendor/nightjar/protocol/core", optional = true }
anyhow = "1"
curl = "0.4"
openssl = "0.10"
roxmltree = "0.21"
libc = "0.2"
url = "2.5"
uuid = { version = "1", features = ["v4"] }

# The Rust audio output's ALSA and PulseAudio: safe bindings to the alsa-lib
# and libpulse-simple that the carried C already links.
[target.'cfg(target_os = "linux")'.dependencies]
alsa = { version = "0.12", optional = true }
libpulse-binding = { version = "2.30", optional = true }
libpulse-simple-binding = { version = "2.29", optional = true }
# The Rust EGL presenter: EGL through the libEGL that the carried C links,
# and OpenGL ES through its entry points.
khronos-egl = { version = "6", features = ["static"], optional = true }
glow = { version = "0.18", optional = true }

# Android has no libcurl. Build the crate's own copy of curl, the release that
# nixpkgs gives Linux, against the OpenSSL that android.nix supplies.
[target.'cfg(target_os = "android")'.dependencies]
curl = { version = "0.4", features = ["static-curl"] }
# The one option that the curl crate cannot reset: CURLOPT_CAPATH to NULL.
curl-sys = "0.4"
# The picture (src/android/picture.rs): AMediaCodec and the app's Surface, and
# Android's decoder list through JNI. The releases that the app's
# android-activity uses.
jni = "0.21"
ndk = { version = "0.9", default-features = false, features = ["media", "nativewindow"] }
# AMediaCodec's buffer calls without the ndk crate's panic on a NULL buffer,
# and AAudio with Korri's own callbacks (src/android/sound.rs).
ndk-sys = { version = "0.6", features = ["media", "audio"] }
ndk-context = "0.1"
# An app's events, layers and main thread (src/android/events.rs, layer.rs,
# play.rs): the release that both apps and the shell's Slint backend use.
android-activity = { version = "=0.6.1", features = ["native-activity"] }

[build-dependencies]
bindgen = "0.72"
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"
