# THROWAWAY SPIKE. Not a product client and not a surface treaty.
# See README.md for the question it answers and its limits.
[package]
name = "korri-slint-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# The real current brain, started through its public embedded entry point.
korrid = { path = "../../services/korrid" }
# Software renderer only: no Skia, FemtoVG, Qt, Wayland winit,
# accessibility bus or system tray. Each is a deliberate omission (README).
# The window system comes from exactly one feature below.
slint = { version = "=1.18.1", default-features = false, features = [
  "std",
  "compat-1-2",
  "renderer-software",
  "software-renderer-systemfonts",
] }
# Not used directly. Slint's system-font lookup goes through this fontique
# version; `fontconfig-dlopen` makes fontconfig optional at run time, so the
# binary needs no libfontconfig on the TV. The embedded Inter font covers its
# absence (ui/fonts/).
fontique = { version = "=0.11.1", features = ["fontconfig-dlopen"] }
# Not used directly. The std-widgets ScrollView embeds SVG images; their
# loader needs these two i-slint-core features, which the winit backend
# turns on for the desktop build (i-slint-backend-winit 1.18.1 Cargo.toml).
# The webos build has no winit, so it asks for the same two features.
i-slint-core = { version = "=1.18.1", default-features = false, features = [
  "image-decoders",
  "svg",
], optional = true }
# Same versions korrid already locks. Loopback HTTP only: no TLS feature.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde_json = "1"
tempfile = "3"
zeroize = "1"
libc = "0.2"

[features]
default = ["desktop-x11"]
# Workstation window: Slint's winit X11 backend (the original proof).
desktop-x11 = ["slint/backend-winit-x11"]
# THROWAWAY webOS experiment: Slint custom platform over an existing
# libSDL2-2.0.so.0 loaded at run time (src/sdl/). Links no SDL and no X11.
# Build: --no-default-features --features webos. The workstation checks use
# the same feature over a workstation SDL.
webos = ["dep:i-slint-core"]

[build-dependencies]
slint-build = "=1.18.1"

# Match korrid's own dev profile for the embedded interpreter.
[profile.dev.package.rquickjs-sys]
opt-level = 3
