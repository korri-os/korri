# THROWAWAY SPIKE. Not a product client and not a surface treaty.
# See README.md for the question it answers and its limits.
[package]
name = "korri-slint-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# The real current brain, started through its public embedded entry point.
korrid = { path = "../../services/korrid" }
# Software renderer and X11 winit only: no Skia, FemtoVG, Qt, Wayland,
# accessibility bus or system tray. Each is a deliberate omission (README).
slint = { version = "=1.18.1", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit-x11",
  "renderer-software",
  "software-renderer-systemfonts",
] }
# Same versions korrid already locks. Loopback HTTP only: no TLS feature.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde_json = "1"
tempfile = "3"
zeroize = "1"
libc = "0.2"

[build-dependencies]
slint-build = "=1.18.1"

# Match korrid's own dev profile for the embedded interpreter.
[profile.dev.package.rquickjs-sys]
opt-level = 3
