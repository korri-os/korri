[package]
name = "korri-shell"
version = "0.0.0"
edition = "2021"
publish = false
description = "Native Korri shell: loads surface packages (.slint views, QuickJS logic) over korrid"

# Standalone, like clients/linux: not a member of any workspace.
[workspace]

[lib]
path = "src/lib.rs"

[[bin]]
name = "korri-shell"
path = "src/main.rs"

[[example]]
name = "fixture-korrid"
required-features = ["fixture"]

[[example]]
name = "surface-probe"

[dependencies]
# Software renderer only. The window system comes from exactly one feature
# below (`desktop`, the default, or `webos`). `unstable-fontique-011` gives the
# shared font collection the shell trims when a surface is unloaded.
slint = { version = "=1.18.1", default-features = false, features = [
  "std",
  "compat-1-2",
  "renderer-software",
  "unstable-fontique-011",
] }
# `internal` exposes the declared int/float and struct field types, and
# `create_with_existing_window` for one-window backends. Pinned exactly.
slint-interpreter = { version = "=1.18.1", default-features = false, features = [
  "std",
  "compat-1-2",
  "renderer-software",
  "internal",
] }
i-slint-compiler = "=1.18.1"
fontique = { version = "=0.11.1", features = ["fontconfig-dlopen"] }
# The treaty: SurfaceModel, SurfaceMessage, SurfaceRequest (contracts/surface).
korri-surface-treaty = { path = "../../contracts/surface" }
# korrid's engine and version.
rquickjs = "=0.14.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.22"
sha2 = "0.10"
anyhow = "1"
libc = "0.2"
pollster = "0.4"
zeroize = "1"
getrandom = { version = "0.3", optional = true }
korri-window-sdl = { path = "window-sdl", optional = true }
# Focus targets as drawn (src/targets.rs): each element's place and selected flag.
i-slint-backend-testing = { version = "=1.18.1", default-features = false }

[dev-dependencies]
tempfile = "3"
# The Zone walk reads what is drawn: each focus target's place and its selected flag.
i-slint-backend-testing = { version = "=1.18.1", default-features = false }
# Its `testing` feature only adds the text layout cache's counters (tests/text_reshape.rs).
i-slint-renderer-software = { version = "=1.18.1", features = ["testing"] }
# The frame pacing of redraws that draw nothing (vendored, tests/frame_pacing.rs).
i-slint-backend-winit = { version = "=1.18.1", default-features = false }

[features]
default = ["desktop"]
# Workstation and handheld: Slint's winit backend on Wayland and X11.
desktop = [
  "slint/backend-winit-wayland",
  "slint/backend-winit-x11",
  "slint/unstable-winit-030",
  "slint-interpreter/backend-winit-wayland",
  "slint-interpreter/backend-winit-x11",
]
# webOS: the SDL adapter (window-sdl/), one window, no winit.
webos = ["dep:korri-window-sdl"]
# The fixture korrid used by tests, proofs and the webOS M1 sample-data IPK only.
fixture = ["dep:getrandom"]

[profile.release]
opt-level = 3
codegen-units = 4

# The shipped build (package.nix): one code unit, link-time optimised, the compiler (which
# runs once per package and process) optimised for size. Its mapped code is part of the
# shell's memory (contract section 4): .text 20.1 MB in release, 17.1 MB here.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.dist.package.i-slint-compiler]
opt-level = "s"

[profile.dev.package.rquickjs-sys]
opt-level = 3

# Slint 1.18.1's software renderer with layer caching for
# `cache-rendering-hint: true` (vendor/README.md). Same versions, same API.
[patch.crates-io]
i-slint-core = { path = "vendor/i-slint-core" }
i-slint-renderer-software = { path = "vendor/i-slint-renderer-software" }
slint-interpreter = { path = "vendor/slint-interpreter" }
i-slint-backend-testing = { path = "vendor/i-slint-backend-testing" }
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }
