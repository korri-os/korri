[package]
name = "korri-android-app"
version = "0.1.0"
edition = "2021"
# The Rust viewer's Android parts port Artemis code under GPL-3.0-only
# (clients/viewer/README.md), so the library is GPL-3.0-only.
license = "GPL-3.0-or-later AND GPL-3.0-only AND Zlib"
publish = false
description = "The Korri Android app with no Korri Java: korrid, the native shell and the Rust viewer in one NativeActivity library"

# Standalone, like clients/shell: not a member of any workspace.
[workspace]

# The library that Android's own NativeActivity loads (AndroidManifest.xml).
[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
# The emulator proof's trigger for the stream's controls (src/proof.rs,
# #434 D11) and for korrid's resize request (#476 slice 3). Only the fixture
# APK's library sets it; default.nix checks that the product library carries
# none of it.
proof = ["korrid/proof"]

[target.'cfg(target_os = "android")'.dependencies]
# korrid in this process (services/korrid/src/android/app.rs).
korrid = { path = "../../services/korrid" }
# The shell's NativeActivity loop without Artemis's android_main.
korri-shell = { path = "../shell", default-features = false, features = ["android-host"] }
# Slint's android-activity platform; its AndroidApp is the shell's.
slint = { version = "=1.18.1", default-features = false, features = ["backend-android-activity-06"] }
# korrid's and the shell's JNI release.
jni = "0.21"
anyhow = "1"
# The Rust viewer in this process, korrid's stream viewer (src/viewer.rs,
# #434 D10), and the treaty that korrid drives it through.
korri-viewer = { path = "../viewer" }
korri-viewer-treaty = { path = "../../contracts/viewer" }
# korrid's LinuxStreamViewer is futures' BoxFuture over tokio; the releases
# that korrid locks. Its timer bounds korrid's wait for the overlay to close.
futures = "0.3"
tokio = { version = "1", features = ["rt", "sync", "time"] }
serde = "1"
serde_json = "1"

[dev-dependencies]
# The host tests of src/viewer/rules.rs (tests/host.rs): its blocking calls
# from korrid's async code. The release that the app locks.
tokio = { version = "1", features = ["rt", "sync"] }

# The shell's vendored Slint 1.18.1 (clients/shell/vendor/README.md). Cargo
# reads [patch] only from the root crate, so this repeats the shell's list.
[patch.crates-io]
i-slint-core = { path = "../shell/vendor/i-slint-core" }
i-slint-renderer-software = { path = "../shell/vendor/i-slint-renderer-software" }
slint-interpreter = { path = "../shell/vendor/slint-interpreter" }
i-slint-backend-testing = { path = "../shell/vendor/i-slint-backend-testing" }
i-slint-backend-winit = { path = "../shell/vendor/i-slint-backend-winit" }
i-slint-backend-android-activity = { path = "../shell/vendor/i-slint-backend-android-activity" }

# As the shell's release build; the interpreter as korrid's.
[profile.release]
opt-level = 3
codegen-units = 4

[profile.dev.package.rquickjs-sys]
opt-level = 3
