:root {
  --black: #000000;   /* pill black, ground */
  --lav:   #8795be;   /* chassis lavender */
  --line:  #3a1e7c;   /* chassis outline */
  --hi:    #dbc9e5;   /* chassis highlight */
  --pink:  #fa93fd;   /* gem pink, caps */
  --orange:#f2a24b;   /* focus orange */
  --white: #ffffff;   /* message white */
  --green: #b0e898;   /* speaker green */
  --teal:  #91f2da;   /* bands, hourglass */
  --cyan:  #3dc1d1;   /* indicator, signal */
}
html, body { margin: 0; height: 100%; background: var(--black); overflow: hidden; }
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--black); }
#screen {
  position: relative; width: 320px; height: 180px; overflow: hidden; background: var(--black);
  /* Jersey 10 at its 1-px grid size (75 units = 1 px); line box 12 px by hand (caps 10 + descender 2) */
  font-family: "Jersey 10", monospace; font-size: 18.6667px; line-height: 12px; color: var(--white);
  -webkit-font-smoothing: none; text-rendering: geometricPrecision;
  image-rendering: pixelated; image-rendering: crisp-edges;
}
.micro { font-family: "Micro 5", monospace; font-size: 11px; line-height: 11px; }
#screen canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; image-rendering: crisp-edges; }
#chrome { z-index: 1; }
#vpwrap { position: absolute; left: 115px; top: 13px; width: 196px; height: 112px; z-index: 2; }
#vp { position: absolute; left: 0; top: 0; }
#vpbtn { position: absolute; inset: 0; margin: 0; padding: 0; border: 0; background: transparent; cursor: default; color: transparent; font: inherit; }
#vplabels { position: absolute; inset: 0; pointer-events: none; }
#vplabels .cap { position: absolute; white-space: nowrap; color: var(--pink); }
#vplabels .cap.band { color: var(--line); letter-spacing: 4px; }
#vplabels .cap.r { color: var(--white); }
.pill { position: absolute; left: 8px; width: 100px; height: 16px; margin: 0; padding: 0; border: 0; background: transparent; z-index: 3; cursor: default; font: inherit; color: var(--pink); text-align: right; }
.pill .label { position: absolute; right: 13px; top: 2px; white-space: nowrap; line-height: 12px; }
.pill.two .label { right: 20px; }
.pill.on .label { color: var(--white); }
.pill.dim .label { color: var(--lav); }
.print { position: absolute; z-index: 3; white-space: nowrap; color: var(--pink); text-transform: uppercase; pointer-events: none; }
#clock { left: 120px; top: 4px; }
#fileline { left: 120px; top: 125px; }
#build { right: 23px; top: 4px; }
#logo1 { position: absolute; left: 8px; top: 9px; width: 100px; text-align: center; color: var(--pink); z-index: 3; }
#logo2 { position: absolute; left: 8px; top: 21px; width: 100px; text-align: center; color: var(--pink); z-index: 3; text-transform: uppercase; }
#msg { position: absolute; left: 4px; top: 137px; width: 296px; height: 26px; line-height: 12px; overflow: hidden; z-index: 3; color: var(--white); overflow-wrap: anywhere; }
#msg .who { color: var(--green); }
#msg.breakall { word-break: break-all; } /* only when one unbroken word is wider than the line */
#hg { position: absolute; left: 305px; top: 165px; width: 7px; height: 7px; z-index: 3; background: transparent; }
#hg i { position: absolute; width: 1px; height: 1px; background: var(--teal); }
@keyframes blink { 0%, 70% { visibility: visible; } 70.01%, 100% { visibility: hidden; } }
#hg { animation: blink 1s steps(1, end) infinite; }
button:focus { outline: none; }
#sr { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
@media (prefers-reduced-motion: reduce) { #hg { animation: none; } }
</style>
</head>

    b.querySelector('.label').textContent = p.label();
    b.classList.toggle('on', on);
    b.classList.toggle('two', p.id === 'place' && !!g && g.places.length === 2);
    b.classList.toggle('dim', (p.id === 'place' && (!g || g.places.length === 1)) || (p.id === 'play' && !g));
    b.setAttribute('aria-label', p.id === 'place' ? 'Place: ' + (g ? placeOf(g) : 'none') : p.label());
  });
  vpbtn.setAttribute('aria-label', g ? 'Game ' + (S.idx + 1) + ' of ' + n + ': ' + g.t : 'No games');
  const m = document.getElementById('msg'); m.classList.remove('breakall');
  if (m.scrollHeight > 30) m.classList.add('breakall'); // a word too wide for the line would push the sentence to a third line
}
function render() {
  renderText(); drawChrome(); drawViewport();
  const want = S.focus === 'vp' ? vpbtn : pillBtns[S.pill];
  if (document.activeElement !== want) want.focus({ preventScroll: true });
}

// ---------- input: direction / confirm / back / options / menu ----------
function act(name, dir) {
  const g = cur(), n = CAT.length;
  if (S.launching) { clearTimeout(S.launching); clearInterval(S.launchTick); S.launching = null; S.blinkOn = true; }
  if (name === 'back') { if (S.section) S.section = null; else S.focus = 'vp'; return render(); }
  if (name === 'menu') { S.focus = 'pill'; S.pill = 0; S.section = null; return render(); }
  if (name === 'options') { S.focus = 'pill'; S.pill = 2; S.section = null; return render(); }
  if (name === 'direction') {
    if (S.focus === 'vp') {
      if (dir === 'left' && n) S.idx = (S.idx + n - 1) % n;
      else if (dir === 'right' && n) S.idx = (S.idx + 1) % n;
      else if (dir === 'up') { S.focus = 'pill'; S.pill = 0; }
      return render();
    }
    if (dir === 'up') { if (S.pill > 0) S.pill--; else S.focus = 'vp'; }
    else if (dir === 'down') { if (S.pill < PILLS.length - 1) S.pill++; else S.focus = 'vp'; }
    else if ((dir === 'left' || dir === 'right') && PILLS[S.pill].id === 'place' && g && g.places.length === 2) S.place[g.t] = (S.place[g.t] || 0) ^ 1;
    if (S.section && (S.focus !== 'pill' || PILLS[S.pill].id !== S.section)) S.section = null;
    return render();
  }
  if (name === 'confirm') {
    const id = S.focus === 'vp' ? 'play' : PILLS[S.pill].id;
    if (id === 'play') {
      if (!g) return;
      S.blinkOn = true;
      const tick = setInterval(() => { S.blinkOn = !S.blinkOn; drawChrome(); }, reduced ? 1e9 : 250);
      S.launching = setTimeout(() => { clearInterval(tick); S.launching = null; S.blinkOn = true; render(); }, 2400);
      S.launchTick = tick;
      return render();
    }
    if (id === 'place') { if (g && g.places.length === 2) S.place[g.t] = (S.place[g.t] || 0) ^ 1; return render(); }
    S.section = id; return render();
  }
}
const KEYS = { ArrowLeft: ['direction', 'left'], ArrowRight: ['direction', 'right'], ArrowUp: ['direction', 'up'], ArrowDown: ['direction', 'down'], Enter: ['confirm'], ' ': ['confirm'], Escape: ['back'], Backspace: ['back'], o: ['options'], m: ['menu'] };
addEventListener('keydown', e => { const k = KEYS[e.key]; if (!k) return; e.preventDefault(); act(k[0], k[1]); });
pillBtns.forEach((b, i) => b.addEventListener('click', () => { S.focus = 'pill'; S.pill = i; act('confirm'); }));
vpbtn.addEventListener('click', () => { S.focus = 'vp'; act('confirm'); });

// ---------- hourglass sprite ----------
{
  const hg = document.getElementById('hg');
  ['1111111', '.11111.', '..111..', '...1...', '..111..', '.11111.', '1111111'].forEach((r, y) => { for (let x = 0; x < 7; x++) if (r[x] === '1') { const i = document.createElement('i'); i.style.left = x + 'px'; i.style.top = y + 'px'; hg.appendChild(i); } });
}

// ---------- idle motion (steps only; off under reduced motion) ----------
if (!reduced) {
  setInterval(() => { S.dphase = (S.dphase + 1) & 3; drawChrome(); }, 500);
  setInterval(() => { S.glint = true; drawChrome(); setTimeout(() => { S.glint = false; drawChrome(); }, 150); }, 4000);
}

Promise.all([document.fonts.load('18.6667px "Jersey 10"'), document.fonts.load('11px "Micro 5"')]).then(() => { render(); document.documentElement.dataset.ready = '1'; });
</script>
