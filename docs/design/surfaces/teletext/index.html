:root {
  /* The eight teletext colours. Nothing else is ever painted. */
  --k: #000000; --r: #ff0000; --g: #00ff00; --y: #ffff00;
  --b: #0000ff; --m: #ff00ff; --c: #00ffff; --w: #ffffff;
}

html, body { margin: 0; height: 100%; background: var(--k); }
body {
  container-type: size;
  display: grid;
  place-items: center;
  overflow: hidden;
}

/* The page is 40 x 24 cells. Its height is the container's short side
   (or the width that keeps 4:3), so it never reflows: only the cell
   changes size. A cell is 8 x 10 units; one unit is one glyph pixel
   tall, and glyphs are drawn 4/3 wide, as on a 4:3 set. */
.page {
  --ph: min(100cqh, 75cqw);
  --rh: calc(var(--ph) / 24);
  --u: calc(var(--rh) / 10);
  --cw: calc(var(--u) * 8);
  position: relative;
  display: grid;
  grid-template-columns: repeat(40, var(--cw));
  grid-template-rows: repeat(24, var(--rh));
  font-family: "monogram", monospace;
  font-size: calc(var(--u) * 9);
  line-height: calc(var(--u) * 9);
  -webkit-font-smoothing: none;
  font-smooth: never;
  user-select: none;
}

.c { position: relative; background: var(--bg); color: var(--fg); }
.c > span {
  position: absolute;
  left: 0;
  top: var(--u);
  white-space: pre;
  transform: scaleX(1.3333);
  transform-origin: 0 0;
}
/* Double height: the glyph is stretched over this row and the next. */
.c.dh > span { transform: scale(1.3333, 2); z-index: 2; }

/* 2 x 3 block mosaic. Row heights 3:4:3, as the SAA5050 drew them. */
.c.m {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 3fr 4fr 3fr;
}
.c.m > i { background: var(--bg); }
.c.m > i.on { background: var(--fg); }

.c > svg { position: absolute; inset: 0; width: 100%; height: 100%; }

/* Focus stops sit over the cells they own. The page itself draws focus
   in reverse video, so these stay invisible. */
.hit {
  position: absolute;
  margin: 0; padding: 0; border: 0;
  background: transparent;
  outline: none;
  cursor: default;
  z-index: 5;
}

const KEYS = [
  { col: "r", label: "Network", page: 650, sub: "Wi-Fi", ink: "k" },
  { col: "g", label: "Identity", page: 690, sub: "Keys", ink: "k" },
  { col: "y", label: "Settings", page: 600, sub: "Build", ink: "k", glyph: "options" },
  { col: "b", label: "Index", page: 100, sub: "Pages", ink: "w", glyph: "menu" },
];

const COLS = 40, ROWS = 24;
const LIST_TOP = 4, LIST_ROWS = 13;      /* rows 4..16 */
const BAND_TOP = 17;                     /* rows 17..21 */
const ART_W = 12, BAND_COL = 12, TEXT_COL = 13, TEXT_W = 27;

const params = new URLSearchParams(location.search);
const STATE = params.get("state") || "ideal";
const games = STATE === "ideal" ? GAMES : [];

const ui = {
  zone: "list",                          /* head | list | keys */
  game: Math.max(0, Math.min(GAMES.length - 1, (Number(params.get("focus")) || 4) - 1)),
  place: Object.create(null),            /* game index -> chosen place */
  key: 0,
  digits: [2, 0, 0],
  digit: 0,
};
if (params.get("zone")) ui.zone = params.get("zone");
if (params.get("key")) ui.key = Number(params.get("key"));

/* ---------- the character grid ---------- */
let G;
function blank() {
  G = Array.from({ length: ROWS }, () =>
    Array.from({ length: COLS }, () => ({ ch: " ", fg: "w", bg: "k" })));
}
function fill(r, c0, c1, bg) { for (let c = c0; c <= c1; c++) Object.assign(G[r][c], { bg, ch: " ", mos: null, dh: false }); }
function text(r, c, s, fg, bg) {
  for (let i = 0; i < s.length && c + i < COLS; i++) {
    const cell = G[r][c + i];
    cell.ch = s[i]; cell.fg = fg; if (bg) cell.bg = bg;
  }
}
function dh(r, c, s, fg, bg) {
  text(r, c, s, fg, bg);
  for (let i = 0; i < s.length && c + i < COLS; i++) {
    G[r][c + i].dh = true;
    G[r + 1][c + i].ch = " ";
    if (bg) G[r + 1][c + i].bg = bg;
  }
}
function mosaic(r, c, bits, fg, bg) { Object.assign(G[r][c], { ch: " ", mos: bits, fg, bg }); }
function pad(s, n) { return s.length >= n ? s.slice(0, n) : s + " ".repeat(n - s.length); }
function lpad(s, n) { return s.length >= n ? s.slice(0, n) : " ".repeat(n - s.length) + s; }
function wrap(s, n) {
  const out = []; let line = "";
  for (const w of s.split(" ")) {
    if (!line) line = w;
    else if (line.length + 1 + w.length <= n) line += " " + w;
    else { out.push(line); line = w; }
  }
  if (line) out.push(line);
  return out.flatMap(l => l.length <= n ? [l] : l.match(new RegExp(`.{1,${n}}`, "g")));
}

/* ---------- page 200 ---------- */
function compose() {
  blank();

  /* Row 0: header. Requested page, service, page counter, device, clock. */
  const want = "P" + ui.digits.join("");
  const headFocus = ui.zone === "head";
  text(0, 1, want, headFocus ? "k" : "w", headFocus ? "w" : "k");
  if (headFocus) {
    G[0][2 + ui.digit].bg = "y";
  }
  text(0, 7, "RELAY 200", "w");
  text(0, 18, "mini", "c");
  text(0, 34, "21:47", "y");

  /* Rows 1-2: title band. */
  fill(1, 0, 39, "b"); fill(2, 0, 39, "b");
  dh(1, 2, "GAMES", "y", "b");
  const count = games.length === 1 ? "1 game" : `${games.length} games`;
  text(2, 39 - count.length, count, "c", "b");

  /* Row 3: column heads. */
  text(3, 0, "Pg", "c"); text(3, 4, "Game", "c"); text(3, 20, "System", "c"); text(3, 31, "Played", "c");

  if (STATE !== "ideal") { composeEmpty(); composeKeys(); return; }

  /* Rows 4-16: the listing. One game per row; a long title continues
     on the next row, indented, as listings pages did. */
  let r = LIST_TOP;
  GAMES.forEach((g, i) => {
    const focus = ui.zone === "list" && ui.game === i;
    const bg = focus ? "y" : "k";
    const lines = g.t.length <= 15 ? [g.t] : (() => {
      const first = wrap(g.t, 15)[0];
      return [first, g.t.slice(first.length).trimStart()];
    })();
    g.rows = [r, r + lines.length - 1];
    fill(r, 0, 39, bg);
    text(r, 0, String(201 + i), focus ? "b" : "y");
    text(r, 4, pad(lines[0], 15), focus ? "k" : "w");
    text(r, 20, pad(g.sys, 10), focus ? "b" : "c");
    text(r, 31, g.last, focus ? "k" : "w");
    if (lines[1]) {
      r++;
      fill(r, 0, 39, bg);
      text(r, 4, lines[1].slice(0, 36), focus ? "k" : "w");
    }
    r++;
  });

  composeBand(GAMES[ui.game]);
  composeKeys();
}

/* Rows 17-21: the focused game. A cover in the side column, then a
   blue band with title, places, facts. The band starts at a fixed
   column, so it holds with or without a cover. */
function composeBand(g) {
  const i = GAMES.indexOf(g);
  for (let r = BAND_TOP; r <= 21; r++) fill(r, BAND_COL, 39, "b");

  const cover = COVERS[g.art];
  if (cover) {
    for (let r = 0; r < 5; r++) for (let c = 0; c < ART_W; c++) {
      const cell = cover[r][c];
      mosaic(BAND_TOP + r, c, cell.bits, cell.fg, cell.bg);
    }
  } else {
    /* No picture: the side column carries the page number instead. */
    dh(18, 4, String(201 + i), "w", "k");
  }

  let r = BAND_TOP;
  if (g.t.length <= TEXT_W) { dh(r, TEXT_COL, g.t, "w", "b"); r += 2; }
  else { const l = wrap(g.t, TEXT_W); text(r, TEXT_COL, l[0], "w"); text(r + 1, TEXT_COL, l[1] || "", "w"); r += 2; }

  /* Row 19: where it plays. */
  if (g.places.length > 1) {
    const chosen = ui.place[i] ?? 0;
    text(19, TEXT_COL, "Play on", "c");
    let c = TEXT_COL + 8;
    g.places.forEach((p, k) => {
      const on = k === chosen;
      const label = ` ${p} `;
      text(19, c, label, on ? "k" : "w", on ? "y" : "b");
      c += label.length + 1;
    });
  } else if (g.places[0] === "zao") {
    text(19, TEXT_COL, "Streams from zao", "c");
  } else {
    text(19, TEXT_COL, "Plays on This device", "c");
  }

  /* Rows 20-21: facts, then what the keys do here. */
  const played = g.last === "Never" ? "Never played." : `Last played ${g.last === "Yesterday" ? "yesterday" : g.last + " ago"}.`;
  text(20, TEXT_COL, played, "w");
  const plays = g.plays === 0 ? "No plays yet." : g.plays === 1 ? "1 play." : `${g.plays} plays.`;
  const tail = g.places.length > 1 ? " \u2190\u2192 picks a place." : g.note ? " " + g.note : "";
  text(21, TEXT_COL, (plays + tail).slice(0, TEXT_W), "c");
}

/* Other whole-page states: ?state=empty | loading | error */
function composeEmpty() {
  const msg = {
    empty: ["No games on this service yet.", "", "A game is listed here when", "this device or another one", "on the network offers it."],
    loading: ["Fetching page 200.", "", "The list appears when it", "arrives. Other pages still", "answer."],
    error: ["Page 200 did not arrive.", "", "The game list could not be", "read. Try again with OK, or", "go to Index 100."],
  }[STATE] || [];
  msg.forEach((l, k) => text(6 + k, 4, l, k === 0 ? "y" : "w"));
  if (STATE === "loading") { text(0, 7, "RELAY 147", "w"); }
}

/* Rows 22-23: Fastext. Captions with page numbers above four solid
   keys. The focused key grows up over its caption. */
function composeKeys() {
  KEYS.forEach((k, n) => {
    const c0 = n * 10, c1 = c0 + 9;
    const focus = ui.zone === "keys" && ui.key === n;
    fill(23, c0, c1, k.col);
    text(23, c0 + 1, k.label, k.ink, k.col);
    /* The device shortcut, as a small black keycap on the key. */
    if (k.glyph) Object.assign(G[23][c1], { glyph: k.glyph, fg: "w", bg: "k" });
    if (focus) {
      fill(22, c0, c1, k.col);
      text(22, c0 + 1, String(k.page), k.ink, k.col);
      text(22, c0 + 5, k.sub, k.ink, k.col);
    } else {
      text(22, c0 + 1, String(k.page), "y");
      text(22, c0 + 5, k.sub, "w");
    }
  });
}

/* ---------- covers: real art cut to 2x3 mosaics in eight colours ---------- */
const PAL = { k: [0,0,0], r: [255,0,0], g: [0,255,0], y: [255,255,0], b: [0,0,255], m: [255,0,255], c: [0,255,255], w: [255,255,255] };
const PAL_KEYS = Object.keys(PAL);
const COVERS = {};
/* Spelunky, drawn for this page: 24 x 15 blocks. */
const DRAWN = {
  CAVERN: [
    "rrrrrrrrrrrrrrrrrrrrrrrr",
    "rrryrr.rrrrr..rrrr.rryrr",
    ".rrrr...rrr....rr...rrr.",
    "..rr.....r..........r...",
    "..........yy.....y......",
    ".........yyyy....r......",
    "........yyyyyy...r......",
    "..........ww............",
    ".........wwwww..........",
    "........ww.w.ww.....y...",
    "...........w.......yyy..",
    "..........w.w...........",
    "..y.rr...ww.ww.rrr.yy.rr",
    "rrrrrrrrrrrrrrrrrrrrrrrr",
    "rrryrrrrrrrrryrrrrrrryrr",
  ],
};
function cutDrawn(rows) {
  const name = { ".": "k" };
  return cutGrid((x, y) => name[rows[y][x]] || rows[y][x]);
}
function cutGrid(colourAt) {
  const out = [];
  for (let cy = 0; cy < 5; cy++) {
    const row = [];
    for (let cx = 0; cx < 12; cx++) {
      const named = [];
      for (let yy = 0; yy < 3; yy++) for (let xx = 0; xx < 2; xx++) named.push(colourAt(cx * 2 + xx, cy * 3 + yy));
      const tally = {};
      named.forEach(n => tally[n] = (tally[n] || 0) + 1);
      const order = Object.keys(tally).sort((p, q) => tally[q] - tally[p]);
      /* One cell holds two colours; black is the background when present. */
      const bg = tally.k ? "k" : order[0];
      const fg = order.find(n => n !== bg) || bg;
      row.push({ bits: named.map(n => n !== bg), fg, bg });
    }
    out.push(row);
  }
  return out;
}
function nearest(rgb, keys = PAL_KEYS) {
  let best = keys[0], bd = Infinity;
  for (const k of keys) {
    const p = PAL[k];
    const d = (rgb[0]-p[0])**2 * 0.3 + (rgb[1]-p[1])**2 * 0.59 + (rgb[2]-p[2])**2 * 0.11;
    if (d < bd) { bd = d; best = k; }
  }
  return best;
}
function cutCover(img) {
  /* The side column is 12 x 5 cells: 24 x 15 blocks, each block 4u x 3.3u. */
  const SW = 24, SH = 15, VW = 96, VH = 50;
  const a = document.createElement("canvas"); a.width = VW; a.height = VH;
  const ax = a.getContext("2d");
  const s = Math.max(VW / img.width, VH / img.height);
  const w = img.width * s, h = img.height * s;
  ax.imageSmoothingQuality = "high";
  ax.drawImage(img, (VW - w) / 2, (VH - h) / 2, w, h);
  const b = document.createElement("canvas"); b.width = SW; b.height = SH;
  const bx = b.getContext("2d");
  bx.imageSmoothingQuality = "high";
  bx.drawImage(a, 0, 0, SW, SH);
  const px = bx.getImageData(0, 0, SW, SH).data;
  /* Teletext colours are three bits: red, green, blue on or off. Each
     channel is cut at the picture's own mean, so dark art still lands
     on colour instead of all falling to black. */
  const mean = [0, 1, 2].map(ch => { let s = 0; for (let o = ch; o < px.length; o += 4) s += px[o]; return s / (SW * SH); });
  const bit = ["k", "r", "g", "y", "b", "m", "c", "w"];
  return cutGrid((x, y) => {
    const o = (y * SW + x) * 4;
    const on = [0, 1, 2].map(ch => px[o + ch] > Math.max(48, mean[ch] * 1.15) ? 1 : 0);
    return bit[on[0] + on[1] * 2 + on[2] * 4];
  });
}
function loadCovers() {
  for (const [k, rows] of Object.entries(DRAWN)) COVERS[k] = cutDrawn(rows);
  return Promise.all(Object.entries(ART).map(([k, url]) => new Promise(res => {
    const img = new Image();
    img.onload = () => { if (!COVERS[k]) COVERS[k] = cutCover(img); res(); };
    img.onerror = res;
    img.src = url;
  })));
}

/* ---------- render ---------- */
const page = document.getElementById("page");
const GLYPHS = {
  /* The two device shortcuts, drawn in an 8 x 10 cell. */
  menu: '<svg viewBox="0 0 8 10" aria-hidden="true"><rect x="1.5" y="2" width="5" height="1.2" fill="currentColor"/><rect x="1.5" y="4.4" width="5" height="1.2" fill="currentColor"/><rect x="1.5" y="6.8" width="5" height="1.2" fill="currentColor"/></svg>',
  options: '<svg viewBox="0 0 8 10" aria-hidden="true"><rect x="3.3" y="1.8" width="1.4" height="1.4" fill="currentColor"/><rect x="3.3" y="4.3" width="1.4" height="1.4" fill="currentColor"/><rect x="3.3" y="6.8" width="1.4" height="1.4" fill="currentColor"/></svg>',
};
function render() {
  compose();
  let html = "";
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const cell = G[r][c];
    const st = `--bg:var(--${cell.bg});--fg:var(--${cell.fg})`;
    if (cell.mos) {
      html += `<div class="c m" style="${st}">` + cell.mos.map(on => on ? '<i class="on"></i>' : "<i></i>").join("") + "</div>";
    } else if (cell.glyph) {
      html += `<div class="c" style="${st}">${GLYPHS[cell.glyph]}</div>`;
    } else if (cell.ch !== " ") {
      const ch = cell.ch === "<" ? "&lt;" : cell.ch === "&" ? "&amp;" : cell.ch;
      html += `<div class="c${cell.dh ? " dh" : ""}" style="${st}"><span>${ch}</span></div>`;
    } else {
      html += `<div class="c" style="${st}"></div>`;
    }
  }
  page.innerHTML = html + hits();
  const f = page.querySelector(`[data-stop="${stopId()}"]`);
  if (f && document.activeElement !== f) f.focus({ preventScroll: true });
}

/* Invisible native focus stops over the cells they own. */
function hit(id, r0, r1, c0, c1, label) {
  return `<button class="hit" data-stop="${id}" tabindex="-1" aria-label="${label}" style="` +
    `left:calc(var(--cw)*${c0});top:calc(var(--rh)*${r0});` +
    `width:calc(var(--cw)*${c1 - c0 + 1});height:calc(var(--rh)*${r1 - r0 + 1})"></button>`;
}
function hits() {
  let h = hit("head", 0, 0, 1, 4, `Page number ${ui.digits.join("")}. Up and down change a digit.`);
  if (STATE === "ideal") GAMES.forEach((g, i) => {
    const chosen = g.places[ui.place[i] ?? 0];
    h += hit("g" + i, g.rows[0], g.rows[1], 0, 39,
      `Page ${201 + i}, ${g.t}, ${g.sys}, played ${g.last}. Plays on ${chosen}` + (g.places.length > 1 ? `, left and right change the place` : ""));
  });
  KEYS.forEach((k, n) => { h += hit("k" + n, 23, 23, n * 10, n * 10 + 9, `${k.label}, page ${k.page}`); });
  return h;
}
function stopId() {
  return ui.zone === "head" ? "head" : ui.zone === "keys" ? "k" + ui.key : "g" + ui.game;
}

/* ---------- input: direction, confirm, back, options, menu ---------- */
function act(a) {
  const g = GAMES[ui.game];
  const listed = STATE === "ideal";
  if (ui.zone === "head") {
    if (a === "up" || a === "down") {
      const d = ui.digit, max = d === 0 ? 8 : 9, min = d === 0 ? 1 : 0;
      let v = ui.digits[d] + (a === "up" ? 1 : -1);
      ui.digits[d] = v > max ? min : v < min ? max : v;
    }
    else if (a === "left") ui.digit = Math.max(0, ui.digit - 1);
    else if (a === "right") { if (ui.digit < 2) ui.digit++; }
    else if (a === "back") { ui.digits = [2, 0, 0]; ui.digit = 0; ui.zone = listed ? "list" : "keys"; }
    else if (a === "down") ui.zone = listed ? "list" : "keys";
  } else if (ui.zone === "list") {
    if (a === "up") { if (ui.game === 0) ui.zone = "head"; else ui.game--; }
    else if (a === "down") { if (ui.game === GAMES.length - 1) ui.zone = "keys"; else ui.game++; }
    else if ((a === "left" || a === "right") && g.places.length > 1) {
      const cur = ui.place[ui.game] ?? 0;
      ui.place[ui.game] = Math.max(0, Math.min(g.places.length - 1, cur + (a === "right" ? 1 : -1)));
    }
    else if (a === "back") { ui.zone = "keys"; ui.key = 3; }
  } else if (ui.zone === "keys") {
    if (a === "left") ui.key = Math.max(0, ui.key - 1);
    else if (a === "right") ui.key = Math.min(3, ui.key + 1);
    else if (a === "up" || a === "back") ui.zone = listed ? "list" : "head";
  }
  if (a === "options") { ui.zone = "keys"; ui.key = 2; }
  if (a === "menu") { ui.zone = "keys"; ui.key = 3; }
  render();
}
/* Browser preview only: the host translates real devices. */
const MAP = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  Enter: "confirm", Escape: "back", Backspace: "back", o: "options", m: "menu" };
document.addEventListener("keydown", e => {
  const a = MAP[e.key];
  if (!a) return;
  e.preventDefault();
  act(a);
});

render();
document.fonts.ready.then(loadCovers).then(render);
</script>
</body>
</html>
