<style>
/* ------------------------------------------------------------------
   Palette: saturated primaries on phosphor black.
   ------------------------------------------------------------------ */
:root {
  --black:  #000000;
  --white:  #F8F8F8;
  --yellow: #F8D800;
  --red:    #E82820;
  --blue:   #2858F8;
  --cyan:   #A0E8F8;
}

html, body { margin: 0; height: 100%; background: var(--black); overflow: hidden; }
body {
  color: var(--white);
  font-family: "Silkscreen", monospace;
  font-size: 8px;
  line-height: 10px;
  -webkit-font-smoothing: none;
  text-transform: uppercase;
}

/* The cabinet: full container, black. The monitor: a 320x240 logical
   frame, integer-zoomed to the largest multiple that fits, black bars
   around it. `zoom` keeps every logical px an integer screen px. */
#cab { position: fixed; inset: 0; display: grid; place-items: center; overflow: auto; }
#frame {
  position: relative;
  width: 320px; height: 240px;
  overflow: hidden;
  background: var(--black);
  zoom: var(--s, 1);
}

/* ---- type ---- */
.marquee {
  font-family: "Press Start 2P", monospace;
  font-size: 8px; line-height: 8px;
  font-weight: 400;
}
.marquee.x2 { font-size: 16px; line-height: 16px; }

/* Chrome: hard colour steps, not a gradient. Six bands over the 16px em. */
.chrome {
  position: relative;
  display: inline-block;
  color: transparent;
  background-image: linear-gradient(to bottom,
    var(--white) 0 4px,
    var(--cyan)  4px 7px,
    var(--blue)  7px 9px,
    var(--white) 9px 10px,
    var(--yellow) 10px 12px,
    var(--red)   12px 16px);
  background-repeat: no-repeat;
  -webkit-background-clip: text; background-clip: text;
}
.chrome::before {
  /* the cast shadow of the marquee letters, one step down and right */
  content: attr(data-t);
  position: absolute; left: 1px; top: 2px;
  color: var(--blue);
  z-index: -1;
}
.chrome.x1 { background-image: linear-gradient(to bottom,
    var(--white) 0 2px, var(--cyan) 2px 4px, var(--blue) 4px 5px,
    var(--yellow) 5px 6px, var(--red) 6px 8px); }
.chrome.x1::before { left: 1px; top: 1px; }

/* ---- rows ---- */
.top {
  position: absolute; left: 4px; right: 4px; top: 3px;
  display: flex; justify-content: space-between; gap: 6px;
  color: var(--blue);
}
.top .credit { color: var(--white); }
.top .credit b { color: var(--yellow); font-weight: 400; }
.top .ant { color: var(--cyan); }

.heading {
  position: absolute; left: 0; right: 0; top: 16px; margin: 0;
  text-align: center;
  color: var(--yellow);
  text-shadow: 1px 1px 0 var(--red), 2px 2px 0 var(--red);
}

/* ---- the strip ---- */
.strip {
  position: absolute; left: 0; right: 0; top: 38px; height: 70px;
  display: flex; align-items: center; justify-content: center; gap: 1px;
}
.slot {
  position: relative; flex: none;
  width: 38px; height: 28px;
  background: var(--black);
  border: 1px solid; border-color: var(--blue) var(--blue) var(--blue) var(--blue);
  padding: 0; margin: 0; box-sizing: border-box;
  overflow: hidden;
  cursor: default;
}
.slot img, .slot .art {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: center;
  image-rendering: pixelated;
  display: block;
}
.slot .art svg { width: 100%; height: 100%; display: block; }
.slot .num {
  position: absolute; left: 0; top: 0;
  color: var(--white);
  background: var(--black);
  padding: 1px 2px 1px 1px;
  line-height: 5px;
}
.slot.focus {
  width: 84px; height: 63px;
  border: 2px solid var(--yellow);
}
.slot.focus .num { display: none; }
@media (prefers-reduced-motion: no-preference) {
  html:not(.still) .slot.focus { animation: cursor 0.5s steps(1) infinite; }
  @keyframes cursor { 50% { border-color: var(--red); } }
  html:not(.still) .coin .b { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 75% { visibility: hidden; } }
}
.frame-zone-strip .slot.focus { }

/* the house card for a game with no cover */
.house {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px;
  color: var(--yellow);
  text-align: center;
  background:
    linear-gradient(to bottom, var(--red) 0 2px, var(--black) 2px),
    linear-gradient(to top, var(--blue) 0 2px, var(--black) 2px);
  background-size: 100% 50%; background-repeat: no-repeat;
  background-position: top, bottom;
}
.house .px { fill: var(--yellow); }
.slot.focus .house .marquee { display: block; }
.slot.focus .house .sticker { display: none; }
.slot:not(.focus) .house .marquee { display: none; }

/* continue banner on a resumable slot */
.cont {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 7px; background: var(--red); color: var(--white);
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
.cont svg { display: block; height: 5px; }
.slot.focus .cont { height: 9px; }
.count {
  position: absolute; right: 0; top: 0;
  background: var(--red); color: var(--white);
  padding: 1px 1px 1px 2px; line-height: 5px;
}
.slot.focus .count { display: none; }

/* ---- the table ---- */
.table {
  position: absolute; left: 8px; right: 8px; top: 116px;
}
.title { height: 16px; margin: 0; text-align: center; white-space: nowrap; }
.title.small { font-size: 8px; line-height: 8px; padding-top: 4px; height: 12px; }
.rows { margin: 8px 0 0; padding: 0; list-style: none; }
.rows li {
  display: grid; grid-template-columns: 40px auto 1fr; column-gap: 8px;
  height: 11px; white-space: nowrap;
}
.rows .k { color: var(--blue); }
.rows .v { color: var(--white); }
.rows .n { color: var(--blue); }
.rows .k.p { color: var(--white); }
.side { }
.side.on { color: var(--yellow); }
.side.on .k { color: var(--yellow); }
.rows li.cur { position: relative; }
.rows li.cur::before {
  content: ""; position: absolute; left: -8px; top: 2px;
  width: 0; height: 0;
  border: 3px solid transparent; border-left: 5px solid var(--yellow);
  border-right: 0;
}
.side .hint { color: var(--blue); }

/* ---- bottom lines ---- */
.coin {
  position: absolute; left: 0; right: 0; top: 206px; margin: 0;
  text-align: center; color: var(--yellow);
}
.operator {
  position: absolute; left: 4px; right: 4px; bottom: 3px;
  display: flex; gap: 0; color: var(--blue); white-space: nowrap;
}
.operator .lab { margin-right: 6px; }
.operator .op { color: var(--white); padding: 0 1px; }
.operator .dot { padding: 0 3px; }
.operator .op.cur { color: var(--black); background: var(--yellow); }
.operator .pad { margin-left: auto; color: var(--blue); }

/* ---- attract mode ---- */
#attract {
  position: absolute; inset: 0; background: var(--black);
  display: none;
}
#frame.attract #attract { display: block; }
#frame.attract > :not(#attract) { visibility: hidden; }
#attract .big { position: absolute; left: 0; right: 0; top: 24px; height: 128px;
  display: flex; justify-content: center; align-items: center; }
#attract .big img { image-rendering: pixelated; }
#attract .big .house { position: static; width: 176px; height: 112px; }
#attract .big .house .marquee { display: block; }
#attract .big .house .sticker { display: none; }
#attract .at { position: absolute; left: 0; right: 0; top: 164px; text-align: center; }
#attract .facts { position: absolute; left: 0; right: 0; top: 184px; text-align: center; color: var(--white); }
#attract .facts .k { color: var(--blue); }
#attract .demo { position: absolute; left: 4px; top: 3px; color: var(--red); }
#attract .cred { position: absolute; right: 4px; top: 3px; color: var(--white); }
#attract .cred b { color: var(--yellow); font-weight: 400; }
#attract .coin { top: 212px; }

/* focus rings never rely on the browser default, which `zoom` blurs */
:focus { outline: none; }
.sticker svg { display: block; }
.px { fill: currentColor; }
</style>

<script>
/* ------------------------------------------------------------------
   Data: SHARED.md content, exactly. Places: "This device" and "zao".
   ------------------------------------------------------------------ */
const GAMES = [
  { t: "Celeste Classic", sys: "PICO-8", places: ["This device"], last: "2 hours ago", plays: 41, art: "SUMMIT", resume: true },
  { t: "Hollow Knight", sys: "Switch", places: ["This device"], last: "Yesterday", plays: 18, art: "KNIGHT" },
  { t: "Tetris", sys: "GB", places: ["zao"], last: "3 days ago", plays: 112, art: "BLOCKS" },
  { t: "Spelunky", sys: "PC", places: ["This device", "zao"], last: "9 days ago", plays: 7, art: "CAVERN" },
  { t: "Lantern Keep", sys: "PC", places: ["This device"], last: "3 weeks ago", plays: 3, art: "TOWER" },
  { t: "Tide Pool", sys: "Mega Drive", places: ["zao"], last: "Never", plays: 0, art: "SHORE" },
  { t: "Comet Courier", sys: "PC", places: ["This device"], last: "2 months ago", plays: 1, art: null },
  { t: "Bramble Run", sys: "GBA", places: ["This device"], last: "6 weeks ago", plays: 5, art: "BRAMBLE" },
  { t: "Petal Quest", sys: "PICO-8", places: ["This device"], last: "Never", plays: 0, art: "svg:petal" },
  { t: "The Legend of Zelda: Oracle of Seasons", sys: "GBC", places: ["This device"], last: "4 months ago", plays: 22, art: "svg:zelda" },
  { t: "Wario Land 4", sys: "GBA", places: ["This device", "zao"], last: "5 days ago", plays: 14, art: "svg:wario" },
  { t: "Super Metroid", sys: "SNES", places: ["This device"], last: "1 year ago", plays: 9, art: "svg:metroid" },
];
const WIFI = { ssid: "hummingbird-lake", pct: 72 };

/* Covers the fixture set does not have, drawn in pixels (SVG, crisp). */
const DRAWN = {
  petal: `<svg viewBox="0 0 32 24" shape-rendering="crispEdges" preserveAspectRatio="none"><rect width="32" height="24" fill="#2858F8"/><rect y="18" width="32" height="6" fill="#108040"/><rect x="14" y="10" width="2" height="8" fill="#108040"/><rect x="12" y="5" width="6" height="6" fill="#F8D800"/><rect x="10" y="7" width="2" height="2" fill="#F85898"/><rect x="18" y="7" width="2" height="2" fill="#F85898"/><rect x="14" y="3" width="2" height="2" fill="#F85898"/><rect x="14" y="11" width="2" height="2" fill="#F85898"/><rect x="4" y="2" width="1" height="1" fill="#F8F8F8"/><rect x="26" y="4" width="1" height="1" fill="#F8F8F8"/><rect x="22" y="14" width="1" height="1" fill="#F8F8F8"/></svg>`,
  zelda: `<svg viewBox="0 0 32 24" shape-rendering="crispEdges" preserveAspectRatio="none"><rect width="32" height="24" fill="#108040"/><rect y="20" width="32" height="4" fill="#083820"/><rect x="14" y="4" width="4" height="4" fill="#F8D800"/><rect x="12" y="8" width="8" height="4" fill="#F8D800"/><rect x="10" y="12" width="12" height="4" fill="#F8D800"/><rect x="14" y="12" width="4" height="4" fill="#108040"/><rect x="2" y="2" width="1" height="1" fill="#F8F8F8"/><rect x="28" y="6" width="1" height="1" fill="#F8F8F8"/></svg>`,
  wario: `<svg viewBox="0 0 32 24" shape-rendering="crispEdges" preserveAspectRatio="none"><rect width="32" height="24" fill="#F8D800"/><rect width="32" height="8" fill="#8020C0"/><rect x="6" y="10" width="3" height="10" fill="#8020C0"/><rect x="9" y="17" width="3" height="3" fill="#8020C0"/><rect x="12" y="13" width="3" height="4" fill="#8020C0"/><rect x="15" y="17" width="3" height="3" fill="#8020C0"/><rect x="18" y="10" width="3" height="10" fill="#8020C0"/><rect x="23" y="12" width="4" height="4" fill="#E82820"/><rect x="24" y="10" width="2" height="2" fill="#E82820"/><rect x="2" y="2" width="4" height="4" fill="#F8D800"/><rect x="3" y="1" width="2" height="1" fill="#F8D800"/></svg>`,
  metroid: `<svg viewBox="0 0 32 24" shape-rendering="crispEdges" preserveAspectRatio="none"><rect width="32" height="24" fill="#000000"/><rect x="0" y="16" width="32" height="8" fill="#302040"/><rect x="12" y="4" width="8" height="8" fill="#108040"/><rect x="14" y="2" width="4" height="2" fill="#108040"/><rect x="13" y="6" width="2" height="2" fill="#E82820"/><rect x="17" y="6" width="2" height="2" fill="#E82820"/><rect x="14" y="12" width="1" height="2" fill="#F8D800"/><rect x="17" y="12" width="1" height="2" fill="#F8D800"/><rect x="4" y="10" width="2" height="6" fill="#E88020"/><rect x="3" y="8" width="4" height="2" fill="#E88020"/><rect x="25" y="3" width="1" height="1" fill="#F8F8F8"/><rect x="8" y="2" width="1" height="1" fill="#F8F8F8"/></svg>`,
};

/* ------------------------------------------------------------------
   The cabinet's sticker font: a hand-drawn 3x5, for the CONTINUE?
   banner, slot numbers and the small no-cover card. Rendered as SVG
   rects so it sits on the logical grid at every zoom.
   ------------------------------------------------------------------ */
const G3 = {
  " ": ["000","000","000","000","000"],
  "0": ["111","101","101","101","111"], "1": ["010","110","010","010","111"],
  "2": ["111","001","111","100","111"], "3": ["111","001","111","001","111"],
  "4": ["101","101","111","001","001"], "5": ["111","100","111","001","111"],
  "6": ["111","100","111","101","111"], "7": ["111","001","001","001","001"],
  "8": ["111","101","111","101","111"], "9": ["111","101","111","001","111"],
  "C": ["111","100","100","100","111"], "O": ["111","101","101","101","111"],
  "N": ["110","101","101","101","101"], "T": ["111","010","010","010","010"],
  "I": ["111","010","010","010","111"], "U": ["101","101","101","101","111"],
  "E": ["111","100","110","100","111"], "?": ["111","001","011","000","010"],
  "M": ["101","111","101","101","101"], "R": ["110","101","110","101","101"],
  "/": ["001","001","010","100","100"],
};
function sticker(text, cls) {
  const chars = [...text.toUpperCase()];
  let d = "";
  chars.forEach((ch, i) => {
    const g = G3[ch] || G3[" "];
    g.forEach((row, y) => [...row].forEach((b, x) => { if (b === "1") d += `M${i*4+x} ${y}h1v1h-1z`; }));
  });
  const w = chars.length * 4 - 1;
  return `<span class="sticker ${cls||""}"><svg width="${w}" height="5" viewBox="0 0 ${w} 5" shape-rendering="crispEdges"><path class="px" d="${d}"/></svg></span>`;
}

/* ------------------------------------------------------------------
   State. Survives resize: only --s changes with the container.
   ------------------------------------------------------------------ */
const q = new URLSearchParams(location.search);
if (q.has("still")) document.documentElement.classList.add("still");
const state = {
  focus: +(q.get("focus") ?? 3),       // Spelunky
  zone: q.get("zone") || "strip",      // strip | side | operator
  side: 0,                             // 1P
  op: 0,
  attract: q.has("attract"),
  attractIdx: 3,
  countdown: 9,
};
const OPS = ["Settings", "Network", "Identity"];
const frame = document.getElementById("frame");

/* plan(width, height): the only layout decision. Integer scale, black bars. */
function plan(w, h) {
  const s = Math.max(1, Math.floor(Math.min(w / 320, h / 240)));
  return { s };
}
function fit() {
  const { s } = plan(innerWidth, innerHeight);
  frame.style.setProperty("--s", s);
}

function cover(g, big) {
  if (!g.art) {
    const words = g.t.split(" ");
    return `<div class="house">
      <span class="marquee">${words.join("<br>")}</span>
      ${words.map(w => sticker(w)).join("")}
    </div>`;
  }
  if (g.art.startsWith("svg:")) return `<div class="art">${DRAWN[g.art.slice(4)]}</div>`;
  return `<img src="${ART[g.art]}" alt="">`;
}

function renderStrip() {
  const n = GAMES.length;
  let html = "";
  for (let d = -3; d <= 3; d++) {
    const i = (state.focus + d + n) % n;
    const g = GAMES[i];
    const f = d === 0;
    html += `<div class="slot${f ? " focus" : ""}" role="option" aria-selected="${f}" data-i="${i}" title="${g.t}">
      ${cover(g, f)}
      ${g.resume ? `<span class="cont">${sticker("CONTINUE?")}${f ? sticker(String(state.countdown)) : ""}</span><span class="count">${sticker(String(state.countdown))}</span>` : ""}
      <span class="num">${sticker(String(i + 1))}</span>
    </div>`;
  }
  document.getElementById("strip").innerHTML = html;
}

function titleHtml(t) {
  const big = t.length * 16 <= 300;
  const cls = big ? "marquee x2 chrome" : "marquee chrome x1";
  return `<span class="${cls}" data-t="${t}">${t}</span>`;
}

function renderTable() {
  const g = GAMES[state.focus];
  const big = g.t.length * 16 <= 300;
  const two = g.places.length === 2;
  const sides = g.places.map((p, i) => {
    const on = two ? i === state.side : true;
    const cur = state.zone === "side" && i === state.side;
    return `<li class="side${on ? " on" : ""}${cur ? " cur" : ""}" tabindex="-1">
      <span class="k p">${i + 1}P</span><span class="v">${p}</span>
      <span class="n">${two && on ? (cur ? "A plays here" : "your side") : ""}</span></li>`;
  }).join("");
  document.getElementById("table").innerHTML = `
    <h2 class="title${big ? "" : " small"}">${titleHtml(g.t)}</h2>
    <ul class="rows">
      <li><span class="k">System</span><span class="v">${g.sys}</span><span class="n"></span></li>
      <li><span class="k">Plays</span><span class="v">${g.plays}</span><span class="n"></span></li>
      <li><span class="k">Last</span><span class="v">${g.last}</span><span class="n"></span></li>
      ${sides}
    </ul>`;
}

function renderOperator() {
  const ops = OPS.map((o, i) => {
    const cur = state.zone === "operator" && i === state.op;
    return `<span class="op${cur ? " cur" : ""}" tabindex="-1">${o}</span>`;
  }).join(`<span class="dot">·</span>`);
  document.getElementById("operator").innerHTML =
    `<span class="lab">Operator:</span>${ops}<span class="pad">mini</span>`;
  document.getElementById("ant").textContent = `${WIFI.ssid} ${WIFI.pct}%`;
}

function renderAttract() {
  const g = GAMES[state.attractIdx];
  const two = g.places.length === 2;
  document.getElementById("attract").innerHTML = `
    <span class="demo">Demo</span>
    <span class="cred">Credit <b>21:47</b></span>
    <div class="big">${g.art ? (g.art.startsWith("svg:") ? `<div class="art" style="width:160px;height:120px">${DRAWN[g.art.slice(4)]}</div>` : `<img src="${ART[g.art]}" alt="" onload="bigFit(this)">`) : cover(g, true)}</div>
    <div class="at">${titleHtml(g.t)}</div>
    <div class="facts"><span class="k">${g.sys}</span> &nbsp; <span class="k">Plays</span> ${g.plays} &nbsp; <span class="k">Last</span> ${g.last}${two ? ` &nbsp; <span class="k">1P</span> ${g.places[0]} <span class="k">2P</span> ${g.places[1]}` : ""}</div>
    <p class="coin marquee"><span class="b">Press start</span></p>`;
}

/* Attract cover: integer scale only. 2x when it fits the 288x128 stage, else 1x. */
function bigFit(img) {
  const k = (img.naturalWidth * 2 <= 288 && img.naturalHeight * 2 <= 128) ? 2 : 1;
  img.width = img.naturalWidth * k; img.height = img.naturalHeight * k;
}

function render() {
  frame.classList.toggle("attract", state.attract);
  frame.className = (state.attract ? "attract " : "") + "zone-" + state.zone;
  renderStrip(); renderTable(); renderOperator();
  if (state.attract) renderAttract();
}

/* ------------------------------------------------------------------
   Input: the host sends semantic actions; keys stand in for them here.
   ------------------------------------------------------------------ */
const n = GAMES.length;
function act(a) {
  if (state.attract) { state.attract = false; idle(); render(); return; }
  idle();
  const g = GAMES[state.focus];
  if (state.zone === "strip") {
    if (a === "left")  state.focus = (state.focus + n - 1) % n, state.side = 0;
    if (a === "right") state.focus = (state.focus + 1) % n, state.side = 0;
    if (a === "down")  state.zone = "side";
    if (a === "confirm") state.zone = g.places.length === 2 ? "side" : "strip";
  } else if (state.zone === "side") {
    if (a === "up")   state.side > 0 ? state.side-- : state.zone = "strip";
    if (a === "down") state.side < g.places.length - 1 ? state.side++ : state.zone = "operator";
    if (a === "back") state.zone = "strip";
    if (a === "confirm") console.log("launch", g.t, "on", g.places[state.side]);
  } else if (state.zone === "operator") {
    if (a === "left")  state.op = Math.max(0, state.op - 1);
    if (a === "right") state.op = Math.min(OPS.length - 1, state.op + 1);
    if (a === "up" || a === "back") state.zone = "side";
    if (a === "confirm") console.log("open", OPS[state.op]);
  }
  if (a === "menu") state.zone = "operator";
  render();
}
const KEYS = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
  Enter: "confirm", z: "confirm", Escape: "back", x: "back", Tab: "menu" };
addEventListener("keydown", e => { const a = KEYS[e.key]; if (a) { e.preventDefault(); act(a); } });

/* Attract: idle 30 s on the select screen, then a showcase that cycles
   one game every 4 s with a hard cut. Any press returns. */
let idleT, cycleT;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
function idle() {
  clearTimeout(idleT); clearInterval(cycleT);
  if (reduced) return;
  idleT = setTimeout(() => { state.attract = true; startCycle(); render(); }, 30000);
}
function startCycle() {
  clearInterval(cycleT);
  cycleT = setInterval(() => { state.attractIdx = (state.attractIdx + 1) % n; renderAttract(); }, 4000);
}
/* "Insert coin" / "Press start" alternate; the countdown digit ticks. */
if (!reduced && !q.has("still")) {
  let tick = 0;
  setInterval(() => {
    tick++;
    document.getElementById("coin").textContent = tick % 2 ? "Press start" : "Insert coin";
    state.countdown = 9 - (tick % 10);
    if (!state.attract) renderStrip();
  }, 2000);
}

addEventListener("resize", fit);
fit(); render(); frame.focus();
if (state.attract) startCycle(); else idle();
</script>
