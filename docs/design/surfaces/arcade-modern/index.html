:root {
  --ground: #1322C8;      /* board blue */
  --pit: #06073F;         /* pit navy, the ground's deep end */
  --hot: #FF3A1E;         /* hot orange-red */
  --chrome: #F4F6FF;      /* chrome white */
  --focus: #FFD41A;       /* start yellow */
  --sweep: #5CF0FF;       /* sweep cyan */
  --display: "Barlow Condensed Display", "Impact", sans-serif;
  --text: "Barlow Condensed Text", "Arial Narrow", sans-serif;
  /* spacing scale: 4 8 12 16 24 32 48, times k = max(.6, min(w/1280, h/720)); JS writes the rounded values */
  --grid: 4px; --k: 1; --kt: 1;   /* --kt: type scale, k clamped to [.6, 1.2] because the panel width stops growing at 380 */
  --sp-4: 4px; --sp-8: 8px; --sp-12: 12px; --sp-16: 16px; --sp-24: 24px; --sp-32: 32px; --sp-48: 48px;
  --top: 48px; --foot: 48px; --panelW: 333px; --bandH: 0px; --cardW: 320px; --title: 64px; --acardW: 480px; --oy: 30%;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--pit); }
body { font-family: var(--text); color: var(--chrome); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }

#screen { position: relative; width: 100%; height: 100%; overflow: hidden;
  background:
    radial-gradient(ellipse 70% 55% at 62% 62%, rgba(92,240,255,.22), transparent 70%),
    linear-gradient(170deg, var(--ground) 0%, #0B14A0 45%, var(--pit) 100%);
}
/* floor: hard diagonal light stripes, the era's rendered stage */
#screen::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(-28deg, transparent 0 46px, rgba(92,240,255,.07) 46px 52px);
  mask-image: linear-gradient(180deg, transparent 20%, #000 75%);
}
/* display face: 0 tracking on titles, +.02em on small caps readouts, never wider */
.caps { letter-spacing: .02em; }

/* ---------- top bar: one thin strip with a banded rule across the full width ---------- */
#topbar { position: absolute; left: 0; right: 0; top: 0; height: var(--top); z-index: 30;
  background: linear-gradient(180deg, rgba(6,7,63,.85), rgba(6,7,63,.55)); }
#topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
  background: linear-gradient(90deg, var(--focus) 0 34%, var(--sweep) 34% 100%); }
.corner { position: absolute; top: 0; height: var(--top); display: flex; align-items: baseline; z-index: 31;
  padding-top: calc((var(--top) - 1em) / 2);
  font-family: var(--display); font-size: calc(var(--top) * .5); line-height: 1; color: var(--chrome);
  text-shadow: 2px 2px 0 var(--pit); }
.corner.tl { left: var(--sp-24); gap: .35em; }
.corner.tl b { color: var(--focus); font-weight: 900; }
.corner.tr { right: var(--sp-24); gap: .4em; }
.corner .strut { width: 0; overflow: hidden; }
.signal { display: inline-flex; align-items: flex-end; gap: 3px; height: .8em; }
.signal i { width: .3em; background: var(--pit); border: 1px solid rgba(92,240,255,.6); transform: skewX(-12deg); }
.signal i:nth-child(1) { height: 40%; } .signal i:nth-child(2) { height: 60%; } .signal i:nth-child(3) { height: 80%; } .signal i:nth-child(4) { height: 100%; }
.signal i.on { background: var(--sweep); box-shadow: 0 0 6px var(--sweep); border-color: var(--sweep); }
.corner.tr small { font-family: var(--text); font-size: .62em; color: var(--sweep); letter-spacing: 0; }

/* ---------- select: stage + panel ---------- */
#select { position: absolute; left: 0; right: 0; top: var(--top); bottom: var(--foot); }
#stage { position: absolute; left: 0; right: 0; top: 0; bottom: var(--bandH); }
#ring { position: absolute; inset: 0; overflow: visible; perspective: 1100px; perspective-origin: 50% var(--oy); }
/* the ring's guide track: the same ellipse the cards sit on */
#track { position: absolute; border: 1px solid rgba(92,240,255,.25); border-radius: 50%; pointer-events: none; }

/* ---------- panel: the ranking card ---------- */
#panel { position: absolute; z-index: 40; left: var(--sp-24); top: var(--sp-16); width: var(--panelW);
  padding: var(--sp-24) var(--sp-32) var(--sp-24) var(--sp-24); display: flex; flex-direction: column; gap: var(--sp-12); }
#panel::before { content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(100deg, var(--pit) 0%, #0A0D5C 100%);
  clip-path: polygon(0 0, 100% 0, calc(100% - var(--sp-24)) 100%, 0 100%);
  border-top: 3px solid var(--focus); box-shadow: inset 0 0 0 1px rgba(92,240,255,.22); }

#panel::after { content: ""; position: absolute; inset: 0; background: var(--hot); pointer-events: none; z-index: -1;
  clip-path: polygon(calc(100% - 4px) 0, 100% 0, calc(100% - var(--sp-24) + 4px) 100%, calc(100% - var(--sp-24)) 100%); }
.tab { position: absolute; left: var(--sp-24); top: 0; transform: translateY(-50%); z-index: 2;
  font-family: var(--display); font-size: max(11px, calc(14px * var(--kt))); line-height: 1; padding: var(--sp-4) var(--sp-8);
  background: var(--sweep); color: var(--pit); clip-path: polygon(0 0, 100% 0, calc(100% - 5px) 100%, 0 100%); }
#p-title { font-family: var(--display); font-size: calc(36px * var(--kt)); line-height: 1; white-space: nowrap; overflow: hidden; }
#p-title.wrap { white-space: normal; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: var(--sp-16); row-gap: var(--sp-4);
  font-size: calc(20px * var(--kt)); line-height: calc(24px * var(--kt)); }
.facts div { display: contents; }
.facts dt { color: var(--sweep); }
.facts dd { color: var(--chrome); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry { display: flex; gap: var(--sp-12); font-size: calc(16px * var(--kt)); line-height: calc(24px * var(--kt)); color: var(--sweep); opacity: .7; }
.entry b { font-weight: 600; color: var(--chrome); }

/* places: a one-line hint while focus is on the ring, the cabinet pair once focus moves down */
#places { display: none; }
#places.on { display: block; }
.hint { display: flex; align-items: center; gap: var(--sp-8); font-family: var(--display); font-size: calc(16px * var(--kt)); line-height: calc(24px * var(--kt)); color: var(--sweep); }
.hint .dn { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 7px solid var(--sweep); }
#places.open .hint { display: none; }
.cabs { display: none; align-items: stretch; }
#places.open .cabs { display: flex; }
.cab { flex: 1 1 0; min-width: 0; position: relative; padding: var(--sp-8); background: rgba(19,34,200,.45);
  border: 2px solid rgba(92,240,255,.45); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%);
  display: flex; flex-direction: column; gap: var(--sp-4); }
.cab .side { font-family: var(--display); font-size: calc(13px * var(--kt)); line-height: 1; color: var(--sweep); }
.cab .name { font-family: var(--display); font-size: calc(17px * var(--kt)); line-height: 1; color: var(--chrome); overflow-wrap: anywhere; }
.cab.lit { background: linear-gradient(180deg, rgba(255,212,26,.26), rgba(255,58,30,.18)); border-color: var(--focus); }
.cab.lit .name { color: var(--focus); }
.cab.lit::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--focus); box-shadow: 0 0 10px var(--focus); }
.cab.focus { outline: 3px solid var(--focus); outline-offset: 2px; box-shadow: 0 0 18px var(--focus); }
.link { flex: 0 0 auto; align-self: center; padding: 0 var(--sp-4); text-align: center; font-family: var(--display); font-size: calc(12px * var(--kt)); color: var(--hot); position: relative; }
.link::before { content: ""; position: absolute; left: 2px; right: 2px; top: 100%; height: 3px; background: var(--hot); margin-top: 2px; }

/* band mode: the panel drops under the stage as one strip */
#screen[data-mode="band"] #panel { left: 0; right: 0; top: auto; bottom: 0; width: auto;
  padding: var(--sp-16) var(--sp-16) var(--sp-12); flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: var(--sp-4) var(--sp-24); }
#screen[data-mode="band"] #panel::before { clip-path: none; }
#screen[data-mode="band"] #panel::after { display: none; }
#screen[data-mode="band"] .tab { left: var(--sp-16); }
#screen[data-mode="band"] #p-title { font-size: 24px; max-width: 48%; }
#screen[data-mode="band"] .entry { order: 1; }
#screen[data-mode="band"] #places { order: 2; }
#screen[data-mode="band"] .facts { display: flex; flex-wrap: wrap; gap: var(--sp-4) var(--sp-16); font-size: 15px; line-height: 20px; }
#screen[data-mode="band"] .facts div { display: flex; gap: var(--sp-8); }
#screen[data-mode="band"] .entry { margin-left: auto; font-size: 14px; line-height: 20px; }
#screen[data-mode="band"] #places { flex: 1 0 100%; }
#screen[data-mode="band"] .hint { font-size: 14px; line-height: 20px; }
#screen[data-mode="band"] .cab { flex-direction: row; align-items: baseline; gap: var(--sp-8); padding: var(--sp-4) var(--sp-8); }
#screen[data-mode="band"] .cab .side { font-size: 12px; }
#screen[data-mode="band"] .cab .name { font-size: 18px; }
#screen[data-mode="band"] .link { font-size: 11px; }

/* ---------- ring cards ---------- */
.card { --s: 1; --d: 0; position: absolute; width: var(--cardW); height: calc(var(--cardW) * .75);
  transform-origin: 50% 50%; will-change: transform; transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .3s;
  background: var(--pit); border: 3px solid var(--sweep);
  box-shadow: 0 0 0 2px var(--pit), 8px 10px 0 rgba(6,7,63,.6); }
/* letterboxed pictures sit on a hatched navy ground */
.card .pic { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden;
  background: repeating-linear-gradient(45deg, var(--pit) 0 7px, #0A0C52 7px 8px); }
.card .pic img, .card .pic svg { width: 100%; height: 100%; object-fit: contain; display: block; }
/* 1px inner chrome line inside the frame */
.card::before { content: ""; position: absolute; inset: 1px; border: 1px solid rgba(244,246,255,.45); pointer-events: none; z-index: 2; }
/* specular: a hard diagonal band */
.card::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background: linear-gradient(118deg, rgba(255,255,255,.0) 36%, rgba(255,255,255,.38) 36.5%, rgba(255,255,255,.14) 50%, transparent 50.5%); }
/* depth: a navy overlay, 0 at the front, 55% at the back */
.card .shade { position: absolute; inset: 0; background: var(--pit); opacity: var(--d); pointer-events: none; z-index: 3; transition: opacity .45s; }
.card.hidden { opacity: 0; pointer-events: none; }
.card.focused { border-color: var(--focus); box-shadow: 0 0 0 3px var(--pit), 0 0 28px rgba(255,212,26,.75), 14px 18px 0 rgba(6,7,63,.7); }
.card .bar { position: absolute; left: -3px; right: -3px; bottom: -3px; height: 6px; background: var(--focus); box-shadow: 0 0 12px var(--focus); opacity: 0; z-index: 4; }
.card.focused .bar { opacity: 1; }
.card .num { position: absolute; left: -3px; top: -3px; z-index: 5; padding: calc(2px / var(--s)) calc(8px / var(--s)) calc(1px / var(--s)) calc(6px / var(--s));
  font-family: var(--display); font-size: calc(14px / var(--s)); line-height: 1.1; letter-spacing: .02em;
  background: var(--sweep); color: var(--pit); clip-path: polygon(0 0, 100% 0, calc(100% - .4em) 100%, 0 100%); }
.card.focused .num { background: var(--focus); font-size: max(20px, calc(var(--cardW) * .065)); padding: 3px 12px 2px 8px; box-shadow: 3px 3px 0 var(--pit); }
/* a readable title only on the focused card's two nearest neighbours */
.card .cap { display: none; position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; padding: calc(3px / var(--s)) calc(8px / var(--s));
  font-family: var(--display); font-size: calc(13px / var(--s)); line-height: 1.1; color: var(--chrome); background: rgba(6,7,63,.86);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.near .cap { display: block; }
/* light sweep across the focused card */
.card.focused .sweep { position: absolute; inset: -4px; pointer-events: none; overflow: hidden; z-index: 3; }
.card.focused .sweep::before { content: ""; position: absolute; top: -40%; bottom: -40%; width: 22%; left: -30%;
  background: linear-gradient(90deg, transparent, rgba(92,240,255,.55) 45%, rgba(255,255,255,.85) 50%, rgba(92,240,255,.55) 55%, transparent);
  transform: skewX(-22deg); animation: sweep 5.5s linear infinite; }
@keyframes sweep { 0% { left: -30%; } 30% { left: 130%; } 100% { left: 130%; } }

/* CONTINUE flag */
.flag { position: absolute; right: -6px; top: calc(10px / var(--s)); z-index: 5; padding: calc(2px / var(--s)) calc(9px / var(--s)) calc(1px / var(--s)) calc(12px / var(--s));
  font-family: var(--display); font-size: calc(13px / var(--s)); letter-spacing: .02em;
  background: var(--hot); color: var(--chrome); clip-path: polygon(.6em 0, 100% 0, 100% 100%, .6em 100%, 0 50%);
  animation: flagglow 1.2s ease-in-out infinite alternate; }
.card.focused .flag { font-size: max(14px, calc(var(--cardW) * .045)); top: var(--sp-12); }
@keyframes flagglow { from { box-shadow: 0 0 4px var(--hot); filter: brightness(1); } to { box-shadow: 0 0 16px var(--hot); filter: brightness(1.25); } }

/* house card and vector covers */
.house { position: absolute; inset: 0; background: linear-gradient(160deg, #0B14A0, var(--pit) 70%); overflow: hidden; display: flex; align-items: center; justify-content: center; }
.house::before { content: ""; position: absolute; left: -20%; right: -20%; top: 58%; height: 14%; background: var(--hot); transform: skewY(-12deg); }
.house::after { content: ""; position: absolute; top: -40%; bottom: -40%; width: 18%; left: -30%; transform: skewX(-22deg);
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); animation: sweep 4s linear infinite; }
.house .ht { position: relative; font-family: var(--display); font-size: calc(var(--cardW) * .17); line-height: .9; text-align: center; padding: 0 8%;
  background: linear-gradient(180deg, var(--chrome) 0 44%, var(--sweep) 44% 52%, var(--chrome) 52% 62%, var(--focus) 62% 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(3px 3px 0 var(--pit)); }

/* plinth: a clear band the title sits on */
#plinth { position: absolute; transform: translate(-50%, 0); pointer-events: none; z-index: 5; }
#plinth .glow { position: absolute; left: -20%; right: -20%; top: -40%; bottom: -30%; border-radius: 50%; background: radial-gradient(ellipse at 50% 40%, rgba(255,212,26,.7), rgba(255,58,30,.35) 45%, transparent 72%); }
#plinth .slab { position: absolute; inset: 0; background: linear-gradient(180deg, #0B14A0, var(--pit)); clip-path: polygon(4% 0, 96% 0, 100% 100%, 0 100%); }
#plinth .slab::before { content: ""; position: absolute; left: 4%; right: 4%; top: 0; height: 4px; background: var(--focus); box-shadow: 0 0 12px var(--focus), 0 0 24px var(--focus); }

/* extruded big title */
#bigtitle { position: absolute; transform: translate(-50%, 0); z-index: 25; width: max-content; text-align: center;
  font-family: var(--display); font-size: var(--title); line-height: .9; letter-spacing: 0; pointer-events: none; white-space: nowrap; }
#bigtitle.wrap { white-space: pre-line; }
.ext3d { position: relative; display: inline-block; color: transparent; white-space: inherit;
  background: linear-gradient(180deg, var(--chrome) 0 40%, var(--sweep) 40% 50%, var(--chrome) 50% 58%, var(--focus) 58% 80%, var(--hot) 100%);
  -webkit-background-clip: text; background-clip: text; }
.ext3d::before { content: attr(data-t); position: absolute; inset: 0; z-index: -1; color: #8A1200; white-space: inherit;
  text-shadow: 1px 1px 0 #8A1200, 2px 2px 0 #8A1200, 3px 3px 0 #8A1200, 4px 4px 0 #7A1000, 5px 5px 0 #6A0E00, 6px 6px 0 #5A0C00, 7px 7px 0 #4A0A00, 8px 8px 0 #3A0800, 9px 9px 0 var(--pit), 11px 11px 0 var(--pit), 0 0 26px rgba(255,58,30,.6); }
#screen[data-mode="band"] #bigtitle .ext3d::before { text-shadow: 1px 1px 0 #8A1200, 2px 2px 0 #8A1200, 3px 3px 0 #7A1000, 4px 4px 0 #6A0E00, 5px 5px 0 #4A0A00, 6px 6px 0 var(--pit), 7px 7px 0 var(--pit), 0 0 18px rgba(255,58,30,.6); }
/* the panel's title: the same chrome banding, a three-step extrusion */
.ext3d.sm::before { text-shadow: 1px 1px 0 #8A1200, 2px 2px 0 #7A1000, 3px 3px 0 var(--pit), 4px 4px 0 var(--pit); }

/* chevrons flank the plinth band */
.chev { position: absolute; width: 0; height: 0; border-top: 14px solid transparent; border-bottom: 14px solid transparent; z-index: 24; opacity: .9;
  filter: drop-shadow(0 0 6px var(--focus)); transform: translateY(-50%); }
.chev.l { border-right: 18px solid var(--focus); }
.chev.r { border-left: 18px solid var(--focus); }

/* empty / message */
#msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: var(--sp-24); z-index: 26; }
#msg.on { display: flex; }
#msg .ext3d { font-size: var(--title); line-height: .9; }
#msg p { position: absolute; bottom: 14%; left: 0; right: 0; font-size: calc(20px * var(--k)); color: var(--sweep); }

/* ---------- foot: service line ---------- */
#foot { position: absolute; left: 0; right: 0; bottom: 0; height: var(--foot); display: flex; align-items: baseline; justify-content: space-between; z-index: 30;
  padding: calc((var(--foot) - var(--foot) * .46) / 2) var(--sp-24) 0; background: linear-gradient(180deg, rgba(6,7,63,0), rgba(6,7,63,.85) 40%); }
.svc { display: flex; align-items: baseline; gap: var(--sp-24); font-family: var(--display); font-size: calc(var(--foot) * .46); line-height: 1; white-space: nowrap;
  opacity: .55; transition: opacity .2s; }
#screen[data-zone="service"] .svc { opacity: 1; }
.svc .k { color: var(--hot); }
.svc .it { color: var(--chrome); padding: var(--sp-4) var(--sp-8); margin: calc(var(--sp-4) * -1) calc(var(--sp-8) * -1); }
.svc .it.focus { background: var(--focus); color: var(--pit); box-shadow: 0 0 14px var(--focus); clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%); }
.rom { display: flex; align-items: baseline; gap: var(--sp-12); font-family: var(--text); font-size: calc(var(--foot) * .36); line-height: 1; color: var(--sweep); white-space: nowrap; }
.rom b { color: var(--chrome); font-weight: 600; font-family: var(--display); font-size: 1.25em; letter-spacing: .02em; }
#screen[data-foot="2"] #foot { flex-direction: column; align-items: flex-start; justify-content: center; gap: var(--sp-4); padding-top: 0; }
#screen[data-foot="2"] .svc { font-size: calc(var(--foot) * .25); }
#screen[data-foot="2"] .rom { font-size: calc(var(--foot) * .2); align-self: flex-end; }

/* ---------- attract ---------- */
#attract { position: absolute; inset: 0; display: none; z-index: 20; overflow: hidden; --cardW: var(--acardW); --title: var(--atitle); }
#screen[data-state="attract"] #attract { display: block; }
#screen[data-state="attract"] #select, #screen[data-state="attract"] #foot { visibility: hidden; }
#attract .stage { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); perspective: 1100px; }
#attract .card { position: relative; width: var(--acardW); height: calc(var(--acardW) * .75); transform: rotateY(-22deg) rotateX(6deg); animation: cardin .6s cubic-bezier(.2,.9,.2,1) both;
  box-shadow: 0 0 0 3px var(--pit), var(--sp-16) var(--sp-24) 0 var(--pit); }
@keyframes cardin { from { transform: translate(-60vw, 40vh) rotateY(-50deg) scale(.4); } to { transform: rotateY(-22deg) rotateX(6deg); } }
#attract .wipe { position: absolute; inset: 0; background: linear-gradient(118deg, var(--hot) 0 50%, var(--focus) 50% 100%);
  clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); pointer-events: none; animation: wipe .7s cubic-bezier(.7,0,.3,1) both; z-index: 5; }
@keyframes wipe { 0% { clip-path: polygon(0 0, 30% 0, 0 100%, -30% 100%); } 100% { clip-path: polygon(130% 0, 160% 0, 130% 100%, 100% 100%); } }
/* the title sits fully below the card (its rotateX(6deg) bottom edge projects to about .42 acardW under the centre) with an sp16 gap */
#a-title { position: absolute; left: 50%; top: calc(44% + var(--acardW) * .42 + var(--sp-16)); transform: translateX(-50%); font-family: var(--display); font-size: var(--title); line-height: .9; width: max-content; max-width: 90vw; text-align: center; white-space: pre-line; }
#a-rank { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: var(--sp-16); align-items: baseline;
  font-family: var(--display); font-size: calc(var(--title) * .36); white-space: nowrap; letter-spacing: .02em; }
#a-rank .k { color: var(--sweep); }
#a-rank .v { color: var(--chrome); }
#a-rank .r { color: var(--focus); margin-right: var(--sp-8); text-shadow: 2px 2px 0 var(--hot); }
#press { position: absolute; left: 50%; bottom: calc(var(--foot) * .6); transform: translateX(-50%); font-family: var(--display); font-size: calc(var(--title) * .6);
  color: var(--focus); letter-spacing: .02em; text-shadow: 3px 3px 0 var(--hot), 0 0 18px var(--focus); animation: pulse 1s steps(1) infinite; white-space: nowrap; }
@keyframes pulse { 50% { opacity: 0; } }

/* still / reduced motion */
#screen.still *, #screen.still *::before, #screen.still *::after { animation-play-state: paused !important; transition: none !important; }
#screen.still #attract .card, #screen.still .wipe { animation: none !important; }
#screen.still .wipe { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); }
#screen.still .card.focused .sweep::before, #screen.still .house::after { animation: none !important; left: 60%; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .card.focused .sweep::before, .house::after { left: 35%; }
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

/* ring math: cards sit on an ellipse (rx, ry) seen from above; each card's depth d = (1 - cos th) / 2 sets its z

/* ---------- input: d-pad, A, B, options, menu ---------- */
function act(a) {

    else if (a === 'right' && N) focus = (focus + 1) % N;
    else if (a === 'down') zone = two(g) ? 'places' : 'service';
    else if (a === 'confirm' && g) { if (two(g)) zone = 'places'; else flash(); }
  } else if (zone === 'places') {

    else if (a === 'right') side = Math.min(g.places.length - 1, side + 1);

  const pl = document.getElementById('plinth').getBoundingClientRect();
  for (const i of vis) { if (i === focus) continue; const t = ring.children[i].querySelector('.num').getBoundingClientRect(); if (ix(t, f) || ix(t, pl)) out['tabHidden' + i] = Math.round(ix(t, f) + ix(t, pl)); }
  if (N > 4) { const ks = [-2, -1, 1, 2].map(k => R(((focus + k) % N + N) % N)); for (let a = 0; a < 4; a++) for (let b = a + 1; b < 4; b++) { const o = ix(ks[a], ks[b]); if (o) out['front' + a + b] = Math.round(o); } }
  out.visible = vis.length;
  const bt = document.getElementById('bigtitle').getBoundingClientRect(); out.title = rr(bt); out.titleCardGap = Math.round(bt.top - f.bottom);
  out.titleSize = document.getElementById('bigtitle').style.fontSize; out.ring = window.RING;
  return JSON.stringify(out);
};

buildRing(); applyPlan();
addEventListener('resize', () => { applyPlan(); });
if (attractAt >= 0) showAttract(attractAt); else armIdle();
</script>
