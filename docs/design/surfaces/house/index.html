/* ---------- drawing primitives ---------- */
const cv = document.getElementById("house");
const ctx = cv.getContext("2d");
function px(c,x,y,w=1,h=1){ ctx.fillStyle = PAL[c]; ctx.fillRect(x|0,y|0,w,h); }
function spr(rows,x,y){
  for (let j=0;j<rows.length;j++) for (let i=0;i<rows[j].length;i++){
    const ch = rows[j][i]; if (ch !== ".") px(ch,x+i,y+j);
  }
}
function glyph(font,ch){ const g = FONTS[font].g; return g[ch] || g["?"]; }
function textW(str,font){ let w=0; for (const ch of str) w += glyph(font,ch)[0]; return w; }
function text(str,x,y,font,col){
  let pen = x;
  for (const ch of str){
    const [adv,l,rows] = glyph(font,ch);
    for (let j=0;j<rows.length;j++) for (let i=0;i<rows[j].length;i++)
      if (rows[j][i] === "#") px(col,pen+l+i,y+j);
    pen += adv;
  }
  return pen - x;
}
function wrap(str,font,maxW){
  const words = str.split(" "); const lines = []; let line = "";
  for (const w of words){
    const t = line ? line+" "+w : w;
    if (textW(t,font) <= maxW || !line) line = t; else { lines.push(line); line = w; }
  }
  if (line) lines.push(line);
  return lines;
}
/* small seeded noise so the stars and grain hold still */
function rnd(n){ const x = Math.sin(n*127.1+311.7)*43758.5453; return x - Math.floor(x); }

  for (let k=1;k<12;k++){ const x = baseX+3*k, y = baseY-4*(k+1); px("T",x,y+4,3,4); }
  // handrail posts
  for (let k=1;k<12;k+=3){ const x = baseX+3*k+1, y = baseY-4*(k+1); px("T",x,y-8,1,8); }

}
function drawStairsL(baseX,baseY){

/* ---------- plan(width, height): the layout, as one function ---------- */
const HINT = "A at a console puts it in. B puts it back.";
function plan(W,H){
  const s = Math.max(1, Math.floor(Math.min(W/BASE_W, H/BASE_H)));
  const lw = Math.floor(W/s), lh = Math.floor(H/s);
  const ox = Math.floor((lw-BASE_W)/2), oy = lh - BASE_H;
  const capW = lw - 12;
  const lines = wrap(STOPS[cur].cap(), "x5", capW);
  const hint = held ? HINT : "";
  const hintInline = lines.length === 1 && hint && textW(lines[0],"x5") + 24 + textW(hint,"x5") <= capW;
  const hintBelow = !hintInline && hint && lines.length === 1;
  return { s, lw, lh, ox, oy, lines, hint, hintInline, hintBelow, garden: ox >= 40 };
}

function drawStrip(p){
  const y0 = p.lh - STRIP;
  px("K",0,y0,p.lw,STRIP); px("d",0,y0,p.lw,1);
  const lines = p.lines.slice(0,2);
  const top = lines.length === 1 && !p.hintBelow ? y0+7 : y0+3;
  lines.forEach((ln,i)=> text(ln, 6, top + i*10, "x5", "W"));
  if (p.hintInline) text(p.hint, p.lw - 6 - textW(p.hint,"x5"), top, "x5", "m");
  else if (p.hintBelow) text(p.hint, 6, top+10, "x5", "m");
}

function render(){
  const W = window.innerWidth, H = window.innerHeight;
  const p = plan(W,H);
  cv.width = p.lw; cv.height = p.lh;
  cv.style.width = p.lw*p.s + "px"; cv.style.height = p.lh*p.s + "px";
  ctx.setTransform(1,0,0,1,0,0);
  drawSky(p.lw,p.lh,p.oy);
  ctx.translate(0,p.oy);
  drawGarden(p.lw, p.ox);
  ctx.translate(p.ox,0);
  drawMoon(30,6);
  if (p.garden){ drawTree(-34); drawLamp(BASE_W+20); }
  drawHouse();
  drawFigure();
  ctx.setTransform(1,0,0,1,0,0);
  drawStrip(p);
}

/* ---------- focus: native buttons, the figure shows which ---------- */
const nav = document.getElementById("stops");
STOPS.forEach((s,i)=>{
  const b = document.createElement("button");
  b.type = "button"; b.id = "stop-"+s.id; b.tabIndex = i===cur ? 0 : -1;
  b.addEventListener("focus",()=>{ cur = i; syncLabels(); render(); });
  nav.appendChild(b);
});
function syncLabels(){
  [...nav.children].forEach((b,i)=>{ b.textContent = STOPS[i].cap() + (held ? " Carrying Spelunky. " + HINT : ""); b.tabIndex = i===cur ? 0 : -1; });
}
function go(i){ cur = i; syncLabels(); nav.children[i].focus({preventScroll:true}); render(); }
function move(dir){
  const s = STOPS[cur];
  if (dir==="left"||dir==="right"){
    const same = STOPS.map((t,i)=>[t,i]).filter(([t])=>t.floor===s.floor).sort((a,b)=>a[0].x-b[0].x);
    const k = same.findIndex(([,i])=>i===cur) + (dir==="right"?1:-1);
    if (same[k]) go(same[k][1]);
  } else {
    const f = s.floor + (dir==="up"?1:-1);
    const land = STOPS.findIndex(t=>t.floor===f && t.stairs);
    if (land >= 0) go(land);
  }
}
document.addEventListener("keydown",e=>{
  const map = { ArrowLeft:"left", ArrowRight:"right", ArrowUp:"up", ArrowDown:"down" };
  if (map[e.key]){ e.preventDefault(); move(map[e.key]); }
});
syncLabels();
addEventListener("resize", render);
render();
nav.children[cur].focus({preventScroll:true});
