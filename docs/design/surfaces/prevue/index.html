:root{
  /* Five hand-picked colours. No gradients anywhere. */
  --prevue-blue:#1f3fd2;   /* the channel's own blue: chrome, service rows, header */
  --cell-navy:#0a1868;     /* listing cells */
  --marquee-yellow:#f8d81c;/* clock, channel numbers, focus */
  --caption-white:#f6f6f0; /* titles */
  --grid-black:#000;       /* grid lines and the Amiga drop shadow */

  /* set by plan(w,h) in the script below */
  --u:2px;            /* one glyph pixel */
  --top-h:274px;      /* the fixed split */
  --bar-h:30px;
  --head-h:24px;
  --row-h:35px;
  --chan-w:168px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--grid-black);overflow:hidden}
body{
  font-family:"Kenney Pixel",sans-serif;
  font-size:calc(var(--u)*9);
  line-height:calc(var(--u)*8);
  color:var(--caption-white);
  -webkit-font-smoothing:none;font-smooth:never;
  text-rendering:optimizeSpeed;
}
.shadow,.tv{text-shadow:var(--u) var(--u) 0 var(--grid-black)}
button{font:inherit;color:inherit;background:none;border:0;text-align:left;cursor:default;text-shadow:inherit}

.tv{
  position:fixed;inset:0;
  display:grid;
  grid-template-rows:var(--top-h) var(--bar-h) 1fr;
  background:var(--grid-black);
}

/* ───────── top half: preview window + sidebar ───────── */
.top{
  display:grid;
  grid-template-columns:var(--win-w,auto) 1fr;
  gap:calc(var(--u)*3);
  padding:calc(var(--u)*3);
  background:var(--prevue-blue);
  min-height:0;
}
.window{
  position:relative;
  background:var(--grid-black);
  border:calc(var(--u)*2) solid;
  border-color:var(--grid-black) var(--cell-navy) var(--cell-navy) var(--grid-black);
  outline:var(--u) solid var(--caption-white);
  outline-offset:calc(var(--u)*-1);
  display:grid;place-items:center;
  overflow:hidden;min-height:0;
  container-type:size;
}
@container (max-height:200px){
  .window .slate b{font-size:calc(var(--u)*13.5)!important;line-height:calc(var(--u)*12)!important}
  .window .slate{padding:calc(var(--u)*12) calc(var(--u)*6) calc(var(--u)*4)!important}
}
.window img{
  width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block;
}
.window .bug{
  position:absolute;left:calc(var(--u)*3);top:calc(var(--u)*3);
  background:var(--marquee-yellow);color:var(--cell-navy);text-shadow:none;
  padding:var(--u) calc(var(--u)*3) 0;
  border-right:var(--u) solid var(--grid-black);border-bottom:var(--u) solid var(--grid-black);
}
.window .slate{
  width:100%;height:100%;
  display:grid;place-content:center;gap:calc(var(--u)*3);text-align:center;
  background:var(--cell-navy);padding:calc(var(--u)*6);
}
.window .slate.card{background:var(--prevue-blue);outline:var(--u) solid var(--marquee-yellow);outline-offset:calc(var(--u)*-6)}
.window .slate b{font-weight:normal;font-size:calc(var(--u)*27);line-height:calc(var(--u)*24);color:var(--marquee-yellow)}

.side{
  container-type:size;
  min-width:0;min-height:0;
  display:grid;
  grid-template-rows:auto 1fr auto;
  text-align:center;
  overflow:hidden;
}
.logo{
  justify-self:center;
  display:flex;align-items:flex-end;gap:calc(var(--u)*3);
  line-height:1;
}
.logo .k{height:calc(var(--u)*var(--logo-x,27));width:auto;display:block;overflow:visible}
.logo .g{
  background:var(--caption-white);color:var(--prevue-blue);text-shadow:none;
  padding:calc(var(--u)*2) calc(var(--u)*3) var(--u);
  margin-bottom:calc(var(--u)*2);
  box-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 var(--grid-black);
}
.promo{
  align-self:center;
  display:grid;justify-items:center;gap:calc(var(--u)*var(--promo-gap,3));
  padding-inline:calc(var(--u)*2);
}
.promo h1{
  font-weight:normal;
  font-size:calc(var(--u)*var(--title-x,18));
  line-height:calc(var(--u)*var(--title-lh,16));
  overflow-wrap:anywhere;
}
.facts{display:flex;flex-wrap:wrap;justify-content:center;column-gap:calc(var(--u)*9);row-gap:0}
.facts span b{font-weight:normal;color:var(--marquee-yellow)}
.places{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:calc(var(--u)*3)}
.places .lbl{color:var(--marquee-yellow)}
.tag{
  padding:calc(var(--u)*2) calc(var(--u)*4) var(--u);
  background:var(--cell-navy);
  border:var(--u) solid var(--caption-white);
  box-shadow:var(--u) var(--u) 0 var(--grid-black);
}
.tag.on{background:var(--marquee-yellow);color:var(--cell-navy);text-shadow:none;border-color:var(--marquee-yellow);
  outline:var(--u) solid var(--caption-white);outline-offset:var(--u)}
.fine{
  font-size:calc(var(--u)*4.5);line-height:calc(var(--u)*5);
  display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 calc(var(--u)*6);
  text-shadow:calc(var(--u)/2) calc(var(--u)/2) 0 var(--grid-black);
}

/* ───────── the bar between the halves ───────── */
.bar{
  display:grid;grid-template-columns:var(--chan-w) 1fr;
  background:var(--grid-black);
  border-top:var(--u) solid var(--marquee-yellow);
  border-bottom:var(--u) solid var(--marquee-yellow);
  min-height:0;
}
.clock{
  display:grid;place-items:center;
  background:var(--marquee-yellow);color:var(--cell-navy);text-shadow:none;
  font-size:calc(var(--u)*var(--clock-x,13.5));line-height:1;
  padding-top:var(--u);
}
.crawl{
  overflow:hidden;white-space:nowrap;
  display:flex;align-items:center;
  font-size:calc(var(--u)*var(--crawl-x,9));
  padding-top:var(--u);
}
.crawl .run{transform:translateX(calc(var(--u)*-37))}
.crawl i{
  display:inline-block;width:calc(var(--u)*4);height:calc(var(--u)*4);
  background:var(--marquee-yellow);margin:0 calc(var(--u)*7);vertical-align:calc(var(--u)*1);
  box-shadow:var(--u) var(--u) 0 var(--prevue-blue);
}

/* ───────── listings grid ───────── */
.cols{
  display:grid;
  grid-template-columns:var(--chan-w) repeat(6,var(--col-w));
  column-gap:var(--u);
  width:var(--sheet-w);
}
.head{
  position:sticky;top:0;z-index:3;
  height:var(--head-h);
  background:var(--prevue-blue);
  border-bottom:var(--u) solid var(--grid-black);
  align-items:center;
  color:var(--marquee-yellow);
  min-height:0;
}
.head span{padding:calc(var(--u)*2) calc(var(--u)*2) 0 calc(var(--u)*3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head span:first-child{color:var(--caption-white);position:sticky;left:0;background:var(--prevue-blue);z-index:1}
.guide{
  overflow:hidden;min-height:0;position:relative;
  scroll-padding:var(--head-h) 0 0 var(--chan-w);
  background:var(--grid-black);
  scroll-behavior:auto;
}
.row{
  height:var(--row-h);
  margin-bottom:var(--u);
}
.chan{
  position:sticky;left:0;z-index:2;
  display:flex;align-items:center;gap:calc(var(--u)*3);
  padding:0 calc(var(--u)*3);
  background:var(--prevue-blue);
  border:var(--u) solid;border-color:#5a74f0 transparent transparent #5a74f0;border-width:var(--u) 0 0 var(--u);
  min-width:0;overflow:hidden;
}
.chan .n{
  font-size:calc(var(--u)*var(--num-x,13.5));line-height:1;
  color:var(--marquee-yellow);
  min-width:calc(var(--u)*var(--num-w,15));text-align:right;flex:none;
  padding-top:var(--u);
}
.chan .c{overflow:hidden;line-height:calc(var(--u)*8)}
.cell{
  position:relative;
  min-width:0;overflow:hidden;
  background:var(--cell-navy);
  border:var(--u) solid;border-color:#25339a transparent transparent #25339a;border-width:var(--u) 0 0 var(--u);
  padding:0 calc(var(--u)*2) 0 calc(var(--u)*3);
  display:flex;flex-direction:column;justify-content:center;
}
.cell.empty{border-color:transparent;background:#071050}
.svc .cell{background:var(--prevue-blue);border-color:#5a74f0 transparent transparent #5a74f0;color:var(--caption-white)}
.svc .cell .k{color:var(--marquee-yellow)}
.svc .chan{background:var(--marquee-yellow);color:var(--cell-navy);text-shadow:none;border-color:#fff7b0 transparent transparent #fff7b0}
.svc .chan .n{color:var(--prevue-blue)}

.g{
  display:block;width:100%;
  min-width:0;
  overflow:hidden;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;
  padding-right:calc(var(--u)*2);
}
.stack{justify-content:space-evenly}
.stack .g{-webkit-line-clamp:1;white-space:nowrap;text-overflow:ellipsis;display:block}
.stack{justify-content:center}

/* focus: the cell turns marquee yellow */
.g:focus{outline:none}
.cell:has(.g:focus):not(.stack),
.g.solo:focus{
  background:var(--marquee-yellow);
}
.cell:has(.g:focus){
  border-color:var(--caption-white);
  box-shadow:inset 0 0 0 var(--u) var(--grid-black);
  z-index:1;
}
.cell:has(.g:focus) .g:focus{color:var(--cell-navy);text-shadow:none}
.stack .g:focus{background:var(--marquee-yellow);margin-inline:calc(var(--u)*-3);padding-inline:calc(var(--u)*3);width:calc(100% + var(--u)*6)}

/* flags in the cell corner */
.flag{
  float:right;margin:calc(var(--u)*2) 0 var(--u) calc(var(--u)*3);
  font-size:calc(var(--u)*4.5);line-height:calc(var(--u)*4.5);
  padding:var(--u) calc(var(--u)*2) 0;
  text-shadow:none;
}
.flag.paused{background:var(--marquee-yellow);color:var(--cell-navy)}
.flag.paused::before{content:"";display:inline-block;width:calc(var(--u)*3);height:calc(var(--u)*3);margin-right:var(--u);
  border-inline:var(--u) solid var(--cell-navy);vertical-align:0}
.narrow .flag.paused{font-size:0;padding:var(--u)}
.narrow .flag.paused::before{margin:0;width:calc(var(--u)*4);height:calc(var(--u)*4);border-inline-width:calc(var(--u)*1.5)}
.narrow .flag.away{font-size:0;padding:0;width:calc(var(--u)*3);height:calc(var(--u)*3);border-width:calc(var(--u)/2)}
.flag.away{border:calc(var(--u)/2) solid var(--caption-white);color:var(--caption-white);padding-bottom:0}
.pips{
  float:right;margin:calc(var(--u)*2) 0 0 calc(var(--u)*3);
  display:flex;gap:var(--u);
}
.pips i{width:calc(var(--u)*3);height:calc(var(--u)*3);border:calc(var(--u)/2) solid var(--caption-white)}
.pips i:first-child:not(.h){background:var(--caption-white)}
.fine .legend{display:flex;align-items:center;gap:calc(var(--u)*2)}
.fine .legend .pips{float:none;margin:0 0 var(--u)}
.cell:has(.g:focus) .pips i{border-color:var(--cell-navy)}
.cell:has(.g:focus) .pips i:first-child{background:var(--cell-navy)}
.svc .cell:has(.g:focus) .k{color:var(--prevue-blue)}
.g:focus .flag.paused{background:var(--cell-navy);color:var(--marquee-yellow)}
.g:focus .flag.paused::before{border-color:var(--marquee-yellow)}
.g:focus .flag.away{border-color:var(--cell-navy);color:var(--cell-navy)}
/* the service rows already name channels 1 to 3 whenever the grid is on screen; a short sidebar drops the hint */
.narrow .fine .hint{display:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="tv" id="tv" aria-label="Korri Guide">
  <section class="top" aria-label="Preview">
    <div class="window" id="win"></div>
    <div class="side">
      <div class="logo" aria-label="Korri Guide"><svg class="k" id="wordmark" aria-hidden="true" shape-rendering="crispEdges"></svg><span class="g">Guide</span></div>
      <div class="promo" id="promo"></div>
      <div class="fine">
        <span>korri 0.4.1 · 9a1fb22</span>
        <span class="legend"><span class="pips"><i></i></span>this device <span class="pips"><i class="h"></i></span>zao</span>
        <span class="hint">Channels 1, 2 and 3 carry Settings, Wi-Fi and Identity</span>
      </div>
    </div>
  </section>

  <div class="bar">
    <div class="clock" aria-label="Time 21:47">21:47</div>
    <div class="crawl" aria-label="mini, connected to hummingbird-lake 72%, 12 games, Retroid Pocket Mini controller built-in">
      <div class="run">games<i></i>mini<i></i>connected to hummingbird-lake 72%<i></i>12 games<i></i>Retroid Pocket Mini controller, built-in<i></i>mini<i></i>connected to hummingbird-lake 72%<i></i>12 games</div>
    </div>
  </div>

  <section class="guide" id="guide" aria-label="Listings">
    <div class="cols head" aria-hidden="true">
      <span data-l="Last played" data-s="Played">Last played</span><span>Today</span><span>Yesterday</span><span>This week</span><span>This month</span><span>Earlier</span><span>Never</span>
    </div>
    <div id="rows"></div>
  </section>

/* the wordmark, drawn on a 7-row grid: yellow face, navy extrusion, black cast shadow */
(function(){
  const L = {
    K:["##..##","##.##.","####..","###...","####..","##.##.","##..##"],
    O:[".####.","##..##","##..##","##..##","##..##","##..##",".####."],
    R:["#####.","##..##","##..##","#####.","####..","##.##.","##..##"],
    I:["####",".##.",".##.",".##.",".##.",".##.","####"]};
  let x=0, d="";
  for(const ch of "KORRI"){
    L[ch].forEach((row,y)=>[...row].forEach((p,i)=>{ if(p==="#") d+=`M${x+i} ${y}h1v1h-1z`; }));
    x += L[ch][0].length+1;
  }
  const w=x-1, svg=document.getElementById("wordmark");
  svg.setAttribute("viewBox",`0 0 ${w+0.6} 8.2`);
  svg.innerHTML =
    `<path d="${d}" fill="#000" transform="translate(.6 1.2)"/>`+
    `<path d="${d}" fill="#0a1868" transform="translate(.2 .8)"/>`+
    `<path d="${d}" fill="#0a1868" transform="translate(.1 .4)"/>`+
    `<path d="${d}" fill="#f8d81c"/>`;
})();

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const guide = document.getElementById("guide"), rowsEl = document.getElementById("rows");
let html = "";
SERVICE.forEach((r,ri)=>{
  html += `<div class="row cols svc" data-r="${ri}"><div class="chan"><span class="n">${r.n}</span><span class="c">${r.name}</span></div>`;
  let c=0;
  r.blocks.forEach(b=>{
    html += `<div class="cell" style="grid-column:span ${b.span}"><button class="g" data-r="${ri}" data-c0="${c}" data-c1="${c+b.span-1}">${b.html}</button></div>`;
    c+=b.span;
  });
  html += `</div>`;
});
SYSTEMS.forEach((sys,si)=>{
  const ri = si+3;
  html += `<div class="row cols" data-r="${ri}"><div class="chan"><span class="n">${si+4}</span><span class="c">${sys}</span></div>`;
  for(let c=0;c<6;c++){
    const here = GAMES.map((g,i)=>({...g,i})).filter(g=>g.s===sys && g.c===c);
    if(!here.length){ html += `<div class="cell empty"></div>`; continue; }
    const stack = here.length>1;
    html += `<div class="cell${stack?" stack":""}">`;
    here.forEach(g=>{
      let mark = "";
      if(g.p.length>1) mark += `<span class="pips" aria-label="Plays in two places"><i></i><i></i></span>`;
      if(g.paused) mark += `<span class="flag paused">PAUSED</span>`;
      if(g.p.length===1 && g.p[0]!=="This device") mark += `<span class="flag away">zao</span>`;
      html += `<button class="g${stack?"":" solo"}" data-r="${ri}" data-c0="${c}" data-c1="${c}" data-g="${g.i}">${mark}${esc(g.t)}</button>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
});
rowsEl.innerHTML = html;

/* ── preview ── */
const win = document.getElementById("win"), promo = document.getElementById("promo");
function preview(i){
  const g = GAMES[i];
  const ch = SYSTEMS.indexOf(g.s)+4;
  /* the eight sample pictures belong to eight titles; the other three get a title card drawn here */
  win.innerHTML = (g.art==="CARD"
      ? `<div class="slate card"><b>${esc(g.t)}</b><span>${g.s}</span></div>`
      : g.art
      ? `<img src="${ART[g.art]}" alt="">`
      : `<div class="slate"><b>${esc(g.t)}</b><span>No picture on file</span></div>`)
    + `<span class="bug">${ch} ${g.s}</span>`;
  const places = g.p.map((p,k)=>`<button class="tag${k===0?" on":""}">${p}</button>`).join("");
  promo.innerHTML =
    `<h1>${esc(g.t)}</h1>`+
    `<div class="facts"><span><b>System</b> ${g.s}</span><span><b>Last played</b> ${g.lp}</span><span><b>Plays</b> ${g.n}</span></div>`+
    `<div class="places"><span class="lbl">Plays on</span>${places}</div>`;
}

/* ── d-pad movement across the two axes ── */
const all = () => [...guide.querySelectorAll(".g")];
function inRow(r){ return all().filter(b=>+b.dataset.r===r); }
function move(dx,dy){
  const cur = document.activeElement.closest(".g") ? document.activeElement : null;
  if(!cur) return;
  const r=+cur.dataset.r, c0=+cur.dataset.c0, c1=+cur.dataset.c1;
  let next=null;
  if(dx){
    const row = inRow(r);
    const sibs = row.filter(b=>dx>0 ? +b.dataset.c0>c1 : +b.dataset.c1<c0);
    sibs.sort((a,b)=> dx>0 ? a.dataset.c0-b.dataset.c0 : b.dataset.c1-a.dataset.c1);
    next = sibs[0];
  } else {
    /* a stacked cell steps through its games first */
    const inCell = [...cur.parentElement.querySelectorAll(".g")];
    const k = inCell.indexOf(cur)+dy;
    if(k>=0 && k<inCell.length) next = inCell[k];
    else for(let rr=r+dy; rr>=0 && rr<11 && !next; rr+=dy){
      const row = inRow(rr);
      if(!row.length) continue;
      const mid=(c0+c1)/2;
      row.sort((a,b)=>Math.abs((+a.dataset.c0+ +a.dataset.c1)/2-mid)-Math.abs((+b.dataset.c0+ +b.dataset.c1)/2-mid));
      const cands = row.filter(b=>b.parentElement===row[0].parentElement);
      next = dy>0 ? cands[0] : cands[cands.length-1];
    }
  }
  if(next){ next.focus({preventScroll:true}); next.scrollIntoView({block:"nearest"}); }
}
guide.addEventListener("focusin",e=>{
  const g=e.target.dataset.g; if(g!==undefined) preview(+g);
});
addEventListener("keydown",e=>{
  const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
  if(m){ e.preventDefault(); move(...m); }
});

/* ── plan(width, height): the whole layout decision, one place ── */
function plan(w,h){
  const u = Math.max(2, Math.floor(h/360));          /* one glyph pixel, whole numbers only */
  const topH = Math.round(h*0.34);                   /* the fixed split */
  const barH = u*15, headH = u*11;
  const minRow = u*17;                               /* two lines of 8 rows + a pixel */
  const body = h-topH-barH-headH;
  const rowH = Math.max(minRow, Math.floor(body/11)-u);
  const chanW = Math.round(Math.max(u*60, Math.min(w*0.13, u*84)));
  const minCol = u*62;                               /* about nine characters of title */
  const colW = Math.max(minCol, Math.floor((w-chanW-u*6)/6)); /* slots that do not fit run off the right edge, cut */
  const winW = Math.round(Math.min((topH-u*6)*4/3, w*0.4));
  const sideW = w-winW-u*9;
  return {u,topH,barH,headH,rowH,chanW,winW,
    big: sideW>600 && topH>220,          /* roomy sidebar: 6x logo, 4x title */
    narrow: colW < u*80,                  /* corner flags shrink to marks */
    colW,
    numX: chanW >= u*80 ? 13.5 : 9,
    clockX: 13.5, crawlX: 9};
}
function apply(){
  const p = plan(innerWidth, innerHeight), s=document.documentElement.style;
  s.setProperty("--u",p.u+"px");
  s.setProperty("--top-h",p.topH+"px");
  s.setProperty("--bar-h",p.barH+"px");
  s.setProperty("--head-h",p.headH+"px");
  s.setProperty("--row-h",p.rowH+"px");
  s.setProperty("--chan-w",p.chanW+"px");
  s.setProperty("--win-w",p.winW+"px");
  s.setProperty("--logo-x",p.big?36:16);
  s.setProperty("--promo-gap",p.big?3:1);
  s.setProperty("--title-x",p.big?18:13.5);
  s.setProperty("--title-lh",p.big?16:12);
  s.setProperty("--num-x",p.numX);
  s.setProperty("--num-w",p.numX>9?15:10);
  s.setProperty("--clock-x",p.clockX);
  s.setProperty("--col-w",p.colW+"px");
  s.setProperty("--sheet-w",(p.chanW+6*p.colW+6*p.u)+"px");
  document.getElementById("tv").classList.toggle("narrow",p.narrow);
  const ch=document.querySelector(".head span[data-s]"); ch.textContent = p.chanW < p.u*80 ? ch.dataset.s : ch.dataset.l;
  s.setProperty("--crawl-x",p.crawlX);
  const f=document.activeElement; if(f && f.classList.contains("g")) f.scrollIntoView({block:"nearest"});
}
addEventListener("resize",apply);
apply();
const start = guide.querySelector('[data-g="3"]');
start.focus({preventScroll:true});
preview(3);
