:root {
  --blue:   #1f5be6;
  --navy:   #0c1f66;
  --ink:    #081040;
  --white:  #ffffff;
  --yellow: #ffd21e;
  --red:    #e6322a;
  --green:  #22c34d;

  --slant: 10deg;
  --edge: 5px;

  --bounce: cubic-bezier(.34, 1.56, .64, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Rubik", sans-serif;
  font-style: italic;
  font-weight: 900;
  background: var(--blue);
  color: var(--white);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-transform: uppercase;
}

#app {
  position: relative;
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-rows: var(--tab-h) 1fr var(--band-h) var(--act-h) 1fr var(--foot-h);
  overflow: hidden;
}

/* ---------- ground stripes and speed lines ---------- */
.ground {
  position: absolute; inset: 0; pointer-events: none; overflow: hidden;
}
.ground .band {
  position: absolute; left: -10%; right: -10%;
  top: calc(var(--tab-h) + 6%); height: 22%;
  background: repeating-linear-gradient(-55deg, var(--navy) 0 26px, transparent 26px 64px);
  opacity: .28;
  transform: skewY(-3deg);
}
.ground .band.low {
  top: auto; bottom: calc(var(--foot-h) + var(--act-h) - 2%); height: 14%;
  opacity: .22; transform: skewY(-3deg);
}
.speed {
  position: absolute; height: 6px; background: var(--white); opacity: .85;
  transform: skewX(calc(-1 * var(--slant))); pointer-events: none; z-index: 0;
}
.speed.a { top: 30%; left: 1.5%; width: 9%; }
.speed.b { top: 30%; left: 11.5%; width: 3%; }
.speed.c { bottom: 30%; right: 1.5%; width: 9%; }
.speed.d { bottom: 30%; right: 11.5%; width: 3%; }

/* ---------- heavy text with hard drop edge ---------- */
.drop { text-shadow: var(--edge) var(--edge) 0 var(--ink); }
.drop-sm { text-shadow: 2px 2px 0 var(--ink); }

/* ---------- slanted panel primitive ---------- */
.slab {
  position: relative;
  clip-path: polygon(var(--k) 0, 100% 0, calc(100% - var(--k)) 100%, 0 100%);
  --k: 14px;
}

/* ---------- top tabs ---------- */
.tabs {
  position: relative; z-index: 2;
  display: flex; align-items: flex-end; gap: 6px;
  padding: 0 clamp(12px, 3vw, 40px);
  height: var(--tab-h);
}
.tab {
  position: relative;
  min-width: 0;
  flex: 0 1 auto;
  padding: 0 clamp(16px, 2.4vw, 34px) 0 clamp(20px, 2.8vw, 38px);
  height: calc(var(--tab-h) - 12px);
  display: flex; flex-direction: column; justify-content: center;
  color: var(--white);
  font-size: var(--tab-fs);
  line-height: 1;
  letter-spacing: .01em;
  transition: transform .18s var(--bounce);
}
.tab::before {
  content: ""; position: absolute; inset: 0;
  background: var(--navy);
  clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
  z-index: -1;
}
.tab::after {
  content: ""; position: absolute; inset: 0; transform: translate(4px, 4px);
  background: var(--ink);
  clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
  z-index: -3;
}
.tab .sub {
  font-weight: 600; font-size: .5em; letter-spacing: .04em; margin-top: 4px; opacity: .85;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tab.active { color: var(--navy); text-shadow: none; }
.tab.active::before { background: var(--yellow); }
.tab.active .sub { opacity: 1; }
.tab.focus { transform: translate(-3px, -6px); }
.tab.focus::before { box-shadow: none; }
.tab.focus .ring { opacity: 1; }
.ring {
  position: absolute; inset: -5px; z-index: -2; opacity: 0;
  background: var(--yellow);
  clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
}
.tab.active.focus .ring { background: var(--white); }
.tabs .spacer { flex: 1 1 0; min-width: 0; }
.device {
  align-self: center;
  font-size: calc(var(--tab-fs) * .55);
  font-weight: 700;
  color: var(--navy);
  background: var(--white);
  padding: 4px 12px 4px 14px;
  border-radius: 999px;
  white-space: nowrap;
}

/* ---------- zone band ---------- */
.band-wrap {
  position: relative; z-index: 1;
  overflow: hidden;
  min-height: 0;
}
.track {
  position: absolute; top: 50%; left: 0;
  display: flex; align-items: center;
  gap: var(--gap);
  transform: translate(var(--tx), -50%);
  transition: transform .32s var(--bounce);
  will-change: transform;
}
.card {
  position: relative;
  flex: 0 0 auto;
  width: var(--side-w);
  height: var(--side-h);
  transition: width .32s var(--bounce), height .32s var(--bounce), transform .32s var(--bounce), opacity .2s linear;
  transform: skewX(calc(-1 * var(--slant)));
  opacity: 1;
}
.card.hidden { opacity: 0; }
.card.focused {
  width: var(--focus-w);
  height: var(--focus-h);
  margin: 0 calc(var(--chev) + 14px);
  transform: skewX(calc(-1 * var(--slant) - 4deg)) translateY(-10px);
  z-index: 3;
}
.card .edge {
  position: absolute; inset: 0;
  background: var(--ink);
  transform: translate(var(--edge), var(--edge));
}
.card.focused .edge { transform: translate(8px, 8px); }
.card .lift {
  position: absolute; inset: 0;
  background: var(--yellow);
  opacity: 0;
  transform: scale(1.04, 1.03);
}
.card.focused .lift { opacity: 1; }
.card.focused.soft .lift { background: var(--white); }
.card .face {
  position: absolute; inset: 0;
  background: var(--navy);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.card .thumb {
  position: relative;
  flex: 0 0 58%;
  overflow: hidden;
  background: var(--ink);
}
.card .thumb img {
  position: absolute; inset: -6%;
  width: 112%; height: 112%;
  object-fit: cover;
  image-rendering: pixelated;
  transform: skewX(var(--slant));
}
.card.focused .thumb img { transform: skewX(calc(var(--slant) + 4deg)); }
.card .thumb.placeholder {
  background: repeating-linear-gradient(-55deg, var(--red) 0 14px, var(--navy) 14px 28px);
  display: grid; place-items: center;
}
.card .thumb.placeholder span {
  font-size: calc(var(--card-fs) * 2.4);
  line-height: 1;
  color: var(--white);
  text-shadow: 4px 4px 0 var(--ink);
  transform: skewX(var(--slant)) translateX(-4px);
  background: var(--red);
  padding: 2px 12px 0 16px;
}
.card .body {
  flex: 1 1 auto;
  display: flex; flex-direction: column; justify-content: center; gap: 6px;
  padding: 6px 16px 8px 12px;
  min-height: 0;
  transform: skewX(var(--slant));
  transform-origin: 0 0;
}
.card .title {
  font-size: var(--card-fs);
  line-height: .96;
  color: var(--white);
  text-shadow: 3px 3px 0 var(--ink);
  overflow: hidden;
  max-height: calc(var(--card-fs) * .96 * 2);
  word-break: normal;
  overflow-wrap: anywhere;
}
.card .act {
  display: flex; align-items: center; gap: 6px;
}
.pill {
  display: inline-block;
  font-size: calc(var(--card-fs) * .5);
  font-weight: 800;
  line-height: 1;
  padding: 4px 9px 3px 10px;
  border-radius: 999px;
  background: var(--white);
  color: var(--navy);
  white-space: nowrap;
}
.pill.zao { background: var(--red); color: var(--white); }
.pill.here { background: var(--green); color: var(--white); }

/* ribbon */
.ribbon {
  position: absolute; z-index: 2;
  top: 14px; right: -36px;
  width: 150px;
  padding: 4px 0;
  text-align: center;
  background: var(--green);
  color: var(--white);
  font-size: calc(var(--card-fs) * .52);
  line-height: 1;
  transform: skewX(var(--slant)) rotate(32deg);
  box-shadow: 3px 3px 0 var(--ink);
  letter-spacing: .02em;
}

/* chevrons */
.chev {
  position: absolute; top: 50%; z-index: 4;
  width: var(--chev); height: calc(var(--chev) * .9);
  transform: translateY(-50%);
  pointer-events: none;
  transition: left .32s var(--bounce), right .32s var(--bounce), opacity .2s;
}
.chev i {
  position: absolute; top: 0; bottom: 0; width: 46%;
  background: var(--yellow);
  clip-path: polygon(0 0, 55% 0, 100% 50%, 55% 100%, 0 100%, 45% 50%);
  filter: drop-shadow(3px 3px 0 var(--ink));
}
.chev i:nth-child(1) { left: 0; }
.chev i:nth-child(2) { left: 46%; }
.chev.left { left: calc(50% - var(--focus-w) / 2 - var(--chev) - 12px); animation: nudgeR .7s ease-in-out infinite alternate; }
.chev.right { right: calc(50% - var(--focus-w) / 2 - var(--chev) - 12px); transform: translateY(-50%) scaleX(-1); animation: nudgeL .7s ease-in-out infinite alternate; }
.chev.dim { opacity: .35; }
.chev.off { opacity: 0; }
@keyframes nudgeR { from { margin-left: 0; } to { margin-left: 8px; } }
@keyframes nudgeL { from { margin-right: 0; } to { margin-right: 8px; } }

/* ---------- action row ---------- */
.actions {
  position: relative; z-index: 2;
  height: var(--act-h);
  display: flex; justify-content: center; align-items: center; gap: 14px;
  padding: 0 12px;
}
.btn {
  position: relative;
  height: calc(var(--act-h) - 14px);
  padding: 0 clamp(14px, 2vw, 26px) 0 clamp(18px, 2.4vw, 30px);
  display: flex; align-items: center;
  font-size: var(--btn-fs);
  line-height: 1;
  color: var(--white);
  text-shadow: 2px 2px 0 var(--ink);
  transition: transform .18s var(--bounce);
  white-space: nowrap;
}
.btn::before {
  content: ""; position: absolute; inset: 0; z-index: -1;
  background: var(--navy);
  clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
}
.btn::after {
  content: ""; position: absolute; inset: 0; z-index: -3;
  background: var(--ink); transform: translate(4px, 4px);
  clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
}
.btn.lit::before { background: var(--green); }
.btn .ring { clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }
.btn.focus { transform: translate(-2px, -4px) skewX(-4deg); }
.btn.focus .ring { opacity: 1; }
.btn .hint {
  font-weight: 700; font-size: .62em; margin-left: 10px; opacity: .9; text-shadow: none;
  color: var(--navy); background: var(--white); border-radius: 999px; padding: 3px 8px 2px;
}
.btn.lit .hint { color: var(--green); }
.btn:active, .btn.pressed { transform: translate(2px, 2px); }
.btn.pressed::after { transform: translate(1px, 1px); }

/* ---------- bottom strip ---------- */
.foot {
  position: relative; z-index: 2;
  height: var(--foot-h);
  display: flex; align-items: center; gap: clamp(10px, 2vw, 28px);
  padding: 0 clamp(12px, 3vw, 40px);
  color: var(--white);
}
.foot::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 100%;
  background: var(--navy);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
  opacity: .55; z-index: -1;
}
.foot .stripe {
  position: absolute; left: 0; right: 0; top: 0; height: 5px;
  background: repeating-linear-gradient(90deg, var(--yellow) 0 36px, var(--white) 36px 48px, transparent 48px 72px);
  transform: skewX(calc(-1 * var(--slant)));
}
.timer {
  display: flex; align-items: baseline; gap: 10px;
  font-size: var(--foot-fs);
  line-height: 1;
}
.timer .label { color: var(--yellow); font-size: .62em; }
.timer .digits { font-variant-numeric: tabular-nums; }
.foot .spacer { flex: 1 1 0; min-width: 0; }
.badge {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: calc(var(--foot-fs) * .5);
  font-weight: 700;
  color: var(--navy);
  background: var(--white);
  padding: 5px 12px 4px 12px;
  border-radius: 999px;
  white-space: nowrap;
  text-transform: none;
  max-width: 48%;
  overflow: hidden;
}
.badge .ssid { overflow: hidden; text-overflow: ellipsis; }
.badge .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.badge .bars b { display: block; width: 4px; background: var(--navy); opacity: .25; }
.badge .bars b.on { opacity: 1; }
.badge .bars b:nth-child(1) { height: 4px; }
.badge .bars b:nth-child(2) { height: 7px; }
.badge .bars b:nth-child(3) { height: 10px; }
.badge .bars b:nth-child(4) { height: 12px; }
.build {
  font-weight: 500;
  font-size: calc(var(--foot-fs) * .38);
  letter-spacing: .02em;
  opacity: .8;
  text-transform: none;
  white-space: nowrap;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

const GAMES = [
  { title: "Celeste Classic", system: "PICO-8", places: ["here"], art: "SUMMIT", resumable: true },
  { title: "Hollow Knight", system: "Switch", places: ["here"], art: "KNIGHT" },
  { title: "Tetris", system: "GB", places: ["zao"], art: "BLOCKS" },
  { title: "Spelunky", system: "PC", places: ["here", "zao"], art: "CAVERN" },
  { title: "Lantern Keep", system: "PC", places: ["here"], art: "TOWER" },
  { title: "Tide Pool", system: "Mega Drive", places: ["zao"], art: "SHORE" },
  { title: "Comet Courier", system: "PC", places: ["here"], art: null },
  { title: "Bramble Run", system: "GBA", places: ["here"], art: "BRAMBLE" },
  { title: "Petal Quest", system: "PICO-8", places: ["here"], art: "SUMMIT", hue: 300 },
  { title: "The Legend of Zelda: Oracle of Seasons", system: "GBC", places: ["here"], art: "KNIGHT", hue: 110 },
  { title: "Wario Land 4", system: "GBA", places: ["here", "zao"], art: "BLOCKS", hue: 200, zoom: 1.5, origin: "50% 50%" },
  { title: "Super Metroid", system: "SNES", places: ["here"], art: "COMET", pos: "50% 0%", zoom: 1.5 },
];

const TABS = [
  { label: "Games", sub: "" },
  { label: "Options", sub: "Settings  Wi-Fi" },
  { label: "Save data", sub: "Identity" },
];

const WIFI = { ssid: "hummingbird-lake", signal: 72 };
const DEVICE = "mini";

// ---------- state ----------
const state = { zone: "cards", card: 3, tab: 0, action: 0 };
// fixture override for screenshots: ?card=9&zone=tabs&tab=1&action=1
const q = new URLSearchParams(location.search);
if (q.has("card")) state.card = +q.get("card");
if (q.has("zone")) state.zone = q.get("zone");
if (q.has("tab")) state.tab = +q.get("tab");
if (q.has("action")) state.action = +q.get("action");

// ---------- plan(width, height): the layout as a pure function ----------
const WIDE_W = 1000;      // px: 5 cards visible at or above, 3 below
const TALL_H = 600;       // px: full-height strips at or above
const FOCUS_H_MAX = 380;  // px: the focused card never grows past this
const CARD_RATIO = 0.82;  // width / height of a zone card
const SIDE_SCALE = 0.72;  // side card height as a share of the focused card
const BAND_PAD = 28;      // px above and below the band, for lift and edge
const OUTER = 24;         // px: horizontal margin either side of the band

function plan(W, H) {
  const wide = W >= WIDE_W;
  const tall = H >= TALL_H;
  const visible = wide ? 5 : 3;
  const tabH = tall ? 64 : 50;
  const footH = tall ? 54 : 42;
  const actH = tall ? 62 : 48;
  const chev = wide ? 52 : 36;
  const gap = wide ? 18 : 12;
  const bandH = H - tabH - footH - actH;
  let focusH = Math.min(FOCUS_H_MAX, bandH - BAND_PAD * 2);
  let focusW = Math.round(focusH * CARD_RATIO);
  let sideH = Math.round(focusH * SIDE_SCALE);
  let sideW = Math.round(sideH * CARD_RATIO);
  const skew = Math.tan(10 * Math.PI / 180); // the slant adds width at the band's two ends
  const fixed = (visible - 1) * gap + 2 * (chev + 14) + OUTER * 2;
  const cards = focusW + (visible - 1) * sideW + skew * sideH * 2;
  const scale = Math.min(1, (W - fixed) / cards);
  focusH = Math.round(focusH * scale); focusW = Math.round(focusW * scale);
  sideH = Math.round(sideH * scale); sideW = Math.round(sideW * scale);
  return {
    visible, tabH, footH, actH, chev, gap, focusH, focusW, sideH, sideW,
    tabFs: tall ? 22 : 17,
    btnFs: tall ? 20 : 16,
    footFs: tall ? 26 : 21,
    cardFs: Math.round(focusW * 0.105),
    sideFs: Math.round(sideW * 0.092),
  };
}

// ---------- render ----------
const $ = (s) => document.querySelector(s);
const app = $("#app"), tabsEl = $("#tabs"), track = $("#track"), actionsEl = $("#actions");
let P = plan(innerWidth, innerHeight);

function applyPlan() {
  P = plan(innerWidth, innerHeight);
  const s = app.style;
  s.setProperty("--tab-h", P.tabH + "px");
  s.setProperty("--foot-h", P.footH + "px");
  s.setProperty("--act-h", P.actH + "px");
  s.setProperty("--band-h", (P.focusH + BAND_PAD * 2) + "px");
  s.setProperty("--chev", P.chev + "px");
  s.setProperty("--gap", P.gap + "px");
  s.setProperty("--focus-w", P.focusW + "px");
  s.setProperty("--focus-h", P.focusH + "px");
  s.setProperty("--side-w", P.sideW + "px");
  s.setProperty("--side-h", P.sideH + "px");
  s.setProperty("--tab-fs", P.tabFs + "px");
  s.setProperty("--btn-fs", P.btnFs + "px");
  s.setProperty("--foot-fs", P.footFs + "px");
}

function buildTabs() {
  tabsEl.innerHTML = "";
  TABS.forEach((t, i) => {
    const el = document.createElement("div");
    el.className = "tab drop-sm" + (i === 0 ? " active" : "");
    el.innerHTML = `<span class="ring"></span><span>${t.label}</span>` + (t.sub ? `<span class="sub">${t.sub}</span>` : "");
    el.dataset.i = i;
    tabsEl.appendChild(el);
  });
  const sp = document.createElement("div"); sp.className = "spacer"; tabsEl.appendChild(sp);
  const dev = document.createElement("div"); dev.className = "device"; dev.textContent = DEVICE; tabsEl.appendChild(dev);
}

function buildCards() {
  track.innerHTML = "";
  GAMES.forEach((g, i) => {
    const el = document.createElement("div");
    el.className = "card";
    el.dataset.i = i;
    const initials = g.title.split(/\s+/).map(w => w[0]).join("").slice(0, 2);
    const thumb = g.art
      ? `<div class="thumb"><img alt="" src="${ART[g.art]}" style="${g.hue ? `filter:hue-rotate(${g.hue}deg);` : ""}${g.pos ? `object-position:${g.pos};` : ""}${g.zoom ? `scale:${g.zoom};transform-origin:${g.origin || "50% 0"};` : ""}"></div>`
      : `<div class="thumb placeholder"><span>${initials}</span></div>`;
    const pills = `<span class="pill">${g.system}</span>` +
      (g.places.includes("zao") && !g.places.includes("here") ? `<span class="pill zao">zao</span>` : "") +
      (g.places.length === 2 ? `<span class="pill zao">+zao</span>` : "");
    el.innerHTML =
      `<div class="edge"></div><div class="lift"></div>` +
      `<div class="face">${thumb}<div class="body"><div class="title">${g.title}</div><div class="act">${pills}</div></div>` +
      (g.resumable ? `<div class="ribbon">Continue</div>` : "") + `</div>`;
    track.appendChild(el);
  });
}

function fitTitles() {
  track.querySelectorAll(".card").forEach(card => {
    const t = card.querySelector(".title");
    const base = card.classList.contains("focused") ? P.cardFs : P.sideFs;
    let fs = base;
    t.style.fontSize = fs + "px";
    const max = fs * 0.96 * 2 + 1;
    while (t.scrollHeight > max + 0.5 && fs > base * 0.45) {
      fs -= 1;
      t.style.fontSize = fs + "px";
    }
    card.style.setProperty("--card-fs", fs + "px");
  });
}

function layoutCards() {
  const W = $("#band").clientWidth;
  const f = state.card;
  const half = Math.floor(P.visible / 2);
  const cards = track.children;
  let x = 0;
  for (let i = 0; i < cards.length; i++) {
    const el = cards[i];
    const isF = i === f;
    el.classList.toggle("focused", isF);
    el.classList.toggle("soft", isF && state.zone !== "cards");
    el.classList.toggle("hidden", Math.abs(i - f) > half);
    if (isF) {
      x += P.chev + 14;
      const centre = x + P.focusW / 2;
      x += P.chev + 14;
      track.style.setProperty("--tx", Math.round(W / 2 - centre) + "px");
    }
    x += (isF ? P.focusW : P.sideW) + P.gap;
  }
  fitTitles();
  const chevL = $("#chevL"), chevR = $("#chevR");
  const onCards = state.zone === "cards";
  chevL.classList.toggle("off", !onCards);
  chevR.classList.toggle("off", !onCards);
  chevL.classList.toggle("dim", f === 0);
  chevR.classList.toggle("dim", f === GAMES.length - 1);
}

function buildActions() {
  const g = GAMES[state.card];
  actionsEl.innerHTML = "";
  const here = g.resumable ? "Continue" : "Play";
  const labels = g.places.length === 2
    ? [[here + " here", "here"], ["Play on zao", "zao"]]
    : g.places[0] === "here" ? [[here, "here"]] : [["Play on zao", "zao"]];
  labels.forEach(([label], i) => {
    const b = document.createElement("div");
    b.className = "btn" + (i === state.action ? " lit" : "") + (state.zone === "actions" && i === state.action ? " focus" : "");
    b.innerHTML = `<span class="ring"></span><span>${label}</span>`;
    actionsEl.appendChild(b);
  });
}

function renderTabs() {
  tabsEl.querySelectorAll(".tab").forEach((el, i) => {
    el.classList.toggle("focus", state.zone === "tabs" && i === state.tab);
  });
}

function renderWifi() {
  const bars = Math.max(1, Math.round(WIFI.signal / 25));
  $("#wifi").innerHTML = `<span class="ssid">${WIFI.ssid}</span><span class="bars">${[1,2,3,4].map(n => `<b class="${n <= bars ? "on" : ""}"></b>`).join("")}</span><span>${WIFI.signal}%</span>`;
}

function render() {
  renderTabs();
  layoutCards();
  buildActions();
}

// ---------- input: semantic actions only ----------
function act(a) {
  const n = GAMES.length;
  if (state.zone === "cards") {
    if (a === "left") state.card = Math.max(0, state.card - 1);
    else if (a === "right") state.card = Math.min(n - 1, state.card + 1);
    else if (a === "up") state.zone = "tabs";
    else if (a === "down") { state.zone = "actions"; state.action = 0; }
    else if (a === "confirm") { state.zone = "actions"; state.action = 0; }
    if (a === "left" || a === "right") state.action = 0;
  } else if (state.zone === "tabs") {
    if (a === "left") state.tab = Math.max(0, state.tab - 1);
    else if (a === "right") state.tab = Math.min(TABS.length - 1, state.tab + 1);
    else if (a === "down" || a === "back") state.zone = "cards";
  } else if (state.zone === "actions") {
    const count = GAMES[state.card].places.length;
    if (a === "left") state.action = Math.max(0, state.action - 1);
    else if (a === "right") state.action = Math.min(count - 1, state.action + 1);
    else if (a === "up" || a === "back") state.zone = "cards";
    else if (a === "confirm") {
      const b = actionsEl.children[state.action];
      b.classList.add("pressed"); setTimeout(() => b.classList.remove("pressed"), 140);
    }
  }
  render();
}

const KEYS = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", Enter: "confirm", Backspace: "back", Escape: "back" };
addEventListener("keydown", (e) => { const a = KEYS[e.key]; if (a) { e.preventDefault(); act(a); } });

// ---------- boot ----------
applyPlan();
buildTabs();
buildCards();
renderWifi();
render();
addEventListener("resize", () => { applyPlan(); render(); });
document.fonts && document.fonts.ready.then(() => render());
</script>
</body>
</html>
