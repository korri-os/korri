html,body{margin:0;height:100%;background:var(--void);overflow:hidden}
body{display:flex;align-items:center;justify-content:center}

/* The logical frame: 320x224, integer-zoomed by script to fit the container. */
.screen{
  width:320px;height:224px;position:relative;background:var(--night);color:var(--white);
  font:10px/10px "Ark Pixel",monospace;zoom:1;overflow:hidden;
  -webkit-font-smoothing:none;text-rendering:geometricPrecision;
}
.screen *{box-sizing:border-box}
canvas,img{image-rendering:pixelated}

.panel{position:absolute;border:1px solid var(--lilac);background:var(--navy)}
.band{height:10px;background:var(--indigo);color:var(--ice);display:flex;justify-content:space-between;padding:0 2px}

/* ---- Files list ---- */
#files{left:2px;top:2px;width:170px;height:220px;display:flex;flex-direction:column}
#rows{flex:1;overflow:hidden;position:relative}
.row{display:flex;gap:3px;align-items:flex-start;padding:0 2px;min-height:10px;color:var(--white)}
.row .id{color:var(--lilac);flex:0 0 18px}
.row .t{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.row .sys{flex:0 0 auto;color:var(--cyan);text-align:right}
.row .tag{flex:0 0 auto;background:var(--magenta);color:var(--night);padding:0 1px}
.row.sysrow .id{color:var(--amber)}
.row .ico{flex:0 0 8px;width:8px;height:8px;margin-top:1px}
.row.focus{background:var(--cyan);color:var(--night)}
.row.focus .id,.row.focus .sys{color:var(--night)}
.row.focus .tag{background:var(--night);color:var(--magenta)}
.row.focus .ico{filter:invert(1)}
.rule{height:1px;background:var(--lilac);margin:1px 0}
.hint{color:var(--dim);padding:0 2px;height:10px}
.more{position:absolute;left:0;right:0;bottom:0;height:10px;background:var(--navy);color:var(--dim);text-align:right;padding:0 2px}

/* ---- Dossier ---- */
#dossier{left:176px;top:2px;width:142px;height:106px}
#dossier .body{display:flex;gap:4px;padding:2px}
#portrait{width:66px;height:66px;border:1px solid var(--lilac);background:var(--night);flex:0 0 66px;position:relative}
#portrait canvas{position:absolute;left:0;top:0;width:64px;height:64px}
#portrait .nocov{position:absolute;left:0;top:0;width:64px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dim)}
#meta{flex:1 1 auto;min-width:0}
#meta .title{color:var(--white);white-space:normal;word-break:break-word}
#meta .system{color:var(--cyan)}
#meta .k{color:var(--dim)}
#meta p{margin:0}
#places{padding:0 2px;display:flex;gap:4px;align-items:center;white-space:nowrap}
#places .k{color:var(--dim)}
.place{padding:0 2px;color:var(--lilac)}
.place.sel{background:var(--cyan);color:var(--night)}
.place.sel.alt{background:transparent;color:var(--cyan);outline:1px solid var(--cyan)}

/* ---- Transceiver ---- */
#tx{left:176px;top:112px;width:142px;height:110px;display:flex}
#tx .win{flex:0 0 36px;border-right:1px solid var(--lilac);display:flex;flex-direction:column;align-items:center;padding-top:2px;background:var(--night)}
#tx .win canvas{width:32px;height:32px;border:1px solid var(--violet)}
#tx .win .name{color:var(--amber);margin-top:1px}
#tx .main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
#freq{background:var(--void);border-bottom:1px solid var(--lilac);padding:2px 2px 1px;height:36px}
#freq .clock{font-size:20px;line-height:20px;color:var(--cyan);letter-spacing:1px}
#freq .build{color:var(--lilac);white-space:nowrap}
#msg{flex:1 1 auto;padding:2px;color:var(--white)}
#msg .cur{display:inline-block;width:5px;height:8px;background:var(--white);vertical-align:-1px;animation:blink 1s steps(1) infinite}
#sig{border-top:1px solid var(--lilac);padding:1px 2px;display:flex;flex-wrap:wrap;gap:0 3px;align-items:center;white-space:nowrap}
#sig .ssid{color:var(--cyan);overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 0 100%}
#sig .bars{display:flex;gap:1px;flex:0 0 auto;align-items:flex-end;height:10px}
#sig .bars i{display:block;width:3px;background:var(--indigo)}
#sig .bars i.on{background:var(--green)}
#sig .pct{color:var(--white);flex:0 0 auto}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){#msg .cur{animation:none}}
</style>
</head>

function pad3(n){return String(n).padStart(3,'0')}

function drawIcon(canvas, rows, colors){
  const c = canvas.getContext('2d');
  rows.forEach((r,y)=>{ [...r].forEach((ch,x)=>{ if(ch!=='.'){ c.fillStyle = colors[ch] || colors['#']; c.fillRect(x,y,1,1);} }); });
}
function iconCanvas(name, color){
  const cv = document.createElement('canvas'); cv.width=8; cv.height=8; cv.className='ico';
  drawIcon(cv, ICONS[name], {'#':color});
  return cv;
}

function renderList(){
  const rows = document.getElementById('rows');
  rows.innerHTML = '';
  document.getElementById('count').textContent = (list.length-SYS.length) + ' files';
  list.forEach((e,i)=>{
    const r = document.createElement('div');
    r.className = 'row' + (e.sys?' sysrow':'') + (i===focus?' focus':'');
    r.setAttribute('role','option'); r.setAttribute('aria-selected', i===focus);
    r.tabIndex = i===focus ? 0 : -1;
    if (e.sys){
      r.appendChild(iconCanvas(e.icon, '#ffc040'));
      const id = document.createElement('span'); id.className='id'; id.textContent='SYS'; r.appendChild(id);
      const t = document.createElement('span'); t.className='t'; t.textContent=e.title; r.appendChild(t);
    } else {
      const id = document.createElement('span'); id.className='id'; id.textContent=pad3(e.n); r.appendChild(id);
      const t = document.createElement('span'); t.className='t'; t.textContent=e.title; r.appendChild(t);
      if (e.held){ const tg=document.createElement('span'); tg.className='tag'; tg.textContent='HELD'; r.appendChild(tg); }
      const s = document.createElement('span'); s.className='sys'; s.textContent=e.system; r.appendChild(s);
    }
    rows.appendChild(r);
    if (i===SYS.length-1){ const d=document.createElement('div'); d.className='rule'; rows.appendChild(d); }
  });
  if (list.length === SYS.length){
    const r=document.createElement('div'); r.className='row'; r.style.color='var(--dim)'; r.textContent='No files. Add a game to the catalog.'; rows.appendChild(r);
  }
  // Keep the focused row in view: scroll the rows container so the focus is visible.
  const f = rows.querySelector('.row.focus');
  if (f){
    const top = f.offsetTop, bot = top + f.offsetHeight, h = rows.clientHeight;
    let st = rows.scrollTop;
    if (bot - st > h) st = bot - h; if (top < st) st = top;
    rows.scrollTop = st;
  }
  // Show that more exists below.
  const old = rows.querySelector('.more'); if (old) old.remove();
  if (rows.scrollHeight - rows.scrollTop > rows.clientHeight + 0.5){
    const m=document.createElement('div'); m.className='more'; m.textContent='more'; rows.appendChild(m);
  }
}

function quantise(ctx, w, h){
  const img = ctx.getImageData(0,0,w,h), d = img.data;
  const pal = PAL.map(hex=>[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]);
  for (let i=0;i<d.length;i+=4){
    if (d[i+3] < 128){ d[i]=0x0b; d[i+1]=0x09; d[i+2]=0x20; d[i+3]=255; continue; }
    let best=0, bd=1e9;
    for (let p=0;p<pal.length;p++){
      const dr=d[i]-pal[p][0], dg=d[i+1]-pal[p][1], db=d[i+2]-pal[p][2];
      const dist = dr*dr*0.3 + dg*dg*0.59 + db*db*0.11;
      if (dist<bd){bd=dist;best=p;}
    }
    d[i]=pal[best][0]; d[i+1]=pal[best][1]; d[i+2]=pal[best][2]; d[i+3]=255;
  }
  ctx.putImageData(img,0,0);
}

function renderPortrait(e){
  const box = document.getElementById('portrait'); box.innerHTML='';
  if (e.sys){
    const cv = document.createElement('canvas'); cv.width=64; cv.height=64;
    const c = cv.getContext('2d'); c.fillStyle='#141c56'; c.fillRect(0,0,64,64);
    c.save(); c.scale(6,6); c.translate(1.3,1.3); drawIcon(cv, ICONS[e.icon], {'#':'#ffc040'}); c.restore();
    // scale icon up by drawing 6x blocks
    c.clearRect(0,0,64,64); c.fillStyle='#141c56'; c.fillRect(0,0,64,64);
    ICONS[e.icon].forEach((r,y)=>[...r].forEach((ch,x)=>{ if(ch==='#'){ c.fillStyle='#ffc040'; c.fillRect(8+x*6,8+y*6,6,6);} }));
    box.appendChild(cv); return;
  }
  if (!e.art || !ART[e.art]){
    const d = document.createElement('div'); d.className='nocov';
    const cv = document.createElement('canvas'); cv.width=32; cv.height=32;
    const c = cv.getContext('2d');
    ICONS.file.forEach((r,y)=>[...r].forEach((ch,x)=>{ if(ch==='#'){ c.fillStyle='#9a8cf0'; c.fillRect(x*4,y*4,4,4);} }));
    cv.style.width='32px'; cv.style.height='32px';
    d.appendChild(cv);
    const t = document.createElement('div'); t.textContent='no cover'; t.style.marginTop='4px'; d.appendChild(t);
    box.appendChild(d); return;
  }
  const cv = document.createElement('canvas'); cv.width=64; cv.height=64;
  const c = cv.getContext('2d'); c.imageSmoothingEnabled=false;
  const im = new Image();
  im.onload = ()=>{
    const s = Math.max(64/im.width, 64/im.height);
    const w = Math.round(im.width*s), h = Math.round(im.height*s);
    c.fillStyle='#0b0920'; c.fillRect(0,0,64,64);
    c.drawImage(im, Math.floor((64-w)/2), Math.floor((64-h)/2), w, h);
    quantise(c,64,64);
  };
  im.src = ART[e.art];
  box.appendChild(cv);
}

function renderDossier(){
  const e = list[focus];
  const meta = document.getElementById('meta'); meta.innerHTML='';
  const places = document.getElementById('places'); places.innerHTML='';
  const hint = document.getElementById('dhint');
  if (!e){
    document.getElementById('dhead').textContent='FILE ---';
    document.getElementById('dside').textContent='';
    document.getElementById('portrait').innerHTML='';
    meta.innerHTML='<p class="k">Nothing selected.</p>';
    hint.textContent=''; say('No file in focus.'); return;
  }
  renderPortrait(e);
  if (e.sys){
    document.getElementById('dhead').textContent='SYS';
    document.getElementById('dside').textContent=e.title.toUpperCase();
    const lines = {
      Settings:['<p class="title">Settings</p><p class="system">Device</p><p></p><p class="k">Name mini</p><p class="k">Sleep 10 min</p><p class="k">Bright 70%</p>'],
      Network:['<p class="title">Network</p><p class="system">Wi-Fi</p><p></p><p class="k">Connected</p><p class="k">hummingbird-</p><p class="k">lake 72%</p>'],
      Identity:['<p class="title">Identity</p><p class="system">One person</p><p></p><p class="k">Backup ready</p><p class="k">No retired</p><p class="k">keys</p>'],
    };
    meta.innerHTML = lines[e.title][0];
    places.innerHTML = '<span class="k">A opens.</span>';
    hint.textContent = '';
    say({Settings:'Sys file. Device, sleep, brightness.', Network:'Sys file. Connected to hummingbird-lake.', Identity:'Sys file. One person. Backup available.'}[e.title]);
    return;
  }
  document.getElementById('dhead').textContent='FILE '+pad3(e.n);
  document.getElementById('dside').textContent=e.held?'HELD':'';
  meta.innerHTML = `<p class="title">${e.title}</p><p class="system">${e.system}</p><p></p><p class="k">Last opened</p><p>${e.last==='Never'?'never':e.last}</p><p>${e.plays} ${e.plays===1?'play':'plays'}</p>`;
  const k = document.createElement('span'); k.className='k'; k.textContent='PLAY ON:'; places.appendChild(k);
  e.places.forEach((p,i)=>{
    const s=document.createElement('span'); s.className='place'+(i===placeSel?' sel':''); s.textContent = p==='This device'?'THIS DEVICE':p; places.appendChild(s);
  });
  hint.textContent = e.places.length>1 ? 'L/R picks place. A plays.' : 'A plays.';
  const where = e.places.length>1 ? 'Plays here, or on zao.' : (e.places[0]==='zao' ? 'Plays on zao.' : 'Plays here.');
  const held = e.held ? ' Session held.' : '';
  say(`File ${pad3(e.n)}. Last opened ${e.last==='Never'?'never':e.last.toLowerCase()}.${held} ${where}`);
}

function say(text){
  const m = document.getElementById('msg');
  m.innerHTML=''; m.appendChild(document.createTextNode(text+' '));
  const c=document.createElement('span'); c.className='cur'; m.appendChild(c);
}

function renderSignal(){
  const b = document.getElementById('bars'); b.innerHTML='';
  const lit = Math.round(0.72*8);
  for (let i=0;i<8;i++){ const s=document.createElement('i'); s.style.height=(2+i)+'px'; if(i<lit) s.className='on'; b.appendChild(s); }
}

function renderOperator(){
  drawIcon(document.getElementById('opcanvas'), OPER, {'#':'#9a8cf0','c':'#40e8ff','m':'#f4f4ff','a':'#ff40d8'});
}

function render(){ renderList(); renderDossier(); }

function fit(){
  const z = Math.max(1, Math.floor(Math.min(innerWidth/320, innerHeight/224)));
  document.getElementById('screen').style.zoom = z;
}
addEventListener('resize', fit);

addEventListener('keydown', ev=>{
  const e = list[focus];
  if (ev.key==='ArrowDown'){ focus=Math.min(list.length-1,focus+1); placeSel=0; render(); ev.preventDefault(); }
  else if (ev.key==='ArrowUp'){ focus=Math.max(0,focus-1); placeSel=0; render(); ev.preventDefault(); }
  else if (ev.key==='ArrowRight' && e && e.places && e.places.length>1){ placeSel=Math.min(e.places.length-1,placeSel+1); renderDossier(); }
  else if (ev.key==='ArrowLeft' && e && e.places && e.places.length>1){ placeSel=Math.max(0,placeSel-1); renderDossier(); }
  else if (ev.key==='Enter'){ if(e&&!e.sys) say(`Opening file ${pad3(e.n)} on ${e.places[placeSel]==='This device'?'this device':e.places[placeSel]}.`); }
});

document.fonts.ready.then(()=>{ fit(); render(); renderSignal(); renderOperator(); });
</script>
</body>
</html>
