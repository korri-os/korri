:root{
  --k:#000000; --w:#FCFCFC; --a:#D800CC; --g:#7C7C7C; --s:#58D854;
  --b1:#0058F8; --b2:#3CBCFC; --t:#008888; --o:#F87800; --p:#F85898; --n:#00A800;
  --f1:#F8D8A8; --f2:#E09060; --f3:#A05030; --d:#0000A8;
}
html,body{margin:0;height:100%;background:var(--k);overflow:hidden}
body{font-family:"PO8",monospace;font-size:8px;line-height:8px;letter-spacing:-1px;color:var(--w);
  -webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeSpeed}
#stage{position:fixed;inset:0;background:var(--k)}
#fc{position:absolute;left:0;top:0;width:256px;height:224px;background:var(--k);transform-origin:0 0;overflow:hidden}
#fc *{box-sizing:border-box}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
/* Famicom Detective Club double border: 1 white, 1 black, 1 white; square corners */
.win{position:absolute;border:1px solid var(--w);background:var(--k)}
.win::before{content:"";position:absolute;inset:1px;border:1px solid var(--w);pointer-events:none}
.in{position:absolute;left:2px;top:2px;overflow:hidden} /* 2px from the padding box = 3px from the outer edge */
/* tag boxes overlapping a window border, Megami Tensei "8F N" manner */
.tag{position:absolute;border:1px solid var(--w);background:var(--k);height:12px;padding:1px 2px;white-space:nowrap;z-index:3}
.tag span{position:relative;top:0}
/* PO8 at 8px: caps on rows 0..6 of the 8px line box, descender on row 7; no vertical shift needed */
button{all:unset;display:block;cursor:default}
button:focus{outline:none}
.row{position:relative;height:8px;width:106px;white-space:nowrap;color:var(--w)}
.row .t{position:absolute;left:6px;top:0}
.row .tail,#tabname .tail{color:var(--g)}
.row.sys .t{color:var(--w)}
.row .held{position:absolute;right:1px;top:1px}
.sep{position:relative;height:8px;width:106px;color:var(--w);white-space:nowrap}
.sep span{position:absolute;left:6px;top:0}
.pix{position:absolute;width:1px;height:1px;background:currentColor}
.cur{left:0;top:0}
.c-on{color:var(--a)}
.c-off{color:var(--g)}
.c-hid{display:none}
#list{position:absolute;left:0;top:0;width:106px}
.mask{position:absolute;left:0;width:106px;height:4px;background:var(--k);display:none}
#maskT{top:0}#maskB{bottom:0}
/* message box */
#msgin{left:2px;top:2px;width:242px;height:34px}
#speaker{position:absolute;left:2px;top:0;color:var(--s);white-space:nowrap}
#say{position:absolute;left:37px;top:0;width:195px;height:24px;overflow:hidden;overflow-wrap:anywhere;word-break:break-word}
#say.wide{left:2px;width:230px}
#cont{position:absolute;right:9px;bottom:3px;color:var(--w)}
#cont.block{right:7px;bottom:4px}
/* places table */
#tabin{left:2px;top:2px;width:242px;height:26px}
.tr{position:absolute;left:0;height:8px;width:242px;white-space:nowrap}
.tr .c0{position:absolute;left:0;top:0}
.tr .c1{position:absolute;left:7px;top:0}
.tr .c2{position:absolute;left:76px;top:0}
.tr.head{color:var(--g)}
.tr.dim{color:var(--g)}
#build{position:absolute;right:1px;top:0}
/* status block inside the portrait window */
#block{position:absolute;left:0;top:0;width:128px;height:128px;display:none}
#block.on{display:block}
.bl{position:absolute;left:0;height:8px;width:128px;white-space:nowrap}
.bl .lab{position:absolute;left:8px;top:0}
.bl .val{position:absolute;right:2px;top:0;text-align:right}
.bl .bar{position:absolute;left:8px;top:0;height:6px}
.bl .bar i{position:absolute;top:0;width:4px;height:6px;background:var(--s)}
.bl .bar i.off{background:var(--g);width:4px;height:2px;top:4px}
.bl .bul{left:1px;top:0}
.bl .bul.g-tri{top:0}
.bl.dimrow{color:var(--g)}
.bl.dimrow .bul{color:var(--g)}
/* idle motion, steps() only */
@keyframes blink{0%{visibility:visible}50%{visibility:hidden}100%{visibility:hidden}}
@keyframes nudge{0%{transform:none}92%{transform:none}93%{transform:translateX(1px)}100%{transform:translateX(1px)}}
#cont{animation:blink 1s steps(1,end) infinite}
.pix.cur.c-on.live{animation:nudge 2s steps(1,end) infinite}
@media (prefers-reduced-motion:reduce){#cont,.pix.cur{animation:none !important}}
#note{position:fixed;left:0;bottom:0;color:#444;font-size:12px;line-height:14px;letter-spacing:0;display:none}
</style>
</head>

  if(g.say) return g.say;
  const out=[g.t+'.'];

function inHead(x,y){ // head oval + neck + shoulders, in a 128x112 field
  const ex=(x-64)/27, ey=(y-46)/34; if(ex*ex+ey*ey<=1) return 1;

function drawNoise(){
  cctx.fillStyle=PAL.k; cctx.fillRect(0,0,128,128);
  const id=cctx.createImageData(128,128), d=id.data; const k=hex2(PAL.k),d1=hex2(PAL.d),b1=hex2(PAL.b1),b2=hex2(PAL.b2),w=hex2(PAL.w);

    blockEl.appendChild(el); y+=8;
    if(row.bar!==undefined){ const b=document.createElement('div'); b.className='bl'; b.style.top=y+'px'; const bar=document.createElement('span'); bar.className='bar';
      for(let i=0;i<10;i++){ const seg=document.createElement('i'); seg.style.left=(i*5)+'px'; if(i>=row.bar) seg.className='off'; bar.appendChild(seg); } b.appendChild(bar); blockEl.appendChild(b); y+=8; }
  });
  blockEl.dataset.rows=r;
}

// ---------- input: semantic actions ----------
function step(i,dir){ // move through list lines, skipping the separator at index N()
  const total=LINES(); let j=i+dir; if(j===N()) j+=dir; if(j<0) j=0; if(j>=total) j=total-1; if(j===N()) j=i; return j;
}
function act(a){
  if(S.launch){ if(a==='back'){S.launch=null; render();} return; }
  const g=focused();
  if(S.region==='list'){
    if(a==='up') S.focus=step(S.focus,-1);
    else if(a==='down') S.focus=step(S.focus,1);
    else if(a==='right'){ if(g&&g.places.length>1){S.region='places';} else if(isSys(S.focus)){ openSection(); } }
    else if(a==='confirm'){ if(isSys(S.focus)) openSection(); else if(g&&g.places.length===1) launch(g,0); else if(g) S.region='places'; }
    else if(a==='options'||a==='menu'){ S.focus=N()+1; }
    if(!isSys(S.focus)||S.region==='list') S.place=0;
  } else if(S.region==='places'){
    if(a==='up'||a==='left'&&false) S.place=Math.max(0,S.place-1);
    else if(a==='down') S.place=Math.min(g.places.length-1,S.place+1);
    else if(a==='right') S.place=Math.min(g.places.length-1,S.place+1);
    else if(a==='left'||a==='back') S.region='list';
    else if(a==='confirm') launch(g,S.place);
  } else if(S.region==='section'){
    const n=+blockEl.dataset.rows||0;
    if(a==='up') S.srow=Math.max(0,S.srow-1);
    else if(a==='down') S.srow=Math.min(n-1,S.srow+1);
    else if(a==='back'||a==='left'){ S.region='list'; S.section=null; }
  }
  render();
}
function openSection(){ S.section=sysOf(S.focus).key; S.region='section'; S.srow=0; }
function launch(g,k){ S.launch={title:g.t,place:g.places[k]}; }
const KEYS={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'confirm',Escape:'back',o:'options',m:'menu',Backspace:'back'};
addEventListener('keydown',e=>{ const a=KEYS[e.key]; if(!a) return; e.preventDefault(); act(a); });
// pointer/tab focus moving onto a row moves the cursor there too
document.addEventListener('focusin',e=>{ const el=e.target; if(el.classList&&el.classList.contains('row')){ const i=+el.dataset.i; if(i!==S.focus||S.region!=='list'){S.focus=i; S.region='list'; S.place=0; render();} }
  else if(el.classList&&el.classList.contains('tr')&&el.dataset.k!==undefined){ const k=+el.dataset.k; if(k!==S.place||S.region!=='places'){S.place=k; S.region='places'; render();} } });
listEl.addEventListener('click',e=>{ const b=e.target.closest('.row'); if(b){ act('confirm'); } });

// ---------- static chrome ----------
(function(){ const sig=$('sig'); for(let i=0;i<4;i++){ const b=document.createElement('i'); b.style.cssText='position:absolute;top:3px;left:'+(2+i*4)+'px;width:3px;height:5px;background:'+(i<3?PAL.s:PAL.g); sig.appendChild(b);} 
  const bc=tinyCanvas('korri 0.4.1 9a1fb22',PAL.g); const build=$('build'); build.width=bc.width; build.height=5; build.getContext('2d').drawImage(bc,0,0); })();

document.fonts.load('8px PO8').then(async()=>{ buildList(); render(); await (coverReady||Promise.resolve()); window.__ready=true; });
</script>
