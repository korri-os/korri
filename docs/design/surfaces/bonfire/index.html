:root {
  --pitch: #060504;   /* the ground */
  --soot: #100d0a;    /* panels */
  --iron: #2a241b;    /* quiet rules */
  --bone: #ddd4be;    /* words */
  --ash: #968c74;     /* quiet words */
  --tarnish: #b89a5c; /* ornament and titles */
  --ember: #e0782e;   /* the chosen row, the one action */
  --blood: #c9563f;   /* what went wrong */
  --u: clamp(13px, 0.55vw + 0.9vh + 5px, 22px); /* one unit of type, from both axes */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--pitch); }
body {
  min-height: 100vh; color: var(--bone);
  font: 400 var(--u)/1.45 "EB Garamond", "Garamond", serif;
  font-feature-settings: "kern", "liga", "onum";

}

.edge .tl { top: 0; left: 0; } .edge .tr { top: 0; right: 0; transform: scaleX(-1); }
.edge .bl { bottom: 0; left: 0; transform: scaleY(-1); } .edge .br { bottom: 0; right: 0; transform: scale(-1); }
[data-chrome="lean"] .edge { inset: 3px; }
[data-chrome="lean"] .edge::before { inset: 0; box-shadow: none; }
[data-chrome="lean"] .edge i { display: none; }

/* ---------- the head ---------- */
.head { display: flex; align-items: center; gap: var(--u); padding: 0 calc(var(--u) * var(--clear)) calc(var(--u) * var(--headroom)); }
.head h1 { font-weight: 400; font-size: calc(var(--u) * 2); line-height: 1; letter-spacing: .12em; font-variant-caps: small-caps; color: #d8bc7c;
  text-shadow: 0 1px 0 #000, 0 0 calc(var(--u) * 1.4) rgba(224,120,46,.3); white-space: nowrap; }
.head .rule { flex: 1; height: 1px; min-width: 1ch; background: linear-gradient(90deg, transparent, var(--tarnish)); opacity: .85; position: relative; }
.head .rule:not(.left) { background: linear-gradient(90deg, var(--tarnish), rgba(184,154,92,.2)); }
.head .rule::after { content: ""; position: absolute; top: 50%; right: 0; width: .42em; height: .42em; background: var(--tarnish); transform: translate(50%, -50%) rotate(45deg); box-shadow: 0 0 0 2px var(--pitch), 0 0 0 3px rgba(184,154,92,.5); }
.head .rule:not(.left)::after { right: auto; left: 0; transform: translate(-50%, -50%) rotate(45deg); }
.head .tally { color: var(--ash); white-space: nowrap; font-style: italic; }
[data-chrome="lean"] .head h1 { font-size: calc(var(--u) * 1.45); }
[data-chrome="lean"] .head { padding-bottom: calc(var(--u) * .45); }
[data-structure="stack"] .head .rule.left { display: none; }

/* ---------- the body ---------- */
.body { flex: 1; display: grid; gap: calc(var(--u) * 1.8); align-items: start; }
[data-structure="split"] .body { grid-template-columns: minmax(15em, 5fr) 8fr; }
[data-structure="stack"] .body { grid-template-columns: 1fr; gap: 0; }

/* the list: one row per device */
.list { list-style: none; }
.row { display: grid; grid-template-columns: .7em 1fr auto; column-gap: .9em; align-items: center; width: 100%; padding: .5em 1em .5em .9em; position: relative;
  border-bottom: 1px solid rgba(42,36,27,.95); background: linear-gradient(90deg, rgba(16,13,10,.55), rgba(16,13,10,0)); }
.row .name { font-size: 1.18em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .word { color: var(--ash); white-space: nowrap; font-style: italic; }
.row[data-state="failed"] .word { color: var(--blood); }
.row[data-state="failed"] .name, .row[data-state="loading"] .name { color: var(--ash); }
/* the stone beside a name: bright when the device answers, hollow while Korri looks, dark when it does not */
.stone { width: .62em; height: .62em; transform: rotate(45deg); border: 1px solid rgba(184,154,92,.85); background: #0a0806; }
[data-state="ready"] > .stone { border-color: #ffd9a0; background: radial-gradient(circle at 35% 30%, #fff1cf, #f0a24b 45%, #a8501a 100%); box-shadow: 0 0 .7em rgba(224,120,46,.85); }
[data-state="failed"] > .stone { border-color: #5a4f3c; background: #15110c; }
.row[aria-current="true"] { border-bottom-color: transparent;
  background:
    linear-gradient(90deg, rgba(255,214,150,.9), rgba(184,154,92,.5) 45%, transparent) top / 100% 1px no-repeat,
    linear-gradient(90deg, rgba(255,214,150,.9), rgba(184,154,92,.5) 45%, transparent) bottom / 100% 1px no-repeat,
    linear-gradient(90deg, rgba(224,120,46,.42), rgba(160,74,22,.2) 50%, rgba(160,74,22,0) 96%);
  box-shadow: 0 0 calc(var(--u) * 1.6) rgba(224,120,46,.14); }
.row[aria-current="true"] .name { color: #fff4de; text-shadow: 0 0 .8em rgba(224,120,46,.75); }
.row[aria-current="true"] .word { color: var(--bone); }

/* the item: one device, as a menu shows one thing you carry */
.item { position: relative; padding: calc(var(--u) * 1.6);
  background:
    linear-gradient(180deg, rgba(255,230,180,.045), transparent 22%),
    linear-gradient(180deg, rgba(20,16,12,.9), rgba(8,7,5,.86));
  border: 1px solid rgba(184,154,92,.5);
  box-shadow: inset 0 0 0 3px rgba(6,5,4,.9), inset 0 0 0 4px rgba(184,154,92,.2), inset 0 0 calc(var(--u) * 4) rgba(0,0,0,.7), 0 calc(var(--u) * 1.2) calc(var(--u) * 3.5) rgba(0,0,0,.75);
  backdrop-filter: blur(3px); }
[data-structure="split"] .item { position: sticky; top: calc(var(--u) * var(--pad)); }
[data-structure="stack"] .item { margin: .6em 0 1.1em; padding: calc(var(--u) * 1); }
.plate { display: grid; gap: calc(var(--u) * 1.6); align-items: center; }
[data-plate="beside"] .plate { grid-template-columns: minmax(8em, 5fr) 7fr; }
[data-plate="above"] .plate { grid-template-columns: 1fr; }
[data-plate="none"] .niche { display: none; }
/* the niche the thing sits in: a recess, lit from below right */
.niche { position: relative; aspect-ratio: 5 / 4; max-height: 36vh; width: 100%; margin: 0 auto; display: grid; place-items: center;
  background: radial-gradient(60% 55% at 55% 62%, rgba(224,120,46,.3), rgba(224,120,46,.06) 55%, transparent 75%), linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.2));
  border: 1px solid rgba(184,154,92,.28); box-shadow: inset 0 0 calc(var(--u) * 2.5) #000; }
[data-plate="above"] .niche { max-height: 26vh; }
.niche img { max-width: 80%; max-height: 84%; object-fit: contain; filter: brightness(1.9) contrast(1.08) saturate(1.15) drop-shadow(0 .8em .9em rgba(0,0,0,.9)); }
[data-state="loading"] .niche img { filter: brightness(.8) saturate(.6) drop-shadow(0 .8em .9em rgba(0,0,0,.9)); }
[data-state="failed"] .niche { background: linear-gradient(180deg, rgba(0,0,0,.6), rgba(0,0,0,.3)); }
[data-state="failed"] .niche img { filter: grayscale(1) brightness(.55); }
.who h2 { font-weight: 400; font-size: calc(var(--u) * 2.3); line-height: 1.05; letter-spacing: .02em; color: #fff4de; overflow-wrap: anywhere; text-shadow: 0 1px 0 #000; }
.who .kind { color: var(--tarnish); font-style: italic; margin-top: .15em; }
.facts { margin-top: calc(var(--u) * .9); }
.facts div { display: flex; justify-content: space-between; gap: 1.2em; padding: .22em 0; border-bottom: 1px solid var(--iron); }
.facts dt { color: var(--ash); white-space: nowrap; }
.facts dd { text-align: right; font-variant-numeric: tabular-nums lining-nums; overflow-wrap: anywhere; }
.facts dd.bad { color: var(--blood); }
.facts dd.warm { color: #f0a24b; }
.lore { margin-top: calc(var(--u) * 1.3); padding-top: calc(var(--u) * 1.1); position: relative; max-width: 62ch; }
.lore::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, var(--tarnish), rgba(184,154,92,.15) 70%, transparent); }
.lore p { font-style: italic; color: #c8bea5; }
.lore p + p { margin-top: .5em; font-style: normal; color: var(--bone); }
.acts { margin-top: calc(var(--u) * 1.3); display: flex; flex-wrap: wrap; gap: .8em; }
[data-acts="first"] .acts { margin: calc(var(--u) * .7) 0 0; }
[data-acts="first"][data-structure="split"] .who { display: grid; grid-template-columns: 1fr auto; column-gap: 1.5em; align-items: center; }
[data-acts="first"][data-structure="split"] .who .acts { grid-column: 2; grid-row: 1 / span 2; margin: 0; }
[data-acts="first"][data-structure="split"] .who .facts { grid-column: 1 / -1; }
[data-acts="first"] .who h2 { font-size: calc(var(--u) * 1.7); }
[data-acts="first"] .item { padding: calc(var(--u) * .9); }
/* the one action: worked metal, warm from within */
.act { position: relative; min-height: 46px; flex: 0 1 22em; text-align: center; padding: .55em 2.2em .6em; font-size: 1.12em; letter-spacing: .05em; color: #fff0d2;
  text-shadow: 0 1px 1px rgba(0,0,0,.85);
  border: 1px solid #e3bf7c;
  background: linear-gradient(180deg, rgba(255,226,170,.28), rgba(255,226,170,0) 42%), linear-gradient(180deg, #b55c1e, #7d3610 60%, #5a260b);
  box-shadow: inset 0 0 0 2px rgba(6,5,4,.55), inset 0 0 0 3px rgba(255,214,150,.3), 0 0 calc(var(--u) * 1.6) rgba(224,120,46,.4), 0 .3em .8em rgba(0,0,0,.7); }
.act::before, .act::after { content: ""; position: absolute; top: 50%; width: .4em; height: .4em; background: #f3d59a; transform: translateY(-50%) rotate(45deg); box-shadow: 0 0 .5em rgba(255,200,120,.9); }
.act::before { left: .9em; } .act::after { right: .9em; }

/* ---------- the foot ---------- */
.foot { position: sticky; bottom: 0; z-index: 3; margin: calc(var(--u) * 1.2) calc(var(--u) * var(--pad) * -1) 0;
  padding: .55em calc(var(--u) * (var(--pad) + var(--clear))) calc(.55em + var(--u) * .9);
  background: linear-gradient(180deg, rgba(6,5,4,.97), var(--pitch)); border-top: 1px solid rgba(184,154,92,.28);
  display: flex; align-items: center; justify-content: space-between; gap: .3em 1.6em; }
.foot .help { color: var(--ash); font-style: italic; flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
[data-structure="stack"] .foot .help { display: none; }
.keys { display: flex; flex: none; gap: .2em 1.3em; list-style: none; margin-left: auto; }
.keys button { display: flex; align-items: center; gap: .5em; min-height: 44px; }
.keys kbd { font: inherit; font-size: .78em; line-height: 1; min-width: 2em; text-align: center; padding: .34em .5em .38em; color: #e6cd92;
  border: 1px solid rgba(184,154,92,.75); border-radius: 999px; background: linear-gradient(180deg, rgba(255,230,180,.12), rgba(0,0,0,.35)); box-shadow: inset 0 1px 0 rgba(255,230,180,.2), 0 1px 2px #000; }
[data-chrome="lean"] .keys button { min-height: 36px; }

/* ---------- the event line ---------- */
.event { position: fixed; inset: 0; display: none; place-items: center; pointer-events: none; z-index: 5; }
[data-banner="on"] .event { display: grid; }
.event div { width: 100%; padding: calc(var(--u) * 1.2) 1em calc(var(--u) * 1.4); text-align: center;
  background: linear-gradient(90deg, transparent, rgba(0,0,0,.92) 22%, rgba(0,0,0,.92) 78%, transparent);
  border-block: 1px solid transparent; border-image: linear-gradient(90deg, transparent, rgba(184,154,92,.85) 30%, rgba(184,154,92,.85) 70%, transparent) 1; }
.event strong { display: block; font-weight: 400; font-size: clamp(1.6em, 5vw, 4em); line-height: 1.05; letter-spacing: .16em; font-variant-caps: small-caps; color: #ffd08a;
  text-shadow: 0 0 .5em rgba(224,120,46,.8), 0 0 1.4em rgba(224,120,46,.35); }
.event span { color: var(--bone); font-style: italic; }
[data-banner="on"] .frame { filter: brightness(.5) saturate(.8); }
</style>
</head>
<body>
<div class="hall" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="edge" aria-hidden="true"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>

<main class="frame" id="frame">
  <header class="head">
    <span class="rule left" aria-hidden="true"></span>
    <h1>Devices</h1>
    <span class="rule" aria-hidden="true"></span>
    <p class="tally" id="tally"></p>
  </header>
  <div class="body">
    <ul class="list" id="list" aria-label="Devices"></ul>
  </div>
  <footer class="foot">
    <p class="help" id="help"></p>
    <ul class="keys" aria-label="Keys">
      <li><button><kbd>↑↓</kbd>Choose</button></li>
      <li><button><kbd>↵</kbd>Confirm</button></li>
      <li><button><kbd>Esc</kbd>Back</button></li>
    </ul>
  </footer>
</main>

<div class="event" role="status"><div><strong>Device Joined</strong><span id="eventline"></span></div></div>
