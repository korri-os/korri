:root {
  --pitch: #070605;   /* the ground */
  --soot: #13100c;    /* panels */
  --iron: #2b251c;    /* quiet rules */
  --bone: #dcd3bd;    /* words */
  --ash: #91876f;     /* quiet words */
  --tarnish: #b59555; /* ornament and titles */
  --ember: #ec7a2b;   /* focus, a lit fire, the one action */
  --cold: #66707a;    /* a fire that is out */
  --blood: #c4523e;   /* what went wrong */
  --u: clamp(13px, 0.55vw + 0.9vh + 5px, 22px); /* one unit of type, from both axes */
  --gap: calc(var(--u) * 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--pitch); }
body {

function render() {
  const p = plan(innerWidth, innerHeight);
  Object.assign(document.documentElement.dataset, p);
  document.documentElement.dataset.banner = q.get("banner") === "on" ? "on" : "off";
  fires.textContent = ""; document.querySelector(".body > .detail")?.remove();
  devices.forEach((d, i) => {
    const li = el("li"), row = el("button", "fire");
    row.dataset.state = d.state; if (i === sel) row.setAttribute("aria-current", "true");
    row.innerHTML = MARK;
    row.append(el("span", "name", d.label), el("span", "word", d.here ? "You are here" : WORD[d.state]));
    row.title = d.label; row.onclick = () => { sel = i; render(); };
    li.append(row); if (i === sel && p.structure === "stack") li.append(detail(d, p));
    fires.append(li);
  });
  if (p.structure === "split") document.querySelector(".body").append(detail(devices[sel], p));
  const lit = devices.filter(d => d.state === "ready").length;
  document.getElementById("tally").textContent = devices.length === 1 ? "One fire, and it is yours" : lit + " of " + devices.length + " lit";
  const d = devices[sel];
  document.getElementById("help").textContent = d.here ? "This is the device you opened. Its actions are below its name." : d.state === "failed" ? "This device did not answer when Korri last looked." : "Another device of your federation. You can look, not act.";
  document.getElementById("eventline").textContent = "Retroid Pocket Mini has joined your federation";
}
addEventListener("resize", render);
addEventListener("keydown", e => { const s = { ArrowDown: 1, ArrowUp: -1 }[e.key]; if (s) { sel = (sel + s + devices.length) % devices.length; render(); document.querySelector('.fire[aria-current]').scrollIntoView({ block: "nearest" }); e.preventDefault(); } });
render();
</script>
</body>
</html>
