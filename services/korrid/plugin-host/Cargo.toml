[package]
name = "korri-plugin-host"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
ring = "0.17"
tempfile = "3"
xz2 = "0.1"
hex = "0.4"
libc = "0.2"
oxc = { version = "0.142.0", features = ["transformer", "codegen", "semantic"] }
rquickjs = { version = "0.9", features = ["loader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
url = "2.5.8"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }

[[bin]]
name = "korri-plugin"
path = "src/main.rs"

[[bin]]
name = "korri-publish"
path = "src/publish_main.rs"
