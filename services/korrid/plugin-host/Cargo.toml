[package]
name = "korri-plugin-host"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
hex = "0.4"
libc = "0.2"
oxc = { version = "0.142.0", features = ["transformer", "codegen", "semantic"] }
rquickjs = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "korri-plugin"
path = "src/main.rs"
