    releases:
      - id: release
        system: gba
        identity: {kind: hash, value: 'sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'}
        argsAppend: [--release]
