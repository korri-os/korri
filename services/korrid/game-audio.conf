# One launch's Pulse server. The host substitutes only its validated launch id.
# Each client and every stream belongs to that launch, regardless of the device
# name or properties the client supplies. No stream can move or fall back.
context.properties = {
    remote.name = "/run/korri-game-audio-pipewire"
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { rtportal.enabled = false } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-protocol-pulse }
]
pulse.properties = {
    server.address = [ { address = "unix:/run/korri-game-audio-@LAUNCH_ID@/native" client.access = "restricted" } ]
    pulse.allow-module-loading = false
}
pulse.rules = [
    {
        # Present or absent: an empty match object does not match in PipeWire.
        matches = [ { client.api = !null } { client.api = null } ]
        actions = {
            update-props = {
                pipewire.client.access = "restricted"
                korri.launch.id = "@LAUNCH_ID@"
            }
            quirks = [ block-record-stream block-sink-volume block-source-volume ]
        }
    }
]
stream.rules = [
    {
        matches = [ { client.api = !null } { client.api = null } ]
        actions = {
            update-props = {
                target.object = "korri-game-@LAUNCH_ID@"
                node.dont-reconnect = true
                node.dont-fallback = true
                korri.launch.id = "@LAUNCH_ID@"
            }
        }
    }
]
