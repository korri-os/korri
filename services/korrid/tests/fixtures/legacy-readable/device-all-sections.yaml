# Grounded in legacy 0e4cec9d product/platform/library/config/fixtures/*.yaml
# and records/*.test.ts conformance values.
host:
  title: Hooks fixture host

storage:
  "@korri:steam/steam":
    root: /var/lib/korri/steam
  roms:
    root: /roms

providers:
  "@korri:steam":
    title: steam
  "@korri:roms":
    title: roms

systems:
  steam:
    name: Steam
  gba:
    name: Game Boy Advance

launchers:
  "@korri:steam/steam":
    plugin: "@korri:steam"
    command: steam
    systems: [steam]
    runtime: proton-arm64
    settings:
      plugin:
        state:
          root: "{storage:@korri:steam/steam}"
        launch-options: "gamescope --fullscreen -- %command%"
  "@korri:retroarch/retroarch":
    plugin: "@korri:retroarch"
    command: retroarch
    settings:
      plugin:
        configFile:
          mode: generated
        core:
          path: "{runtime.path}"
        content:
          path: "{content.path}"

runtimes:
  proton-arm64:
    kind: tool
    title: Proton ARM64
    path: /var/lib/korri/steam/compatibilitytools.d/proton-arm64
    tool: proton-arm64
  mgba:
    kind: libretro-core
    app: "@korri:retroarch/retroarch"
    path: /run/current-system/sw/lib/libretro/mgba_libretro.so
    supports:
      systems: [gba]

profiles:
  handheld:
    title: Handheld
    app: "@korri:retroarch/retroarch"
    runtime: mgba
    env:
      SCALE: profile

hooks:
  battery-saver:
    before:
      - name: cap-clocks
        run: |
          echo 1171200 | sudo -n tee /sys/devices/system/cpu/cpufreq/policy3/scaling_max_freq
          echo 220000000 | sudo -n tee /sys/class/devfreq/gpu/max_freq
        on-failure: warn
    after:
      - name: restore-clocks
        run: echo 2803200 | sudo -n tee /sys/devices/system/cpu/cpufreq/policy3/scaling_max_freq
