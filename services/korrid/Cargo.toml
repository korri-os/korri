[package]
name = "korrid"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "korrid"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
crc32fast = "1"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
hyper = { version = "1", features = ["client", "server", "http1"] }
http-body-util = "0.1"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server", "tls-ring"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
socket2 = "0.6"
subtle = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
netlink-packet-core = "0.9"
netlink-packet-route = "0.33"
netlink-sys = "0.9"
korri-input-contract = { path = "../../contracts/input" }
# Tungstenite logs complete messages/close frames at trace/debug. A browser
# capability must stay private even when an embedding host enables trace logs.
# Cost: log-facade debug/trace diagnostics are unavailable across this build.
log = { version = "0.4", features = ["max_level_info", "release_max_level_info"] }
nostr = { version = "0.45.4", default-features = false, features = ["std", "os-rng", "nip44", "nip49", "nip59"] }
serde = { version = "1", features = ["derive"] }
# Declared release order (ADR 0013) depends on insertion order. toon-format
# already enables this feature; naming it keeps the dependency explicit.
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
serde_yaml = "0.9"
sha2 = "0.10"
sha1 = "0.10"
regex = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "0.8"
url = "2.5"
tower-http = { version = "0.6", features = ["cors"] }
typeshare = "1"
zeroize = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
# ADR 0030: korrid's own pure-Rust archive readers for store downloads, run in
# the sandbox unit. No encryption, no writing, no C code (zstd stays off).
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["bzip2", "ppmd"] }
rars = { version = "0.11.0", default-features = false }

rquickjs = { version = "0.14", features = ["macro", "bindgen", "loader", "allocator"] }
oxc = { version = "0.142.0", features = ["transformer", "codegen", "semantic"] }
proseql-engine = { path = ".cache/proseql/crates/proseql-engine" }
proseql-formats = { path = ".cache/proseql/crates/proseql-formats" }
proseql-storage = { path = ".cache/proseql/crates/proseql-storage" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# iroh's Android TLS verifier uses JNI 0.22. Keep the restored edge on 0.21;
# only its initialization crosses into the verifier's JNI runtime.
jni-runtime = { package = "jni", version = "0.22" }
rustls-platform-verifier = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
korri-inputd = { path = "../inputd" }
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }
secp256k1 = { version = "0.30", features = ["global-context"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# Tests build small 7z and rar fixtures in code, including encrypted ones.
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["compress", "aes256"] }
rars = { version = "0.11.0", default-features = false, features = ["write", "encryption"] }

# Match the embedded interpreter's release optimization in budgeted VM tests.
# Keep the Rust tests debuggable and leave the sandbox limits unchanged.
[profile.dev.package.rquickjs-sys]
opt-level = 3
