[package]
name = "korrid"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "korrid"
path = "src/main.rs"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std"] }
crc32fast = "1"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
nostr = { version = "0.45.4", default-features = false, features = ["std", "os-rng", "nip44", "nip59"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "0.8"
url = "2.5"
tower-http = { version = "0.6", features = ["cors"] }
typeshare = "1"
zeroize = "1"

rquickjs = { version = "0.9", features = ["macro", "bindgen"] }
oxc = { version = "0.142.0", features = ["transformer", "codegen", "semantic"] }
proseql-engine = { path = ".cache/proseql/crates/proseql-engine" }
proseql-formats = { path = ".cache/proseql/crates/proseql-formats" }
proseql-storage = { path = ".cache/proseql/crates/proseql-storage" }

[dev-dependencies]
secp256k1 = { version = "0.30", features = ["global-context"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
