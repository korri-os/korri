[package]
name = "korrid"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib"]

[[bin]]
name = "korrid"
path = "src/main.rs"

# The Android app's holder fixture; `cargo test` runs its own tests too.
[[example]]
name = "federation_fixture"
test = true
# Its holder keeps its game units in memory (src/host/fixture_units.rs).
required-features = ["fixture"]

[features]
# The federation fixture's in-memory launch units (#434 D10). Off in every
# shipped korrid; only the fixture example asks for it.
fixture = []
# The Android fixture APK's proof trigger for korrid's resize request (#476
# slice 3, `android_app::proof_resize_stream`). Off in every shipped korrid;
# only the app's feature `proof` asks for it.
proof = []

[dependencies]
korri-viewer-treaty = { path = "../../contracts/viewer" }
korri-input-trace = { path = "../../packages/input-trace" }
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
crc32fast = "1"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
hyper = { version = "1", features = ["client", "server", "http1"] }
http-body-util = "0.1"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server", "tls-ring"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
socket2 = "0.6"
subtle = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
netlink-packet-core = "0.9"
netlink-packet-route = "0.33"
netlink-sys = "0.9"
korri-settings-treaty = { path = "../../contracts/settings" }
toml_edit = "0.22"
korri-input-contract = { path = "../../contracts/input" }
korri-surface-treaty = { path = "../../contracts/surface" }
# Tungstenite logs complete messages/close frames at trace/debug. A surface host
# capability must stay private even when an embedding host enables trace logs.
# Cost: log-facade debug/trace diagnostics are unavailable across this build.
log = { version = "0.4", features = ["max_level_info", "release_max_level_info"] }
# ADR 0089: local discovery's pair tag uses ECDH on the device key. The same
# secp256k1 that nostr already links; nostr keeps its own ECDH private.
secp256k1 = "0.30"
nostr = { version = "0.45.4", default-features = false, features = ["std", "os-rng", "nip06", "nip44", "nip49", "nip59"] }
# ADR 0072: recovery words are BIP39 English words. nostr's nip06 uses this
# crate too; `zeroize` makes every parsed set of words erase itself on drop.
bip39 = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
# ADR 0070: 1Password's audited CPace for the join's key exchange, copied
# unchanged from https://github.com/1Password/cpace at commit
# 7e2e42c7d359969f4356292c2bd2cf3ff6eeeecc. Only src/join/cpace.rs uses it.
pake-cpace = { path = "vendor/pake-cpace" }
serde = { version = "1", features = ["derive"] }
# Declared release order (ADR 0013) depends on insertion order. toon-format
# already enables this feature; naming it keeps the dependency explicit.
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
serde_yaml = "0.9"
notify = "6.1"
sha2 = "0.10"
# ADR 0054: the Android app reads signed Nix file-cache archives without Nix.
base64 = "0.22"
ring = "0.17"
tar = "0.4"
lzma-rs = "0.3"
sha1 = "0.10"
regex = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "0.8"
url = "2.5"
tower-http = { version = "0.6", features = ["cors"] }
typeshare = "1"
zeroize = "1"
tempfile = "3"
xattr = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
# ADR 0030: korrid's own pure-Rust archive readers for store downloads, run in
# the sandbox unit. No encryption, no writing, no C code (zstd stays off).
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["bzip2", "ppmd"] }
rars = { version = "0.11.0", default-features = false }
# ADR 0083: korrid turns the Steam sign-in challenge into the surface's QR
# module grid; no image or SVG output.
qrcode = { version = "0.14", default-features = false }

rquickjs = { version = "0.14", features = ["macro", "bindgen", "loader", "allocator"] }
oxc = { version = "0.142.0", features = ["transformer", "codegen", "semantic"] }
proseql-engine = { path = ".cache/proseql/crates/proseql-engine" }
proseql-formats = { path = ".cache/proseql/crates/proseql-formats" }
proseql-storage = { path = ".cache/proseql/crates/proseql-storage" }

[target.'cfg(target_os = "linux")'.dependencies]
# TV-side edge only; the shell never links this reader.
evdev = { version = "0.13.2", features = ["stream-trait"] }
# ADR 0089: local discovery announces and browses with multicast DNS (DNS-SD).
mdns-sd = { version = "0.22", default-features = false, features = ["async", "logging"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# iroh's Android TLS verifier uses JNI 0.22. Keep the restored edge on 0.21;
# only its initialization crosses into the verifier's JNI runtime.
jni-runtime = { package = "jni", version = "0.22" }
rustls-platform-verifier = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
korri-inputd = { path = "../inputd" }
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }
secp256k1 = { version = "0.30", features = ["global-context"] }
tower = { version = "0.5", features = ["util"] }
# Tests build small 7z and rar fixtures in code, including encrypted ones.
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["compress", "aes256"] }
rars = { version = "0.11.0", default-features = false, features = ["write", "encryption"] }

# Match the embedded interpreter's release optimization in budgeted VM tests.
# Keep the Rust tests debuggable and leave the sandbox limits unchanged.
[profile.dev.package.rquickjs-sys]
opt-level = 3
