# Typeshare cannot infer Serde's untagged scalar union. Rust owns its decoder.
[typescript.type_mappings]
LaunchSettingScalar = "boolean | number | string"
# Exact legacy native-input literals and union, enforced by native_input.rs.
NativeInputDeviceClassWire = '"gamepad" | "keyboard" | "mouse" | "touch" | "system" | "unknown"'
NativeInputInputKindWire = '"input"'
NativeInputDeviceAddedKindWire = '"device-added"'
NativeInputDeviceRemovedKindWire = '"device-removed"'
NativeInputActionKindWire = '"action"'
NativeInputSystemActionWire = '"system"'
NativeInputEventWire = "NativeInputInput | NativeInputDeviceAdded | NativeInputDeviceRemoved | NativeInputAction"
# Exact transient lifecycle literals and struct union, enforced by native_input.rs.
NativeInputInitializationCompleteKindWire = '"initialization-complete"'
NativeInputDeviceStateCompleteKindWire = '"device-state-complete"'
NativeInputSuspendKindWire = '"suspend"'
NativeInputResumeKindWire = '"resume"'
NativeInputSuspendedKindWire = '"suspended"'
NativeInputControlWire = "NativeInputInitializationComplete | NativeInputDeviceStateComplete | NativeInputSuspend | NativeInputResume | NativeInputRetired"
NativeInputRetireKindWire = '"retire"'
NativeInputRetiredKindWire = '"retired"'

# Exact legacy provider discovery literals, enforced by discovery/provider.rs.
ProviderReleaseKindWire = '"provider-ref-release"'
ProviderReleaseConfidenceWire = '"high"'

# Exact ADR 0012 internally tagged union with ADR 0013's Queued, enforced by acquisition/types.rs.
ArtifactStateWire = '{ _tag: "Missing" } | { _tag: "Queued" } | { _tag: "Downloading"; file: number; fileCount: number; bytesDone: number; bytesTotal?: number; bytesPerSecond?: number } | { _tag: "Unpacking" } | { _tag: "Ready"; path: string } | { _tag: "Failed"; reason: RpcFailure }'

# Exact ADR 0016 provider protocol literals and unions, enforced by
# acquisition/claims.rs, acquisition/turns.rs and acquisition/types.rs.
ProviderClaimTagWire = '"ProviderClaim"'
ProviderClaimDetailsTagWire = '"ProviderClaimDetails"'
ArtifactKindWire = '"content" | "patch"'
FinalDownloadTagWire = '"FinalDownload"'
FinalDownloadMethodWire = '"POST"'
NonFinalDownloadTagWire = '"NonFinalDownload"'
FailedDownloadTagWire = '"FailedDownload"'
NonFinalDownloadReasonWire = '"interstitial" | "requires-user-action" | "unsupported"'
FailedDownloadReasonWire = '"provider-error" | "configuration" | "not-found" | "defective-provider"'
DownloadResolutionWire = "FinalDownload | NonFinalDownload | FailedDownload"
PluginHttpQueryValueWire = "string | number | boolean"
PluginHttpRequestsTagWire = '"HttpRequests"'
PluginSearchOutputWire = "PluginHttpRequests | ProviderClaim[]"
PluginDetailsOutputWire = "PluginHttpRequests | ProviderClaimDetails"
PluginResolveDownloadOutputWire = "PluginHttpRequests | DownloadResolution"
AcquireJobStateWire = '{ _tag: "Queued" } | { _tag: "Resolving" } | { _tag: "Downloading"; bytesDone: number; bytesTotal?: number; bytesPerSecond?: number } | { _tag: "Placing" } | { _tag: "Imported"; gameId: string } | { _tag: "Failed"; reason: RpcFailure } | { _tag: "Cancelled" }'

# Integer percent or device governor, decoded by launch_settings.
LaunchLimitValueWire = "number | string"
