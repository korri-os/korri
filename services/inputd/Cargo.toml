[package]
name = "korri-inputd"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "korri_inputd"
path = "src/lib.rs"

[[bin]]
name = "korri-inputd"
path = "src/main.rs"

[[bin]]
name = "korri-bundle-launch"
path = "src/bundle_launch.rs"

[[bin]]
name = "korri-bundle-select"
path = "src/bundle_select.rs"

[[bin]]
name = "korri-virtual-target-acl"
path = "src/virtual_target_acl.rs"

[[bin]]
name = "korri-sunshine-state-digest"
path = "src/sunshine_state_digest.rs"

[[bin]]
name = "korri-ledger-proof"
path = "src/ledger_proof.rs"

[dependencies]
evdev = { version = "0.13.2", features = ["stream-trait"] }
futures-util = "0.3"
korri-input-core = { path = "core" }
korri-input-contract = { path = "../../contracts/input" }
libc = "0.2"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }
# Native producer messages are private even if an embedding process enables trace.
log = { version = "0.4", features = ["max_level_info", "release_max_level_info"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
zbus = { version = "5.18.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "korri-input-seat-receiver"
path = "src/input_seat_receiver.rs"
