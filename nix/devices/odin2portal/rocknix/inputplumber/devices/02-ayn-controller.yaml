# ROCKNIX's AYN MCU capability map, with the Portal's observed sources and
# Korri's XB360 capture target. Verified on Odin over SSH: model below,
# rsinput-gamepad/input0, gpio-keys/input0 (volume-up), pmic_resin/input0
# (volume-down). Only the MCU is a gamepad-class source.
version: 1
kind: CompositeDevice
name: AYN Layout

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYN Odin 2 Portal

maximum_sources: 3
source_devices:
  - group: gamepad
    evdev:
      name: AYN Odin2 Gamepad
      phys_path: rsinput-gamepad/input0
      handler: event*
    capability_map_id: ayn_mcu

  - group: keyboard
    evdev:
      name: gpio-keys
      phys_path: gpio-keys/input0
      handler: event*
    capability_map_id: ayn_odin2portal_volume

  - group: keyboard
    evdev:
      name: pmic_resin
      phys_path: pmic_resin/input0
      handler: event*
    capability_map_id: ayn_odin2portal_volume

options:
  auto_manage: true

# inputd validates one XB360 target before forwarding to the Korri seats.
# No keyboard target: ROCKNIX's F1/Home shortcuts must not bypass the host.
# This leaves BTN_BACK unbound, as on the Mini V2. The original ayn_mcu map
# stays unchanged; the Portal has neither KEY_F24 nor paddle key capabilities.
target_devices:
  - xb360
