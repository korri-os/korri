# The running Portal exposes KEY_VOLUMEUP on gpio-keys and KEY_VOLUMEDOWN
# on pmic_resin. Route them through inputd, as on the RP Mini V2 and RG353M.
version: 2
kind: CapabilityMap
name: AYN Odin 2 Portal Hardware Volume
id: ayn_odin2portal_volume

mapping:
  - name: Volume Up
    source_events:
      - evdev:
          event_type: KEY
          event_code: KEY_VOLUMEUP
          value_type: button
    target_event:
      dbus: ui_volume_up

  - name: Volume Down
    source_events:
      - evdev:
          event_type: KEY
          event_code: KEY_VOLUMEDOWN
          value_type: button
    target_event:
      dbus: ui_volume_down

filtered_events: []
