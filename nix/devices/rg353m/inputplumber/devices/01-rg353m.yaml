# Extracted from nix-on-rocks packages/inputplumber-rk3566-maps/maps/devices/01-rg353m.yaml,
# imported by legacy:product/systems/nixos/images/platforms/rocknix-rk3566.nix.
# Native Linux exposes gpio-keys-control instead of ROCKNIX's retrogame_joypad.
version: 1
kind: CompositeDevice
name: Anbernic RG353M Layout
matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        # The working native SD image uses the RG353P DT with panel fixes.
        # These are its observed model and compatible strings, not ROCKNIX's.
        - name: model
          value: Anbernic
        - name: compatible
          value: "anbernic,rg353p*"
# One gamepad source keeps inputd's one-source ownership invariant. Sticks are
# a separate device on this kernel and are deliberately not claimed. The
# volume keys are a separate keyboard source, as on the RP Mini V2.
maximum_sources: 2
source_devices:
  - group: gamepad
    evdev:
      name: gpio-keys-control
      phys_path: gpio-keys/input0
      handler: event*
    capability_map_id: rocknix_rg353m_map
  - group: keyboard
    evdev:
      name: gpio-keys-vol
      # gpio_keys sets this phys for every instance; the name selects it.
      phys_path: gpio-keys/input0
      handler: event*
    capability_map_id: anbernic_rg353m_volume
options:
  auto_manage: true
# Same xb360 target selected by the legacy RK3566 composition. No keyboard
# translation or mouse emulation is needed for the browser Gamepad API.
target_devices:
  - xb360
