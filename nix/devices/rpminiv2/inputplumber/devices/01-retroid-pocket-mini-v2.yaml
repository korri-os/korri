# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
version: 1
kind: CompositeDevice
name: Retroid Pocket Mini V2 Layout

matches:
  - dmi_data:
      product_name: Retroid Pocket Mini V2

# The gamepad and the two separate hardware-volume input devices.
maximum_sources: 3

source_devices:
  - group: gamepad
    evdev:
      name: Retroid Pocket Gamepad
      phys_path: retroid-pocket-gamepad/input0
      handler: event*
    capability_map_id: retroid_pocket_mini_v2

  - group: keyboard
    evdev:
      name: gpio-keys
      phys_path: gpio-keys/input0
      handler: event*
    capability_map_id: retroid_pocket_mini_v2_volume

  - group: keyboard
    evdev:
      name: pm8941_resin
      handler: event*
    capability_map_id: retroid_pocket_mini_v2_volume

options:
  auto_manage: true

target_devices:
  - xb360
