# Claim the RG DS's GPIO gamepad and present it as one standard controller.
#
# Observed on the device: gpio-keys-control at gpio-keys/input0 carries the
# face buttons, D-pad, shoulders, triggers, stick clicks, Start and Select.
# /proc/device-tree/model reads "Anbernic RG DS". The analog stick is a
# separate adc-joystick device and the lid switch is a separate gpio-keys
# device; neither is claimed here.
version: 1
kind: CompositeDevice
name: Anbernic RG DS Layout
matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: "Anbernic RG DS"
        - name: compatible
          value: "anbernic,rg-ds*"
# Keep inputd's one-source ownership invariant, as the RG353M layout does.
maximum_sources: 1
source_devices:
  - group: gamepad
    evdev:
      name: gpio-keys-control
      phys_path: gpio-keys/input0
      handler: event*
    capability_map_id: rgds_map
options:
  auto_manage: true
# The browser Gamepad API reads this target directly; no keyboard translation
# or mouse emulation is introduced here.
target_devices:
  - xb360
